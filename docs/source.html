    return\n        if self.storage is None:\n            self.storage = {}\n            initialize_storage(data, self.storage, self.capacity, self.device, n_dim=self._ndim())\n            self._idx = 0\n            self._is_full = False\n            # let's store a key for easy inspection\n            self._non_nested_key = [k for k, v in self.storage.items() if not isinstance(v, Mapping)][0]\n\n        def add_new_data(data, storage, expected_dim: int):\n            for k, v in data.items():\n                if isinstance(v, Mapping):\n                    # If the value is a dictionary, recursively call the function\n                    add_new_data(v, storage=storage[k], expected_dim=expected_dim)\n                else:\n                    if v.ndim \u003c= self._ndim():\n                        raise RuntimeError(\n                            f\"Expected input values to have at least {self._ndim() + 1} dimensions, but got {v.shape}. Did you forget to add the batch dimension?\"\n                        )\n                    if v.shape[0] != expected_dim:\n                        raise ValueError(\"We expect all keys to have the same dimension\")\n                    end = self._idx + v.shape[0]\n                    if end >= self.capacity:\n                        # Wrap data\n                        diff = self.capacity - self._idx\n                        # fill up to the end\n                        storage[k][self._idx :] = _to_torch(v[:diff], device=self.device)\n                        # handle the remaning data\n                        if v[diff:].shape[0] > self.capacity:\n                            raise ValueError(\n                                \"The amount of data to put into buffer was way bigger than capacity. We do not currently handle this. Try extending in smaller batches / increase capacity.\"\n                            )\n                        storage[k][: v.shape[0] - diff] = _to_torch(v[diff:], device=self.device)\n                        self._is_full = True\n                    else:\n                        storage[k][self._idx : end] = _to_torch(v, device=self.device)\n\n        data_dim = data[self._non_nested_key].shape[0]\n        add_new_data(data, self.storage, expected_dim=data_dim)\n        self._idx = (self._idx + data_dim) % self.capacity\n\n    @torch.no_grad\n    def sample(self, batch_size) -> Dict[str, torch.Tensor]:\n        self.ind = torch.randint(0, len(self), (batch_size,))\n        return extract_values(self.storage, self.ind)\n\n    def get_full_buffer(self) -> Dict:\n        if self._is_full:\n            return self.storage\n        else:\n            return extract_values(self.storage, torch.arange(0, len(self)))\n\n    def save(self, folder: str | Path, nested_key_separator: str | None = None) -> None:\n        if not self.empty():\n            nested_key_separator = self.nested_key_separator if nested_key_separator is None else nested_key_separator\n            folder = Path(folder)\n            folder.mkdir(exist_ok=True, parents=True)\n            hf = h5py.File(str(folder / \"buffer.hdf5\"), \"w\")\n\n            def save_field(data, prefix: str = \"\", nested_key: str = \"-\"):\n                for k, v in data.items():\n                    if nested_key != \"\" and nested_key in k:\n                        raise ValueError(\n                            f\"For storing, we tried to use '{nested_key}' as a nested key, but it also appeared in key {k}. Change your dataset key names or the nested key separator\"\n                        )\n                    if isinstance(v, Mapping):\n                        save_field(v, prefix=f\"{prefix}{k}{nested_key}\")\n                    else:\n                        hf.create_dataset(f\"{prefix}{k}\", data=v[: len(self)].cpu().detach().numpy())\n\n            save_field(self.storage, nested_key=nested_key_separator)\n            hf.close()\n            # save config file\n            with (folder / \"config.json\").open(\"w+\") as f:\n                m_dict = dataclasses.asdict(self)\n                m_dict[\"_idx\"] = self._idx\n                m_dict[\"_is_full\"] = self._is_full\n                m_dict[\"__target__\"] = f\"{inspect.getmodule(self).__name__}.{self.__class__.__name__}\"\n                json.dump(m_dict, f, indent=4)\n\n    def load_hdf5(self, h5_file: str | Path, nested_key_separator: str | None = None) -> None:\n        nested_key_separator = nested_key_separator or self.nested_key_separator\n        hf = h5py.File(str(h5_file), \"r\")\n        storage = {}\n        storage_size_in_h5 = None\n        for k, v in hf.items():\n            splits = k.split(nested_key_separator)\n            current_dict = storage\n            for i in range(len(splits) - 1):\n                key = splits[i]\n                if key not in current_dict:\n                    current_dict[key] = {}\n                current_dict = current_dict[key]\n\n            storage_tensor = _to_torch(v[:], device=self.device)\n            if storage_tensor.shape[0] \u003c self.capacity:\n                # If the shape is smaller than capacity, we need to pad it\n                storage_tensor = torch.cat(\n                    [\n                        storage_tensor,\n                        torch.zeros(\n                            (self.capacity - storage_tensor.shape[0], *storage_tensor.shape[1:]),\n                            device=self.device,\n                            dtype=storage_tensor.dtype,\n                        ),\n                    ]\n                )\n            assert storage_tensor.shape[0] == self.capacity, (\n                f\"Data shape {storage_tensor.shape} is larger than buffer capacity {self.capacity}. Seems like the saved buffer is corrupted\"\n            )\n            assert storage_tensor.ndim > self._ndim(), (\n                f\"Data shape {storage_tensor.shape} has less than {self._ndim()} dimensions. Seems like the saved buffer is corrupted\"\n            )\n            current_dict[splits[-1]] = storage_tensor\n\n            if storage_size_in_h5 is None:\n                storage_size_in_h5 = v.shape[0]\n            else:\n                assert storage_size_in_h5 == v.shape[0], (\n                    f\"Batch dimension 0 is {v.shape[0]} for hdf5 entry {k} and it is different from the first shape {storage_size_in_h5}. Seems like the saved buffer is corrupted\"\n                )\n        hf.close()\n\n        self.storage = storage\n        self._non_nested_key = [k for k, v in self.storage.items() if not isinstance(v, Mapping)][0]\n\n        if self._idx is None:\n            # self._idx is set to None when loading from an old file with no _idx\n            # so we do our best to recover it here\n            self._idx = storage_size_in_h5 % self.capacity\n            self._is_full = storage_size_in_h5 == self.capacity\n\n    @classmethod\n    def load(cls, path: str, device: str | None = None) -> DictBuffer:\n        path = Path(path)\n        with (path / \"config.json\").open() as f:\n            loaded_config = json.load(f)\n        if \"__target__\" in loaded_config:\n            del loaded_config[\"__target__\"]\n        # Old buffers might not have these values\n        _idx = None\n        _is_full = None\n        if \"_idx\" in loaded_config:\n            _idx = loaded_config.pop(\"_idx\")\n            _is_full = loaded_config.pop(\"_is_full\")\n        else:\n            warnings.warn(\n                \"Loading a buffer without _idx and _is_full. Instead we assume _idx is current length of the buffer. Newly saved buffers have this fixed\"\n            )\n        buffer = cls(**loaded_config)\n        buffer._idx = _idx\n        buffer._is_full = _is_full\n        buffer.load_hdf5(path / \"buffer.hdf5\")\n        return buffer\n\n\ndef extract_values(d: Dict, idxs: List | torch.Tensor | np.ndarray) -> Dict:\n    result = {}\n    for k, v in d.items():\n        if isinstance(v, Mapping):\n            result[k] = extract_values(v, idxs)\n        else:\n            result[k] = v[idxs]\n    return result\n\n\ndef initialize_storage(data: Dict, storage: Dict, capacity: int, device: Device, n_dim: int = 1) -> None:\n    def recursive_initialize(d, s):\n        for k, v in d.items():\n            if isinstance(v, Mapping):\n                s[k] = {}\n                recursive_initialize(v, s[k])\n            else:\n                assert v.ndim >= n_dim, f\"Expected at least {n_dim} dimensions for key {k}, got {v.ndim}\"\n                # Initialize the storage with zeros by setting shape (capacity,) + v.shape\n                s[k] = torch.zeros(\n                    (capacity, *v.shape[1:]) if len(v.shape) > n_dim else (capacity, *v.shape[1:], 1),\n                    device=device,\n                    dtype=dtype_numpytotorch(v.dtype),\n                )\n\n    recursive_initialize(data, storage)\n\n\ndef dtype_numpytotorch(np_dtype: Any) -> torch.dtype:\n    if isinstance(np_dtype, torch.dtype):\n        return np_dtype\n    if np_dtype == np.float16:\n        return torch.float16\n    elif np_dtype == np.float32:\n        return torch.float32\n    elif np_dtype == np.float64:\n        return torch.float64\n    elif np_dtype == np.int16:\n        return torch.int16\n    elif np_dtype == np.int32:\n        return torch.int32\n    elif np_dtype == np.int64:\n        return torch.int64\n    elif np_dtype == bool:  # noqa E721\n        return torch.bool\n    elif np_dtype == np.uint8:\n        return torch.uint8\n    else:\n        raise ValueError(f\"Unknown type {np_dtype}\")\n\n\ndef dtype_numpytotorch_lower_precision(np_dtype: Any) -> torch.dtype:\n    \"\"\"\n    Returns a lower precision dtype for the given numpy dtype.\n    Mainly float64 to float32\n    \"\"\"\n    th_dtype = dtype_numpytotorch(np_dtype)\n    if th_dtype == torch.float64:\n        return torch.float32\n    return th_dtype\n", "humanoidverse/agents/evaluations/humanoidverse_isaac.py": "\nimport collections\nimport functools\nimport numbers\nimport random\nimport time\nfrom concurrent.futures import ProcessPoolExecutor, ThreadPoolExecutor\nfrom typing import Any, Dict, Mapping\nimport dataclasses\nfrom collections import defaultdict\nimport copy\n\nimport mujoco\nimport numpy as np\nimport ot\nimport torch\nfrom torch.utils._pytree import tree_map\nfrom tqdm import tqdm\nfrom humanoidverse.utils.helpers import get_reference_proprioception\n\nfrom ..buffers.trajectory import TrajectoryDictBufferMultiDim\nfrom ..envs.humanoidverse_isaac import HumanoidVerseIsaacConfig, HumanoidVerseVectorEnv, IsaacRendererWithMuJoco\nfrom .base import BaseEvalConfig, extract_model\n\ndef get_next(field: str, data: Any):\n    if \"next\" in data and field in data[\"next\"]:\n        return data[\"next\"][field]\n    elif f\"next_{field}\" in data:\n        return data[f\"next_{field}\"]\n    else:\n        raise ValueError(f\"No next of {field} found in data.\")\n\n\n@dataclasses.dataclass\nclass Episode:\n    storage: Dict | None = None\n\n    def initialise(self, observation: np.ndarray | Dict[str, np.ndarray], info: Dict) -> None:\n        if self.storage is None:\n            self.storage = defaultdict(list)\n        if isinstance(observation, Mapping):\n            self.storage[\"observation\"] = {k: [copy.deepcopy(v)] for k, v in observation.items()}\n        else:\n            self.storage[\"observation\"].append(copy.deepcopy(observation))\n        self.storage[\"info\"] = {\n            k: [copy.deepcopy(v)] for k, v in info.items() if not k.startswith(\"_\") and k not in [\"final_observation\", \"final_info\"]\n        }\n\n    def add(\n        self,\n        observation: np.ndarray | Dict[str, np.ndarray],\n        reward: np.ndarray,\n        action: np.ndarray,\n        terminated: np.ndarray,\n        truncated: np.ndarray,\n        info: Dict,\n    ) -> None:\n        if isinstance(observation, Mapping):\n            for k, v in observation.items():\n                self.storage[\"observation\"][k].append(copy.deepcopy(v))\n        else:\n            self.storage[\"observation\"].append(copy.deepcopy(observation))\n        for k, v in info.items():\n            if not k.startswith(\"_\") and k not in [\"final_observation\", \"final_info\"]:\n                if k in self.storage[\"info\"]:\n                    # this is a quick fix but not robust fix to the problem that certain environments may return keys that are different from the one in the first step\n                    # We may want to find a different solution to deal with this problem\n                    self.storage[\"info\"][k].append(copy.deepcopy(v))\n                else:\n                    self.storage[\"info\"][k] = [copy.deepcopy(v)]\n        self.storage[\"reward\"].append(copy.deepcopy(reward))\n        self.storage[\"action\"].append(copy.deepcopy(action))\n        self.storage[\"terminated\"].append(copy.deepcopy(terminated))\n        self.storage[\"truncated\"].append(copy.deepcopy(truncated))\n\n    def get(self) -> Dict[str, np.ndarray]:\n        output = {}\n        for k, v in self.storage.items():\n            if k in [\"observation\", \"info\"]:\n                if isinstance(v, Mapping):\n                    output[k] = {}\n                    for k2, v2 in v.items():\n                        output[k][k2] = np.array(v2)\n                else:\n                    output[k] = np.array(v)\n            else:\n                output[k] = np.array(v)\n        return output\n\nxpos_bodies = [\n    \"pelvis\",\n    \"left_hip_pitch_link\",\n    \"left_hip_roll_link\",\n    \"left_hip_yaw_link\",\n    \"left_knee_link\",\n    \"left_ankle_pitch_link\",\n    \"left_ankle_roll_link\",\n    \"right_hip_pitch_link\",\n    \"right_hip_roll_link\",\n    \"right_hip_yaw_link\",\n    \"right_knee_link\",\n    \"right_ankle_pitch_link\",\n    \"right_ankle_roll_link\",\n    \"waist_yaw_link\",\n    \"waist_roll_link\",\n    \"torso_link\",\n    \"left_shoulder_pitch_link\",\n    \"left_shoulder_roll_link\",\n    \"left_shoulder_yaw_link\",\n    \"left_elbow_link\",\n    # \"left_wrist_roll_link\",\n    # \"left_wrist_pitch_link\",\n    # \"left_wrist_yaw_link\",\n    \"right_shoulder_pitch_link\",\n    \"right_shoulder_roll_link\",\n    \"right_shoulder_yaw_link\",\n    \"right_elbow_link\",\n    # \"right_wrist_roll_link\",\n    # \"right_wrist_pitch_link\",\n    # \"right_wrist_yaw_link\",\n]\n\ndef get_backward_observation(env, motion_id, include_last_action, velocity_multiplier: float = 1.0) -> torch.Tensor:\n    import numpy as np\n    from humanoidverse.envs.legged_robot_motions.legged_robot_motions import (\n        compute_humanoid_observations_max,\n        compute_humanoid_observations_max_with_contact,\n    )\n    from humanoidverse.utils.torch_utils import quat_rotate_inverse\n\n    motion_times = torch.arange(int(np.ceil((env._motion_lib._motion_lengths[motion_id] / env.dt).cpu()))).to(env.device) * env.dt\n    # motion_times = torch.arange(0, env._motion_lib._motion_num_frames.item() * frame_interval, frame_interval, device=env.device)\n\n    # get blend motion state\n    motion_state = env._motion_lib.get_motion_state(motion_id, motion_times)\n\n    ref_body_pos = motion_state[\"rg_pos_t\"]\n    ref_body_rots = motion_state[\"rg_rot_t\"]\n    ref_body_vels = motion_state[\"body_vel_t\"] * velocity_multiplier\n    ref_body_angular_vels = motion_state[\"body_ang_vel_t\"] * velocity_multiplier\n    ref_dof_pos = motion_state[\"dof_pos\"] - env.default_dof_pos[0]\n    ref_dof_vel = motion_state[\"dof_vel\"] * velocity_multiplier\n\n    # npz_path = \"dataprocess/push_door-3steps-no_door_amass-robot_only-processed/motion.npz\"\n    # data_npz = np.load(npz_path)\n    # data_dict = {key: data_npz[key] for key in data_npz.files}\n\n    def process_body_data(data_dict, device=\"cuda\"):\n        def extract_and_concat_vec3(arr: torch.Tensor) -> torch.Tensor:\n            arr = arr.float()\n            # arr: (T, N, 3)\n            return torch.cat(\n                [\n                    arr[:, 0:13],\n                    torch.zeros_like(arr[:, 14:16]),  # \u4e24\u4e2a\u8865 0\n                    arr[:, 13:18],\n                    arr[:, 21:25],\n                    arr[:, 20:21],\n                    arr[:, 27:28],\n                    arr[:, 12:13],\n                ],\n                dim=1,\n            )\n\n        def extract_and_concat_quat_torch(arr: torch.Tensor) -> torch.Tensor:\n            arr = arr.float()\n            # arr: (T, N, 4), wxyz\n            seg1 = arr[:, 0:13]\n            seg2 = torch.tensor([1, 0, 0, 0], dtype=arr.dtype, device=arr.device).view(1, 1, 4).repeat(arr.shape[0], 2, 1)\n            seg3 = arr[:, 13:18]\n            seg4 = arr[:, 21:25]\n            seg7 = arr[:, 12:13]\n            seg5 = arr[:, 20:21]\n            seg6 = arr[:, 27:28]\n            quat_wxyz = torch.cat([seg1, seg2, seg3, seg4, seg5, seg6, seg7], dim=1)  # (T, 24, 4)\n            quat_xyzw = torch.cat([quat_wxyz[..., 1:], quat_wxyz[..., :1]], dim=-1)  # (T, 24, 4)\n            return quat_xyzw\n\n        # \u8f6c\u4e3a torch tensor \u5e76\u9001\u5230 GPU\n        body_pos = torch.from_numpy(data_dict[\"body_pos_w\"]).to(device)\n        body_quat = torch.from_numpy(data_dict[\"body_quat_w\"]).to(device)\n        body_lin_vel = torch.from_numpy(data_dict[\"body_lin_vel_w\"]).to(device)\n        body_ang_vel = torch.from_numpy(data_dict[\"body_ang_vel_w\"]).to(device)\n        joint_pos = torch.from_numpy(data_dict[\"joint_pos\"]).to(device)[:, 1:]\n        joint_vel = torch.from_numpy(data_dict[\"joint_vel\"]).to(device)[:, 1:]\n\n        # \u5904\u7406\n        ref_body_pos = extract_and_concat_vec3(body_pos)\n        ref_body_vels = extract_and_concat_vec3(body_lin_vel)\n        ref_body_angular_vels = extract_and_concat_vec3(body_ang_vel)\n        ref_body_rots = extract_and_concat_quat_torch(body_quat)\n        ref_dof_pos = joint_pos.float() - env.default_dof_pos[0]\n        ref_dof_vel = joint_vel.float()\n\n        return ref_body_pos, ref_body_rots, ref_body_vels, ref_body_angular_vels, ref_dof_pos, ref_dof_vel\n\n    # import ipdb; ipdb.set_trace()\n    # ref_body_pos, ref_body_rots, ref_body_vels, ref_body_angular_vels, ref_dof_pos, ref_dof_vel = process_body_data(data_dict)\n\n    # construct observation\n    if env.use_contact_in_obs_max:\n        contact_binary = env.foot_contact_detect(ref_body_pos, ref_body_vels)\n        obs_dict = compute_humanoid_observations_max_with_contact(\n            ref_body_pos,\n            ref_body_rots,\n            ref_body_vels,\n            ref_body_angular_vels,\n            local_root_obs=True,\n            root_height_obs=env.config.obs.root_height_obs,\n            contact_binary=contact_binary,\n        )\n    else:\n        obs_dict = compute_humanoid_observations_max(\n            ref_body_pos,\n            ref_body_rots,\n            ref_body_vels,\n            ref_body_angular_vels,\n            local_root_obs=True,\n            root_height_obs=env.config.obs.root_height_obs,\n        )\n    max_local_self_obs = torch.cat([v for v in obs_dict.values()], dim=-1)\n\n    if env.config.obs.use_obs_filter:\n        base_quat = ref_body_rots[:, 0]  # root orientation\n        # ref_dof_pos = motion_state[\"dof_pos\"] - env.default_dof_pos[0]\n        # ref_dof_vel = motion_state[\"dof_vel\"]\n        ref_ang_vel = ref_body_angular_vels[:, 0]\n        projected_gravity = quat_rotate_inverse(base_quat, env.gravity_vec[0:1].repeat(max_local_self_obs.shape[0], 1), w_last=True)\n        bogus_actions = ref_dof_pos\n\n        bogus_history_actor = torch.cat([bogus_actions, ref_ang_vel, ref_dof_pos, ref_dof_vel, projected_gravity], dim=-1).repeat(1, 4)\n        # obs = torch.cat([bogus_actions, ref_ang_vel, ref_dof_pos, ref_dof_vel, bogus_history_actor, max_local_self_obs, projected_gravity], dim=-1)\n        ref_dict = {\n            \"actions\": bogus_actions,\n            \"ref_ang_vel\": ref_ang_vel,\n            \"ref_dof_pos\": ref_dof_pos,\n            \"dof_pos\": motion_state[\"dof_pos\"],\n            \"ref_dof_vel\": ref_dof_vel,\n            \"dof_vel\": motion_state[\"dof_vel\"],\n            \"fake_history\": bogus_history_actor,\n            \"max_local_self_obs\": max_local_self_obs,\n            \"projected_gravity\": projected_gravity,\n            \"ref_body_pos\": ref_body_pos,\n            \"ref_body_rots\": ref_body_rots,\n            \"ref_body_vels\": ref_body_vels,\n            \"ref_body_angular_vels\": ref_body_angular_vels,\n            \"root_pos\": motion_state[\"root_pos\"],\n            \"root_rot\": motion_state[\"root_rot\"],\n            \"root_vel\": motion_state[\"root_vel\"],\n            \"root_ang_vel\": motion_state[\"root_ang_vel\"],\n        }\n    else:\n        # obs = max_local_self_obs\n        ref_dict = {\n            \"max_local_self_obs\": max_local_self_obs,\n        }\n\n    proprioception = get_reference_proprioception(\n        env, motion_state[\"dof_pos\"], ref_dof_vel, ref_body_rots[:, 0], ref_body_angular_vels[:, 0]\n    )\n    g1env_state = torch.cat(list(proprioception.values()), dim=-1)\n    bogus_actions = ref_dof_pos\n    g1env_last_action = bogus_actions\n\n    g1env_privileged_obs = ref_dict[\"max_local_self_obs\"]\n\n    g1env_obs = {\n        \"state\": g1env_state,\n        \"privileged_state\": g1env_privileged_obs,\n    }\n\n    if include_last_action:\n        # NOTE we multiply by zero to align with mujoco data\n        g1env_obs[\"last_action\"] = g1env_last_action * 0\n\n    return g1env_obs, ref_dict\n\n\nclass HumanoidVerseIsaacTrackingEvaluationConfig(BaseEvalConfig):\n    name_in_logs: str = \"humanoidverse_tracking_eval\"\n    env: HumanoidVerseIsaacConfig | None = None\n    # Used if above env is provided\n    num_envs: int = 1024\n\n    n_episodes_per_motion: int = 1\n    include_results_from_all_envs: bool = False  # If True, include results from all num_envs envs, not just first num_motions\n\n    disable_tqdm: bool = True\n\n    def build(self):\n        return HumanoidVerseIsaacTrackingEvaluation(self)\n\n\nclass HumanoidVerseIsaacTrackingEvaluation:\n    def __init__(self, config: HumanoidVerseIsaacTrackingEvaluationConfig):\n        self.cfg = config\n\n    def run(self, *, timestep, agent_or_model, logger, env: HumanoidVerseVectorEnv | None = None, **kwargs) -> Dict[str, Any]:\n        if env is None:\n            if self.cfg.env is None:\n                raise ValueError(\"Either env or cfg.env must be provided\")\n            env, _ = self.cfg.env.build(num_envs=self.cfg.num_envs)\n        else:\n            if self.cfg.env is not None:\n                raise ValueError(\"Both env and cfg.env are provided, please provide only one (which one you want to evaluate with?)\")\n        # NOTE: this is not used as it disables some domain randomization we want to keep for evaluation\n        # env._env.set_is_evaluating()\n\n        self.motion_ids = list(range(env._env._motion_lib._num_unique_motions))\n        n_envs = env._env.num_envs\n\n        # \"Parallelization\" is handled on the worker level.\n        metrics = {}\n        for repetition_i in range(self.cfg.n_episodes_per_motion):\n            run_metrics = {}\n            # If we have less envs than motions, we run iteratively over the motions\n            for motion_id_chunk_start in range(0, len(self.motion_ids), n_envs):\n                motion_id_chunk = self.motion_ids[motion_id_chunk_start : motion_id_chunk_start + n_envs]\n                motion_chunk_results = _async_tracking_worker(\n                    (motion_id_chunk, 0, agent_or_model),\n                    env=env,\n                    disable_tqdm=self.cfg.disable_tqdm,\n                    include_results_from_all_envs=self.cfg.include_results_from_all_envs,\n                )\n                for k, v in motion_chunk_results.items():\n                    assert k not in run_metrics, \"Tried to override existing metric\"\n                    run_metrics[k] = v\n\n            if self.cfg.n_episodes_per_motion == 1:\n                # Just return metrics, do not change names\n                metrics = run_metrics\n            else:\n                # Append run number to metric names\n                for k, v in run_metrics.items():\n                    metrics[f\"{k}_repetition#{repetition_i}\"] = v\n\n        aggregate = collections.defaultdict(list)\n        wandb_dict = {}\n        for _, metr in metrics.items():\n            for k, v in metr.items():\n                if isinstance(v, numbers.Number):\n                    aggregate[k].append(v)\n        for k, v in aggregate.items():\n            wandb_dict[k] = np.mean(v)\n            wandb_dict[f\"{k}#std\"] = np.std(v)\n\n        if logger is not None:\n            for k, v in metrics.items():\n                v[\"motion_name\"] = k\n                v[\"timestep\"] = timestep\n                logger.log(v)\n\n        # Resume back to original state of the motion lib if we were using shared env\n        if self.cfg.env is None:\n            env._env._motion_lib.load_motions_for_training()\n        env._env.set_is_training()\n\n        return metrics, wandb_dict\n\n    def close(self) -> None:\n        if self.mp_manager is not None:\n            self.mp_manager.shutdown()\n\n\ndef group_assign_motions_to_envs_with_map(motion_ids, num_envs, device=None):\n    motion_ids = torch.tensor(motion_ids, device=device)\n    num_motions = len(motion_ids)\n\n    env_idxs = list(range(num_envs))\n    # Shuffle the environment indices to assign random motion to each env.\n    # This is to apply domain randomization on tracking at random: isaacsim has fixed mass/friction\n    # randomization per env, so assigning same motion to same env would mean we always evaluate the motion\n    # with same mass/friction settings.\n    random.shuffle(env_idxs)\n    shuffled_env_idxs = torch.tensor(env_idxs, device=device, dtype=torch.long)\n\n    assigned = motion_ids[shuffled_env_idxs % num_motions]\n\n    motion_to_envs = {}\n    for env_id, motion_id in enumerate(assigned.tolist()):\n        motion_to_envs.setdefault(motion_id, []).append(env_id)\n\n    return assigned, motion_to_envs\n\n\ndef _async_tracking_worker(\n    inputs, env: HumanoidVerseVectorEnv, disable_tqdm: bool = False, include_results_from_all_envs=False\n):\n    motion_ids, pos, agent = inputs\n    model = extract_model(agent)\n    # import ipdb; ipdb.set_trace()\n    # motion_ids = torch.tensor(motion_ids, device=env.device)\n    isaac_env = env._env\n\n    if not isaac_env._motion_lib.all_motions_loaded:\n        isaac_env._motion_lib.all_motions_loaded = True\n        isaac_env._motion_lib.load_motions(random_sample=False, num_motions_to_load=isaac_env._motion_lib._num_unique_motions, start_idx=0)\n\n    metrics = {}\n    num_envs = isaac_env.num_envs\n\n    # Assign motions to envs in grouped fashion\n    assigned_motions, motion_to_envs = group_assign_motions_to_envs_with_map(motion_ids, num_envs)\n\n    ctx_dict = {}\n    tracking_targets = {}\n    # target_xpos_dict = {}\n    tracking_joint_pos = {}\n    dof_states_list = [None] * num_envs\n    root_states_list = [None] * num_envs\n\n    # Precompute context and target states per motion\n    for m_id in motion_ids:\n        tracking_target, tracking_target_dict = get_backward_observation(env._env, m_id, include_last_action=env.include_last_action)\n        # first z should try to reach the next state, ie 1:\n        z = model.backward_map(tree_map(lambda x: x[1:], tracking_target)).clone()\n        for step in range(z.shape[0]):\n            end_idx = min(step + 1, z.shape[0])\n            z[step] = z[step:end_idx].mean(dim=0)\n        ctx = model.project_z(z)\n        ctx_dict[m_id] = ctx\n        tracking_targets[m_id] = tree_map(lambda x: x.cpu(), tracking_target)\n        tracking_joint_pos[m_id] = tracking_target_dict[\"dof_pos\"].clone()\n        # import ipdb; ipdb.set_trace()\n\n        ref_body_rots = tracking_target_dict[\"ref_body_rots\"][0, 0]\n        if env._env.simulator.__class__.__name__ == \"IsaacSim\":\n            # Avoid importing isaacsim as that breaks unless isaaclab is initialized\n            ref_body_rots = ref_body_rots[[3, 0, 1, 2]]\n\n        ref_root_init_state = torch.cat(\n            [\n                tracking_target_dict[\"ref_body_pos\"][0, 0],\n                ref_body_rots,\n                tracking_target_dict[\"ref_body_vels\"][0, 0],\n                tracking_target_dict[\"ref_body_angular_vels\"][0, 0],\n            ]\n        )\n        # import ipdb; ipdb.set_trace()\n        for env_id in motion_to_envs[m_id]:\n            dof_init_state = torch.zeros_like(isaac_env.simulator.dof_state.view(num_envs, -1, 2)[0])\n            dof_init_state[..., 0] = tracking_target_dict[\"dof_pos\"][0]\n            dof_init_state[..., 1] = tracking_target_dict[\"ref_dof_vel\"][0]\n            dof_states_list[env_id] = dof_init_state\n            root_states_list[env_id] = ref_root_init_state\n            # target_xpos_dict[env_id] = tracking_target_dict[\"ref_body_pos\"][:, : len(xpos_bodies)]\n\n    # this is for environments that are not initialized\n    for i in range(num_envs):\n        if dof_states_list[i] is None:\n            dof_states_list[i] = torch.zeros_like(isaac_env.simulator.dof_state.view(num_envs, -1, 2)[0])\n        if root_states_list[i] is None:\n            root_states_list[i] = torch.zeros_like(root_states_list[0])\n\n    target_states = {\"dof_states\": torch.stack(dof_states_list), \"root_states\": torch.stack(root_states_list)}\n\n    env_ids = list(range(num_envs))\n    env_ids = torch.tensor(env_ids, dtype=torch.long, device=isaac_env.device)\n\n    with torch.no_grad():\n        observation, info = env.reset(target_states=target_states, to_numpy=False)\n        assert torch.allclose(env._env.simulator.dof_pos.clone()[env_ids], target_states[\"dof_states\"][..., 0])\n\n        if env.context_length:\n            env._update_history(torch.arange(num_envs, device=isaac_env.device), observation, None)\n            observation[\"history\"] = {\"observation\": [], \"action\": []}\n\n        # info = {}\n        obs_cpu = tree_map(lambda x: x.cpu() if torch.is_tensor(x) else x, observation)\n        info_cpu = tree_map(lambda x: x.cpu() if torch.is_tensor(x) else x, info)\n\n        _episode = Episode()\n        ooo = {k: v for k, v in obs_cpu.items() if k != \"history\"}\n        _episode.initialise(ooo, info_cpu)\n\n        xpos_log = [isaac_env.simulator._rigid_body_pos.reshape(num_envs, -1, 3)]\n        joint_pos = [isaac_env.simulator.dof_state[..., 0]]\n        joint_vel = [isaac_env.simulator.dof_state[..., 1]]\n\n        max_ctx_len = max([ctx.shape[0] for ctx in ctx_dict.values()])\n        for step in tqdm(range(max_ctx_len), desc=\"Tracking Evaluation\", disable=disable_tqdm):\n            ctx_batch = []\n            for env_id in range(num_envs):\n                m_id = assigned_motions[env_id].item()\n                ctx = ctx_dict[m_id]\n                ctx_t = ctx[step % ctx.shape[0]]\n                ctx_batch.append(ctx_t)\n            ctx_batch = torch.stack(ctx_batch)\n            action = agent.act(observation, ctx_batch, mean=True)\n            observation, reward, terminated, truncated, info = env.step(action, to_numpy=False)\n            joint_pos.append(isaac_env.simulator.dof_state[..., 0])\n            joint_vel.append(isaac_env.simulator.dof_state[..., 1])\n            xpos_log.append(isaac_env.simulator._rigid_body_pos.reshape(num_envs, -1, 3))\n\n            ooo = {k: v for k, v in observation.items() if k != \"history\"}\n            _episode.add(\n                tree_map(lambda x: x.cpu(), ooo),\n                reward.cpu(),\n                action.cpu(),\n                terminated.cpu(),\n                truncated.cpu(),\n                tree_map(lambda x: x.cpu(), info),\n            )\n\n        episode_data = _episode.get()\n        episode_data[\"xpos\"] = torch.stack(xpos_log)[:-1]\n        joint_pos = torch.stack(joint_pos)\n        joint_vel = torch.stack(joint_vel)\n\n        for m_id, envs_with_current_motion in motion_to_envs.items():\n            for motion_repetition, env_id in enumerate(envs_with_current_motion):\n                # A motion was executed on multiple environments\n                # we average the results\n                _joint_pos = joint_pos[: ctx_dict[m_id].shape[0] + 1, env_id]\n                _target_joint_pos = tracking_joint_pos[m_id]\n                local_metrics = _calc_metrics(\n                    {\n                        # \"xpos\": episode_data[\"xpos\"][0 : ctx_dict[m_id].shape[0], env_id],\n                        # \"target_xpos\": target_xpos_dict[env_id],\n                        \"tracking_target\": tracking_targets[m_id],\n                        \"motion_id\": m_id,\n                        \"motion_file\": isaac_env._motion_lib.curr_motion_keys[m_id],\n                        \"observation\": tree_map(lambda x: x[0 : ctx_dict[m_id].shape[0] + 1, env_id], episode_data[\"observation\"]),\n                        \"joint_pos\": _joint_pos,\n                        \"target_joint_pos\": _target_joint_pos,\n                        \"dt\": isaac_env.dt,\n                    },\n                )\n\n                # Rename the metrics so that repetitions do not overlap\n                assert len(local_metrics) == 1\n                metric_key = list(local_metrics.keys())[0]\n\n                if include_results_from_all_envs:\n                    metrics[f\"{metric_key}_repetition#{motion_repetition}\"] = local_metrics[metric_key]\n                else:\n                    # Retain the original motion name without \"repetition#\"\n                    # Note that this means that motions with the same name get overriden, so you only get one result\n                    metrics[metric_key] = local_metrics[metric_key]\n                    break\n\n    return metrics\n\n\n\ndef distance_matrix(X: torch.Tensor, Y: torch.Tensor):\n    X_norm = X.pow(2).sum(1).reshape(-1, 1)\n    Y_norm = Y.pow(2).sum(1).reshape(1, -1)\n    val = X_norm + Y_norm - 2 * torch.matmul(X, Y.T)\n    return torch.sqrt(torch.clamp(val, min=0))\n\n\ndef emd_numpy(next_obs: torch.Tensor, tracking_target: torch.Tensor, prefix=\"\"):\n    # keep only pose part of the observations\n    agent_obs = next_obs.to(\"cpu\")\n    tracked_obs = tracking_target.to(\"cpu\")\n    # compute optimal transport cost\n    cost_matrix = distance_matrix(agent_obs, tracked_obs).cpu().detach().numpy()\n    X_pot = np.ones(agent_obs.shape[0]) / agent_obs.shape[0]\n    Y_pot = np.ones(tracked_obs.shape[0]) / tracked_obs.shape[0]\n    transport_cost = ot.emd2(X_pot, Y_pot, cost_matrix, numItermax=100000)\n    return {f\"{prefix}emd\": transport_cost}\n\n\ndef distance_proximity(next_obs: torch.Tensor, tracking_target: torch.Tensor, bound: float = 2.0, margin: float = 2, prefix=\"\"):\n    stats = {}\n    dist = torch.norm(next_obs - tracking_target, dim=-1)\n    in_bounds_mask = dist \u003c= bound\n    out_bounds_mask = dist > bound + margin\n    stats[f\"{prefix}proximity\"] = (in_bounds_mask + ((bound + margin - dist) / margin) * (~in_bounds_mask) * (~out_bounds_mask)).mean()\n    stats[f\"{prefix}distance\"] = dist.mean()\n    return stats\n\n\ndef _calc_metrics(ep):\n    metr = {}\n    num_joints = ep[\"joint_pos\"].shape[-1]\n    next_obs = torch.as_tensor(ep[\"observation\"][\"state\"][:, :num_joints], dtype=torch.float32)\n    tracking_target = torch.as_tensor(ep[\"tracking_target\"][\"state\"][:, :num_joints], dtype=torch.float32)\n    dist_prox_res = distance_proximity(next_obs=next_obs, tracking_target=tracking_target, prefix=\"obs_state_\")\n    metr.update(dist_prox_res)\n    emd_res = emd_numpy(next_obs=next_obs, tracking_target=tracking_target, prefix=\"obs_state_\")\n    metr.update(emd_res)\n    # # add distance wrt xpos\n    # xpos = torch.tensor(ep[\"xpos\"], dtype=torch.float32).view(ep[\"xpos\"].shape[0], -1)  # [keyframes, 72]\n    # target_xpos = torch.tensor(ep[\"target_xpos\"], dtype=torch.float32).view(ep[\"target_xpos\"].shape[0], -1)\n    # target_xpos = target_xpos[:tracking_length]\n\n    # dist_prox_res = distance_proximity(next_obs=xpos, tracking_target=target_xpos)\n    # for k, v in dist_prox_res.items():\n    #     metr[f\"{k}_xpos\"] = v\n    # # import ipdb; ipdb.set_trace()\n    # metr[\"emd_xpos\"] = emd_numpy(next_obs=xpos, tracking_target=target_xpos)[\"emd\"]\n    # jpos_pred = xpos.reshape(xpos.shape[0], -1, 3)  # length x 23 x 3\n    # jpos_gt = target_xpos.reshape(target_xpos.shape[0], -1, 3)  # length x 23 x 3\n    # metr[\"success_phc_linf_xpos\"] = torch.all(torch.norm(jpos_pred - jpos_gt, dim=-1) \u003c= 0.5).float()\n    # metr[\"success_phc_mean_xpos\"] = torch.all(torch.norm(jpos_pred - jpos_gt, dim=-1).mean(dim=-1) \u003c= 0.5).float()\n\n    # phc metrics\n    phc_metrics = compute_joint_pos_metrics(joint_pos=ep[\"joint_pos\"], target_joint_pos=ep[\"target_joint_pos\"], dt=ep[\"dt\"])\n    metr.update(phc_metrics)\n    for k, v in metr.items():\n        if isinstance(v, torch.Tensor):\n            metr[k] = v.tolist()\n    metr[\"motion_id\"] = ep[\"motion_id\"]\n    metr[\"motion_file\"] = ep[\"motion_file\"]\n    return {ep[\"motion_file\"]: metr}\n\n\ndef compute_joint_pos_metrics(joint_pos, target_joint_pos, dt):\n    \"\"\"Joint-angle errors for [time, joint] arrays, with dt in seconds.\"\"\"\n    if not np.isfinite(dt) or dt \u003c= 0 or joint_pos.ndim != 2 or joint_pos.shape != target_joint_pos.shape or not joint_pos.numel():\n        raise ValueError(\"Expected nonempty matching [time, joint] arrays and a positive finite timestep.\")\n    error = joint_pos - target_joint_pos\n    stats = {\"joint_angle_l2_rad\": error.norm(dim=-1).mean()}\n    # A derivative is undefined when the clip has too few frames.\n    if error.shape[0] >= 2:\n        velocity_error = torch.diff(error, dim=0) / dt\n        stats[\"joint_velocity_l2_rad_s\"] = velocity_error.norm(dim=-1).mean()\n    if error.shape[0] >= 3:\n        acceleration_error = torch.diff(velocity_error, dim=0) / dt\n        stats[\"joint_acceleration_l2_rad_s2\"] = acceleration_error.norm(dim=-1).mean()\n\n    stats.update(\n        distance_proximity(next_obs=joint_pos, tracking_target=target_joint_pos, prefix=\"\")\n    )\n    stats.update(\n        emd_numpy(next_obs=joint_pos, tracking_target=target_joint_pos, prefix=\"\")\n    )\n    return stats\n", "humanoidverse/envs/legged_base_task/legged_robot_base.py": "from time import time\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport os\nimport sys\n\nfrom humanoidverse.utils.torch_utils import *\n# from isaacgym import gymtorch, gymapi, gymutil\n\nimport torch\nfrom torch import Tensor\nfrom typing import Tuple, Dict\n\nfrom humanoidverse.envs.env_utils.general import class_to_dict\nfrom humanoidverse.envs.base_task.base_task import BaseTask\n\nfrom humanoidverse.envs.env_utils.history_handler import HistoryHandler\nfrom termcolor import colored\nfrom humanoidverse.utils.helpers import parse_observation\nfrom humanoidverse.envs.env_utils.visualization import Point\nfrom datetime import datetime, timedelta\nimport imageio\nfrom loguru import logger\nimport copy\n\nclass LeggedRobotBase(BaseTask):\n    def __init__(self, config, device):\n        self.init_done = False\n        super().__init__(config, device)\n        self._domain_rand_config()\n        self._prepare_reward_function()\n        self.history_handler = HistoryHandler(self.num_envs, config.obs.obs_auxiliary, config.obs.obs_dims, device)\n        self.is_evaluating = False\n        self.init_done = True\n\n    def _init_buffers(self):\n        \"\"\" Initialize torch tensors which will contain simulation states and processed quantities\n        \"\"\"\n        super()._init_buffers()\n\n        self.base_quat = self.simulator.base_quat\n        self.rpy = get_euler_xyz_in_tensor(self.base_quat)\n\n        # initialize some data used later on\n        self._init_counters()\n        self.extras = {}\n        self.extras[\"aux_rewards\"] = {}\n        self.gravity_vec = to_torch(get_axis_params(-1., self.up_axis_idx), device=self.device).repeat((self.num_envs, 1))\n        self.forward_vec = to_torch([1., 0., 0.], device=self.device).repeat((self.num_envs, 1))\n        self.torques = torch.zeros(self.num_envs, self.dim_actions, dtype=torch.float, device=self.device, requires_grad=False)\n        self.p_gains = torch.zeros(self.dim_actions, dtype=torch.float, device=self.device, requires_grad=False)\n        self.d_gains = torch.zeros(self.dim_actions, dtype=torch.float, device=self.device, requires_grad=False)\n        self.actions = torch.zeros(self.num_envs, self.dim_actions, dtype=torch.float, device=self.device, requires_grad=False)\n        self.actions_after_delay = torch.zeros(self.num_envs, self.dim_actions, dtype=torch.float, device=self.device, requires_grad=False)\n        self.last_actions = torch.zeros(self.num_envs, self.dim_actions, dtype=torch.float, device=self.device, requires_grad=False)\n        self.last_dof_pos = torch.zeros_like(self.simulator.dof_pos)\n        self.last_dof_vel = torch.zeros_like(self.simulator.dof_vel)\n        self.last_root_vel = torch.zeros_like(self.simulator.robot_root_states[:, 7:13])\n        self.feet_air_time = torch.zeros(self.num_envs, self.feet_indices.shape[0], dtype=torch.float, device=self.device, requires_grad=False)\n        self.last_contacts = torch.zeros(self.num_envs, len(self.feet_indices), dtype=torch.bool, device=self.device, requires_grad=False)\n        self.base_lin_vel = quat_rotate_inverse(self.base_quat, self.simulator.robot_root_states[:, 7:10], w_last=True)\n        self.base_ang_vel = quat_rotate_inverse(self.base_quat, self.simulator.robot_root_states[:, 10:13], w_last=True)\n        \n        self.target_robot_root_states = torch.zeros(self.num_envs, 13, dtype=torch.float, device=self.device, requires_grad=False)\n        self.target_robot_dof_state = torch.zeros(self.num_envs, self.num_dof, 2, dtype=torch.float, device=self.device, requires_grad=False)\n        \n        \n        self.projected_gravity = quat_rotate_inverse(self.base_quat, self.gravity_vec, w_last=True)\n        self.push_robot_recovery_counter = torch.zeros(self.num_envs, dtype=torch.int, device=self.device, requires_grad=False)\n        # joint positions offsets and PD gains\n        self.default_dof_pos = torch.zeros(self.num_dof, dtype=torch.float, device=self.device, requires_grad=False)\n        # For domain randomization. We do not modify default_dof_pos directly, though, as this is used in\n        # e.g., tracking\n        self.default_dof_pos_offset = torch.zeros(self.num_envs, self.num_dof, dtype=torch.float, device=self.device, requires_grad=False)\n        for i in range(self.num_dofs):\n            name = self.dof_names[i]\n            angle = self.config.robot.init_state.default_joint_angles[name]\n            self.default_dof_pos[i] = angle\n            found = False\n            for dof_name in self.config.robot.control.stiffness.keys():\n                if dof_name in name:\n                    self.p_gains[i] = self.config.robot.control.stiffness[dof_name]\n                    self.d_gains[i] = self.config.robot.control.damping[dof_name]\n                    found = True\n                    logger.debug(f\"PD gain of joint {name} were defined, setting them to {self.p_gains[i]} and {self.d_gains[i]}\")\n\n            if not found:\n                self.p_gains[i] = 0.\n                self.d_gains[i] = 0.\n                if self.config.robot.control.control_type in [\"P\", \"V\"]:\n                    logger.warning(f\"PD gain of joint {name} were not defined, setting them to zero\")\n                    raise ValueError(f\"PD gain of joint {name} were not defined. Should be defined in the yaml file.\")\n        self.default_dof_pos = self.default_dof_pos.unsqueeze(0)\n        self.dof_scales = self.dof_pos_limits.abs().max(dim=-1).values + self.default_dof_pos.abs() \n        self._init_domain_rand_buffers()\n        # import ipdb; ipdb.set_trace()\n        # for reward penalty curriculum\n        self.average_episode_length = 0. # num_compute_average_epl last termination episode length\n        self.last_episode_length_buf = torch.zeros(self.num_envs, device=self.device, dtype=torch.long)\n        self.num_compute_average_epl = self.config.rewards.num_compute_average_epl\n\n        self.need_to_refresh_envs = torch.ones(self.num_envs, dtype=torch.bool, device=self.device, requires_grad=False)\n\n        self.add_noise_currculum = self.config.obs.add_noise_currculum\n        self.current_noise_curriculum_value = self.config.obs.noise_initial_value\n        \n\n    def _domain_rand_config(self):\n        if self.config.domain_rand.push_robots:\n            self.push_interval_s = torch.randint(self.config.domain_rand.push_interval_s[0], self.config.domain_rand.push_interval_s[1], (self.num_envs,), device=self.device)\n\n    def _init_counters(self):\n        self.common_step_counter = 0\n        self.push_robot_counter = torch.zeros(self.num_envs, dtype=torch.int, device=self.device, requires_grad=False)\n        self.push_robot_plot_counter = torch.zeros(self.num_envs, dtype=torch.int, device=self.device, requires_grad=False)\n        self.command_counter = torch.zeros(self.num_envs, dtype=torch.int, device=self.device, requires_grad=False)\n\n    def _update_counters_each_step(self):\n        self.common_step_counter  +=1\n        self.push_robot_counter[:] += 1\n        self.push_robot_plot_counter[:] += 1\n        self.command_counter[:] += 1\n\n    def _init_domain_rand_buffers(self):\n        ######################################### DR related tensors #########################################\n        if self.config.domain_rand.randomize_ctrl_delay:\n            self.action_queue = torch.zeros(self.num_envs, self.config.domain_rand.ctrl_delay_step_range[1]+1, self.num_dof, dtype=torch.float, device=self.device, requires_grad=False)\n            self.action_delay_idx = torch.randint(self.config.domain_rand.ctrl_delay_step_range[0], \n                                                self.config.domain_rand.ctrl_delay_step_range[1]+1, (self.num_envs,), device=self.device, requires_grad=False)\n        else:\n            self.action_delay_idx = torch.zeros((self.num_envs,), dtype=torch.int, device=self.device, requires_grad=False)\n\n        # self._link_mass_scale = torch.ones(self.num_envs, len(self.config.robot.randomize_link_body_names), dtype=torch.float, device=self.device, requires_grad=False)\n        self._kp_scale = torch.ones(self.num_envs, self.num_dof, dtype=torch.float, device=self.device, requires_grad=False)\n        self._kd_scale = torch.ones(self.num_envs, self.num_dof, dtype=torch.float, device=self.device, requires_grad=False)\n        self._rfi_lim_scale = torch.ones(self.num_envs, self.num_dof, dtype=torch.float, device=self.device, requires_grad=False)\n        self._torque_noise = torch.zeros_like(self.torques)\n        self.push_robot_vel_buf = torch.zeros(self.num_envs, 2, dtype=torch.float, device=self.device, requires_grad=False)\n        self.record_push_robot_vel_buf = torch.zeros(self.num_envs, 2, dtype=torch.float, device=self.device, requires_grad=False)\n\n        self.last_contacts_filt = torch.zeros(self.num_envs, len(self.feet_indices), dtype=torch.bool, device=self.device, requires_grad=False)\n        self.feet_air_max_height = torch.zeros(self.num_envs, self.feet_indices.shape[0], dtype=torch.float, device=self.device, requires_grad=False)\n\n    def _prepare_reward_function(self):\n        \"\"\" Prepares a list of reward functions, whcih will be called to compute the total reward.\n            Looks for self._reward_\u003cREWARD_NAME>, where \u003cREWARD_NAME> are names of all non zero reward scales in the cfg.\n        \"\"\"\n        logger.info(colored(f\"{self.config.rewards.set_reward} set reward on {self.config.rewards.set_reward_date}\", \"green\"))\n        \n        self.reward_scales = self.config.rewards.reward_scales\n        # remove zero scales + multiply non-zero ones by dt\n        for key in list(self.reward_scales.keys()):\n            logger.info(f\"Scale: {key} = {self.reward_scales[key]}\")\n            scale = self.reward_scales[key]\n            if scale==0:\n                self.reward_scales.pop(key) \n            else:\n                self.reward_scales[key] *= self.dt\n\n        self.use_reward_penalty_curriculum = self.config.rewards.reward_penalty_curriculum\n        if self.use_reward_penalty_curriculum:\n            self.reward_penalty_scale = self.config.rewards.reward_initial_penalty_scale\n\n        logger.info(colored(f\"Use Reward Penalty: {self.use_reward_penalty_curriculum}\", \"green\"))\n        if self.use_reward_penalty_curriculum:\n            logger.info(f\"Penalty Reward Names: {self.config.rewards.reward_penalty_reward_names}\")\n            logger.info(f\"Penalty Reward Initial Scale: {self.config.rewards.reward_initial_penalty_scale}\")\n        \n        self.use_reward_limits_dof_pos_curriculum = self.config.rewards.reward_limit.reward_limits_curriculum.soft_dof_pos_curriculum\n        self.use_reward_limits_dof_vel_curriculum = self.config.rewards.reward_limit.reward_limits_curriculum.soft_dof_vel_curriculum\n        self.use_reward_limits_torque_curriculum = self.config.rewards.reward_limit.reward_limits_curriculum.soft_torque_curriculum\n\n        if self.use_reward_limits_dof_pos_curriculum:\n            logger.info(f\"Use Reward Limits DOF Curriculum: {self.use_reward_limits_dof_pos_curriculum}\")\n            logger.info(f\"Reward Limits DOF Curriculum Initial Limit: {self.config.rewards.reward_limit.reward_limits_curriculum.soft_dof_pos_initial_limit}\")\n            logger.info(f\"Reward Limits DOF Curriculum Max Limit: {self.config.rewards.reward_limit.reward_limits_curriculum.soft_dof_pos_max_limit}\")\n            logger.info(f\"Reward Limits DOF Curriculum Min Limit: {self.config.rewards.reward_limit.reward_limits_curriculum.soft_dof_pos_min_limit}\")\n            self.soft_dof_pos_curriculum_value = self.config.rewards.reward_limit.reward_limits_curriculum.soft_dof_pos_initial_limit\n        \n        if self.use_reward_limits_dof_vel_curriculum:\n            logger.info(f\"Use Reward Limits DOF Vel Curriculum: {self.use_reward_limits_dof_vel_curriculum}\")\n            logger.info(f\"Reward Limits DOF Vel Curriculum Initial Limit: {self.config.rewards.reward_limit.reward_limits_curriculum.soft_dof_vel_initial_limit}\")\n            logger.info(f\"Reward Limits DOF Vel Curriculum Max Limit: {self.config.rewards.reward_limit.reward_limits_curriculum.soft_dof_vel_max_limit}\")\n            logger.info(f\"Reward Limits DOF Vel Curriculum Min Limit: {self.config.rewards.reward_limit.reward_limits_curriculum.soft_dof_vel_min_limit}\")\n            self.soft_dof_vel_curriculum_value = self.config.rewards.reward_limit.reward_limits_curriculum.soft_dof_vel_initial_limit\n        \n        if self.use_reward_limits_torque_curriculum:\n            logger.info(f\"Use Reward Limits Torque Curriculum: {self.use_reward_limits_torque_curriculum}\")\n            logger.info(f\"Reward Limits Torque Curriculum Initial Limit: {self.config.rewards.reward_limit.reward_limits_curriculum.soft_torque_initial_limit}\")\n            logger.info(f\"Reward Limits Torque Curriculum Max Limit: {self.config.rewards.reward_limit.reward_limits_curriculum.soft_torque_max_limit}\")\n            logger.info(f\"Reward Limits Torque Curriculum Min Limit: {self.config.rewards.reward_limit.reward_limits_curriculum.soft_torque_min_limit}\")\n            self.soft_torque_curriculum_value = self.config.rewards.reward_limit.reward_limits_curriculum.soft_torque_initial_limit\n\n        # prepare list of functions\n        self.reward_functions = []\n        self.reward_names = []\n        for name, scale in self.reward_scales.items():\n            if name==\"termination\":\n                continue\n            self.reward_names.append(name)\n            name = '_reward_' + name\n            self.reward_functions.append(getattr(self, name))\n            # reward episode sums\n            self.episode_sums = {name: torch.zeros(self.num_envs, dtype=torch.float, device=self.device, requires_grad=False)\n                                for name in self.reward_scales.keys()}\n\n    def set_is_evaluating(self, global_rank = 0):\n        logger.info(\"Setting Env is evaluating\")\n        self.is_evaluating = True\n    \n    def step(self, actor_state):\n        \"\"\" Apply actions, simulate, call self.post_physics_step()\n        Args:\n            actions (torch.Tensor): Tensor of shape (num_envs, num_actions_per_env)\n        \"\"\"\n        actions = actor_state[\"actions\"]\n        self._pre_physics_step(actions)\n        self._physics_step()\n        self._post_physics_step()\n\n        return self.obs_buf_dict, self.rew_buf, self.reset_buf, self.extras\n\n    def _pre_physics_step(self, actions):\n        clip_action_limit = self.config.robot.control.action_clip_value\n        if self.config.robot.control.get(\"normalize_action\", False):\n            rescale_action_to = self.config.robot.control[\"normalize_action_to\"] or  clip_action_limit\n            rescale_action_from = self.config.robot.control[\"normalize_action_from\"]\n            actions = actions * rescale_action_to / rescale_action_from\n\n        self.actions = torch.clip(actions, -clip_action_limit, clip_action_limit).to(self.device)\n        \n        self.log_dict[\"action_clip_frac\"] = (\n                self.actions.abs() == clip_action_limit\n            ).sum() / self.actions.numel()\n        \n        if self.config.domain_rand.randomize_ctrl_delay:\n            self.action_queue[:, 1:] = self.action_queue[:, :-1].clone()\n            self.action_queue[:, 0] = self.actions.clone()\n            self.actions_after_delay = self.action_queue[torch.arange(self.num_envs), self.action_delay_idx].clone()\n        else:\n            self.actions_after_delay = self.actions.clone()\n            \n        ######################################### Tiled Rendering #########################################\n        if self.config.simulator.get(\"enable_cameras\", False) and self.config.simulator.config.name == \"isaacsim\":\n            if self.debug_viz:\n                self._draw_debug_vis()\n                \n            root_pos = self.simulator._rigid_body_pos[:, 0]\n            eye = root_pos + torch.tensor([2, 2, 1], device=self.device)\n            self.simulator.rendering_cam.set_world_poses_from_view(eye, root_pos)\n            rgb_viewer = self.simulator.rendering_cam.data.output['rgb'].clone()\n            \n            if \"writers_rendering_results\" not in self.__dict__:\n                self.counter = 0\n                os.makedirs(self.config.save_rendering_dir, exist_ok=True)\n                self.writers_rendering_results = []\n                time_str = datetime.now().strftime(\"%Y-%m-%d_%H-%M-%S\")\n                \n                \n                for i in range(self.num_envs):\n                    file_name = f'{self.config.save_rendering_dir}/{time_str}_viewer_{i}.mp4'\n                    print(f\"Saving rendering to {file_name}\")\n                    writer = imageio.get_writer(file_name, fps=int(1/self.dt))\n                    writer.append_data(rgb_viewer[i].cpu().numpy())\n                    self.writers_rendering_results.append(writer)\n                    \n                    \n            else:\n                self.counter += 1\n                for i in range(self.num_envs):\n                    self.writers_rendering_results[i].append_data(rgb_viewer[i].cpu().numpy())\n                if self.counter % 100 == 0: print(f\"Rendering {self.counter} frames\")\n                \n                if self.counter > 1000:\n                    for i in range(self.num_envs):\n                        self.writers_rendering_results[i].close()\n                    self.counter = 0\n                    os._exit(0)\n                    \n    def _physics_step(self):\n        self.render()\n        for _ in range(self.config.simulator.config.sim.control_decimation):\n            self._apply_force_in_physics_step()\n            self.simulator.simulate_at_each_physics_step()\n\n    def _apply_force_in_physics_step(self):\n        if self.config.simulator.config.name == \"isaacgym\" or self.config.simulator.config.name == \"mujoco\":\n            self.torques = self._compute_torques(self.actions_after_delay).view(self.torques.shape)\n            self.simulator.apply_torques_at_dof(self.torques)\n        elif self.config.simulator.config.name == \"isaacsim\":\n            self.torques = self._compute_torques(self.actions_after_delay).view(self.torques.shape) # When using implicit PD \n            actions_scaled = self.actions_after_delay * self.config.robot.control.action_scale\n            if self.config.robot.control.get(\"action_rescale\", False):\n                dof_effort_limit = torch.tensor(self.config.robot.dof_effort_limit_list, dtype=torch.float, device=self.device)\n                stiffness = self.p_gains\n                actions_scaled = actions_scaled * dof_effort_limit / stiffness\n            jpos_target = actions_scaled + (self.default_dof_pos + self.default_dof_pos_offset)\n            # jpos_target *= 0.\n            self.simulator._robot.set_joint_position_target(jpos_target, joint_ids=self.simulator.dof_ids)\n            self.simulator.apply_torques_at_dof(self._torque_noise)\n        else:\n            raise NotImplementedError(f\"Simulator {self.config.simulator.config.name} not implemented\")\n\n    def _post_physics_step(self):\n        self._refresh_sim_tensors()\n        self.episode_length_buf += 1\n        # update counters\n        self._update_counters_each_step()\n        self.last_episode_length_buf = self.episode_length_buf.clone()\n\n        self._update_tasks_callback()\n        self._pre_compute_observations_callback()\n        # compute observations, rewards, resets, ...\n        self._check_termination()\n        self._compute_reward()\n        # check terminations\n        env_ids = self.reset_buf.nonzero(as_tuple=False).flatten()\n        self.extras.pop(\"_final_observation_raw\", None)\n        self.extras.pop(\"_final_sim_state\", None)\n        self.extras.pop(\"_final_episode_length\", None)\n        if len(env_ids) > 0:\n            # Preserve the physical successor before same-step autoreset.\n            self._compute_observations()\n            self.extras[\"_final_observation_raw\"] = {key: value.clone() for key, value in self.obs_buf_dict_raw[\"actor_obs\"].items()}\n            self.extras[\"_final_episode_length\"] = self.episode_length_buf.clone()\n            self.extras[\"_final_sim_state\"] = {\n                \"root_states\": self.simulator.robot_root_states.clone(),\n                \"dof_pos\": self.simulator.dof_pos.clone(),\n                \"dof_vel\": self.simulator.dof_vel.clone(),\n                \"base_ang_vel\": self.base_ang_vel.clone(),\n            }\n        self.reset_envs_idx(env_ids)\n\n        # set envs\n        refresh_env_ids = self.need_to_refresh_envs.nonzero(as_tuple=False).flatten()\n        if len(refresh_env_ids) > 0:\n            self.simulator.set_actor_root_state_tensor(refresh_env_ids, self.target_robot_root_states)\n            self.simulator.set_dof_state_tensor(refresh_env_ids, self.target_robot_dof_state)\n            self.need_to_refresh_envs[refresh_env_ids] = False\n            # Manual resets and pushes can write state without setting reset_buf.\n            self._pre_compute_observations_callback()\n            \n        self._compute_observations() # in some cases a simulation step might be required to refresh some obs (for example body positions)\n        \n        self._post_compute_observations_callback()\n\n        # return clipped obs, clipped states (None), rewards, dones and infos\n        clip_obs = self.config.normalization.clip_observations\n        for obs_key, obs_val in self.obs_buf_dict.items():\n            self.obs_buf_dict[obs_key] = torch.clip(obs_val, -clip_obs, clip_obs)\n\n        for key in self.history_handler.history.keys():\n            self.history_handler.add(key, self.hist_obs_dict[key])\n\n        self.extras[\"to_log\"] = self.log_dict\n        if self.viewer:\n            self._setup_simulator_control()\n            self._setup_simulator_next_task()\n            if self.debug_viz:\n                self._draw_debug_vis()\n    \n    def _setup_simulator_next_task(self):\n        pass\n\n    def _setup_simulator_control(self):\n        pass\n\n    def _pre_compute_observations_callback(self):\n        # prepare quantities\n        self.base_quat[:] = self.simulator.base_quat[:]\n        self.rpy[:] = get_euler_xyz_in_tensor(self.base_quat[:])\n        self.base_lin_vel[:] = quat_rotate_inverse(self.base_quat, self.simulator.robot_root_states[:, 7:10], w_last=True)\n        # print(\"self.base_lin_vel\", self.base_lin_vel)\n        self.base_ang_vel[:] = quat_rotate_inverse(self.base_quat, self.simulator.robot_root_states[:, 10:13], w_last=True)\n        # print(\"self.base_ang_vel\", self.base_ang_vel)\n        self.projected_gravity[:] = quat_rotate_inverse(self.base_quat, self.gravity_vec, w_last=True)\n\n    def _update_tasks_callback(self):\n        if self.config.domain_rand.push_robots and not self.is_evaluating: # don't push robots when evaluating\n            self.push_robot_recovery_counter[:] -= 1\n            push_robot_env_ids = (self.push_robot_counter == (self.push_interval_s / self.dt).int()).nonzero(as_tuple=False).flatten()\n            self.push_robot_counter[push_robot_env_ids] = 0\n            self.push_robot_plot_counter[push_robot_env_ids] = 0\n            self.push_interval_s[push_robot_env_ids] = torch.randint(self.config.domain_rand.push_interval_s[0], self.config.domain_rand.push_interval_s[1], (len(push_robot_env_ids),), device=self.device, requires_grad=False)\n            self._push_robots(push_robot_env_ids)\n            self.push_robot_recovery_counter[push_robot_env_ids] = int(self.config.domain_rand.get(\"push_robot_recovery_time\", 2)/self.dt) # 2 seconds recovery time \n\n    def _post_compute_observations_callback(self):\n        self.last_actions[:] = self.actions[:]\n        self.last_dof_pos[:] = self.simulator.dof_pos[:]\n        self.last_dof_vel[:] = self.simulator.dof_vel[:]\n        self.last_root_vel[:] = self.simulator.robot_root_states[:, 7:13]\n\n\n    def _check_termination(self):\n        \"\"\" Check if environments need to be reset\n        \"\"\"\n        # self.reset_buf = 0\n        # self.time_out_buf = 0\n        # Note: DO NOT USE FOLLOWING TWO LINES STYLE\n        self.reset_buf[:] = 0\n        self.time_out_buf[:] = 0\n\n        self._update_reset_buf()\n        self._update_timeout_buf()\n\n        self.reset_buf |= self.time_out_buf\n\n    def _update_reset_buf(self):\n        if self.config.termination.terminate_by_contact:\n            self.reset_buf |= torch.any(torch.norm(self.simulator.contact_forces[:, self.termination_contact_indices, :], dim=-1) > 1., dim=1)\n\n        if self.config.termination.terminate_by_gravity:\n            # print(self.projected_gravity)\n            self.reset_buf |= torch.any(torch.abs(self.projected_gravity[:, 0:1]) > self.config.termination_scales.termination_gravity_x, dim=1)\n            self.reset_buf |= torch.any(torch.abs(self.projected_gravity[:, 1:2]) > self.config.termination_scales.termination_gravity_y, dim=1)\n        if self.config.termination.terminate_by_low_height:\n            # import ipdb; ipdb.set_trace()\n            self.reset_buf |= torch.any(self.simulator.robot_root_states[:, 2:3] \u003c self.config.termination_scales.termination_min_base_height, dim=1)\n\n        if self.config.termination.terminate_when_close_to_dof_pos_limit:\n            out_of_dof_pos_limits = -(self.simulator.dof_pos - self.simulator.dof_pos_limits_termination[:, 0]).clip(max=0.) # lower limit\n            out_of_dof_pos_limits += (self.simulator.dof_pos - self.simulator.dof_pos_limits_termination[:, 1]).clip(min=0.)\n            \n            out_of_dof_pos_limits = torch.sum(out_of_dof_pos_limits, dim=1)\n            # get random number between 0 and 1, if it is smaller than self.config.termination_probality.terminate_when_close_to_dof_pos_limit, apply the termination\n            if torch.rand(1) \u003c self.config.termination_probality.terminate_when_close_to_dof_pos_limit:\n                self.reset_buf |= out_of_dof_pos_limits > 0.\n        \n        if self.config.termination.terminate_when_close_to_dof_vel_limit:\n            out_of_dof_vel_limits = torch.sum((torch.abs(self.simulator.dof_vel) - self.dof_vel_limits * self.config.termination_scales.termination_close_to_dof_vel_limit).clip(min=0., max=1.), dim=1)\n            \n            if torch.rand(1) \u003c self.config.termination_probality.terminate_when_close_to_dof_vel_limit:\n                self.reset_buf |= out_of_dof_vel_limits > 0.\n        \n        if self.config.termination.terminate_when_close_to_torque_limit:\n            out_of_torque_limits = torch.sum((torch.abs(self.torques) - self.torque_limits * self.config.termination_scales.termination_close_to_torque_limit).clip(min=0., max=1.), dim=1)\n            \n            if torch.rand(1) \u003c self.config.termination_probality.terminate_when_close_to_torque_limit:\n                self.reset_buf |= out_of_torque_limits > 0.\n\n\n    def _update_timeout_buf(self):\n        self.time_out_buf |= self.episode_length_buf > self.max_episode_length # no terminal reward for time-outs\n\n    def reset_envs_idx(self, env_ids, target_states=None, target_buf=None):\n        \"\"\" Reset some environments.\n            Calls self._reset_dofs(env_ids), self._reset_root_states(env_ids), and self._resample_commands(env_ids)\n            [Optional] calls self._update_terrain_curriculum(env_ids), self.update_command_curriculum(env_ids) and\n            Logs episode info\n            Resets some buffers\n\n        Args:\n            env_ids (list[int]): List of environment ids which must be reset\n            target_states (dict): Dictionary containing lists of target states for the robot\n        \"\"\"\n        if len(env_ids) == 0:\n            return\n        self.need_to_refresh_envs[env_ids] = True\n        self._reset_buffers_callback(env_ids, target_buf)\n        self._reset_tasks_callback(env_ids)        # if target_states is not None, reset to target states\n        self._reset_robot_states_callback(env_ids, target_states)\n\n        # fill extras\n        self.extras[\"episode\"] = {}\n        for key in self.episode_sums.keys():\n            self.extras[\"episode\"]['rew_' + key] = torch.mean(self.episode_sums[key][env_ids]) / self.max_episode_length_s\n            self.episode_sums[key][env_ids] = 0.\n        self.extras[\"time_outs\"] = self.time_out_buf\n\n        return self.obs_buf_dict, self.extras\n        # self._refresh_sim_tensors()\n\n\n    def _reset_robot_states_callback(self, env_ids, target_states=None):\n        # if target_states is not None, reset to target states\n        if target_states is not None:\n            self._reset_dofs(env_ids, target_states[\"dof_states\"])\n            self._reset_root_states(env_ids, target_states[\"root_states\"])\n        else:\n            self._reset_dofs(env_ids)\n            self._reset_root_states(env_ids)\n\n    def _reset_tasks_callback(self, env_ids):\n        self._episodic_domain_randomization(env_ids)\n        if self.use_reward_penalty_curriculum:\n            self._update_reward_penalty_curriculum()\n        if self.use_reward_limits_dof_pos_curriculum or self.use_reward_limits_dof_vel_curriculum or self.use_reward_limits_torque_curriculum:\n            self._update_reward_limits_curriculum()\n        if self.add_noise_currculum:\n            self._update_obs_noise_curriculum()\n    \n    def _update_obs_noise_curriculum(self):\n        if self.average_episode_length \u003c self.config.obs.soft_dof_pos_curriculum_level_down_threshold:\n            self.current_noise_curriculum_value *= (1 - self.config.obs.soft_dof_pos_curriculum_degree)\n        elif self.average_episode_length > self.config.rewards.reward_penalty_level_up_threshold:\n            self.current_noise_curriculum_value *= (1 + self.config.obs.soft_dof_pos_curriculum_degree)\n\n        self.current_noise_curriculum_value = np.clip(self.current_noise_curriculum_value, \n                                                      self.config.obs.noise_value_min, \n                                                      self.config.obs.noise_value_max)\n\n    def _reset_buffers_callback(self, env_ids, target_buf=None):\n        if target_buf is not None:\n            self.simulator.dof_pos[env_ids] = target_buf[\"dof_pos\"].to(self.simulator.dof_pos.dtype)\n            self.simulator.dof_vel[env_ids] = target_buf[\"dof_vel\"].to(self.simulator.dof_vel.dtype)\n            self.base_quat[env_ids] = target_buf[\"base_quat\"].to(self.base_quat.dtype)\n            self.base_lin_vel[env_ids] = target_buf[\"base_lin_vel\"].to(self.base_lin_vel.dtype)\n            self.base_ang_vel[env_ids] = target_buf[\"base_ang_vel\"].to(self.base_ang_vel.dtype)\n            self.projected_gravity[env_ids] = target_buf[\"projected_gravity\"].to(self.projected_gravity.dtype)\n            self.torques[env_ids] = target_buf[\"torques\"].to(self.torques.dtype)\n            self.actions[env_ids] = target_buf[\"actions\"].to(self.actions.dtype)\n            self.last_actions[env_ids] = target_buf[\"last_actions\"].to(self.last_actions.dtype)\n            self.last_dof_pos[env_ids] = target_buf[\"last_dof_pos\"].to(self.last_dof_pos.dtype)\n            self.last_dof_vel[env_ids] = target_buf[\"last_dof_vel\"].to(self.last_dof_vel.dtype)\n            self.episode_length_buf[env_ids] = target_buf[\"episode_length_buf\"].to(self.episode_length_buf.dtype)\n            self.reset_buf[env_ids] = target_buf[\"reset_buf\"].to(self.reset_buf.dtype)\n            self.time_out_buf[env_ids] = target_buf[\"time_out_buf\"].to(self.time_out_buf.dtype)\n            self.feet_air_time[env_ids] = target_buf[\"feet_air_time\"].to(self.feet_air_time.dtype)\n            self.last_contacts[env_ids] = target_buf[\"last_contacts\"].to(self.last_contacts.dtype)\n            self.last_contacts_filt[env_ids] = target_buf[\"last_contacts_filt\"].to(self.last_contacts_filt.dtype)\n            self.feet_air_max_height[env_ids] = target_buf[\"feet_air_max_height\"].to(self.feet_air_max_height.dtype)\n        else:\n            self.actions[env_ids] = 0.\n            self.last_actions[env_ids] = 0.\n            self.actions_after_delay[env_ids] = 0.\n            self.last_dof_pos[env_ids] = 0.\n            self.last_dof_vel[env_ids] = 0.\n            self.feet_air_time[env_ids] = 0.\n            self.episode_length_buf[env_ids] = 0\n            # self.reset_buf[env_ids] = 0\n            # self.time_out_buf[env_ids] = 0\n            self.reset_buf[env_ids] = 1\n            self._update_average_episode_length(env_ids)\n\n            self.history_handler.reset(env_ids)\n\n    def get_mppi_buffers(self, env_ids):\n        \"\"\" Get buffers for MPPI\n        MPPI algo need to store the buffers to replicate environments\n        \"\"\"\n        return {\n            \"dof_pos\": copy.deepcopy(self.simulator.dof_pos[env_ids]),\n            \"dof_vel\": copy.deepcopy(self.simulator.dof_vel[env_ids]),\n            \"base_quat\": copy.deepcopy(self.base_quat[env_ids]),\n            \"base_lin_vel\": copy.deepcopy(self.base_lin_vel[env_ids]),\n            \"base_ang_vel\": copy.deepcopy(self.base_ang_vel[env_ids]),\n            \"projected_gravity\": copy.deepcopy(self.projected_gravity[env_ids]),\n            \"torques\": copy.deepcopy(self.torques[env_ids]),\n            \"actions\": copy.deepcopy(self.actions[env_ids]),\n            \"last_actions\": copy.deepcopy(self.last_actions[env_ids]),\n            \"last_dof_pos\": copy.deepcopy(self.last_dof_pos[env_ids]),\n            \"last_dof_vel\": copy.deepcopy(self.last_dof_vel[env_ids]),\n            \"episode_length_buf\": copy.deepcopy(self.episode_length_buf[env_ids]),\n            \"reset_buf\": copy.deepcopy(self.reset_buf[env_ids]),\n            \"time_out_buf\": copy.deepcopy(self.time_out_buf[env_ids]),\n            \"feet_air_time\": copy.deepcopy(self.feet_air_time[env_ids]),\n            \"last_contacts\": copy.deepcopy(self.last_contacts[env_ids]),\n            \"last_contacts_filt\": copy.deepcopy(self.last_contacts_filt[env_ids]),\n            \"feet_air_max_height\": copy.deepcopy(self.feet_air_max_height[env_ids]),\n        }\n\n    def _compute_reward(self):\n        \"\"\" Compute rewards\n            Calls each reward function which had a non-zero scale (processed in self._prepare_reward_function())\n            adds each terms to the episode sums and to the total reward\n        \"\"\"\n        self.rew_buf[:] = 0.\n        for i in range(len(self.reward_functions)):\n            name = self.reward_names[i]\n            rew_raw = self.reward_functions[i]()\n            rew = rew_raw * self.reward_scales[name]\n            \n            try:\n                assert rew.shape[0] == self.num_envs\n            except:\n                import ipdb; ipdb.set_trace()\n            # penalty curriculum\n            if name in self.config.rewards.reward_penalty_reward_names:\n                if self.config.rewards.reward_penalty_curriculum:\n                    rew *= self.reward_penalty_scale\n            self.rew_buf += rew\n            # no curriculum, no scale here\n            self.extras[\"aux_rewards\"][name] = rew_raw.clone().detach()\n            self.episode_sums[name] += rew\n            \n        if self.config.rewards.only_positive_rewards:\n            self.rew_buf[:] = torch.clip(self.rew_buf[:], min=0.)\n        # add termination reward after clipping\n        if \"termination\" in self.reward_scales:\n            rew = self._reward_termination() * self.reward_scales[\"termination\"]\n            self.rew_buf += rew\n            self.episode_sums[\"termination\"] += rew\n\n        if self.use_reward_penalty_curriculum:\n            self.log_dict[\"penalty_scale\"] = torch.tensor(self.reward_penalty_scale, dtype=torch.float, device=self.device)\n            self.log_dict[\"average_episode_length\"] = self.average_episode_length\n        \n        if self.use_reward_limits_dof_pos_curriculum:\n            self.log_dict[\"soft_dof_pos_curriculum_value\"] = torch.tensor(self.soft_dof_pos_curriculum_value, dtype=torch.float, device=self.device)\n        if self.use_reward_limits_dof_vel_curriculum:\n            self.log_dict[\"soft_dof_vel_curriculum_value\"] = torch.tensor(self.soft_dof_vel_curriculum_value, dtype=torch.float, device=self.device)\n        if self.use_reward_limits_torque_curriculum:\n            self.log_dict[\"soft_torque_curriculum_value\"] = torch.tensor(self.soft_torque_curriculum_value, dtype=torch.float, device=self.device)\n        \n        if self.add_noise_currculum:\n            self.log_dict[\"current_noise_curriculum_value\"] = torch.tensor(self.current_noise_curriculum_value, dtype=torch.float, device=self.device)\n            \n    def _compute_observations(self):\n        \"\"\" Computes observations\n        \"\"\"\n        # super().compute_observations()\n        self.obs_buf_dict_raw = {}\n        self.hist_obs_dict = {}\n        \n        if self.add_noise_currculum:\n            noise_extra_scale = self.current_noise_curriculum_value\n        else:\n            noise_extra_scale = 1.\n        # print(\"noise_extra_scale\", noise_extra_scale)\n        # compute Algo observations\n        no_noise_obs_keys = self.config.obs.get(\"no_noise_obs_keys\", [\"critic_obs\"])\n        for obs_key, obs_config in self.config.obs.obs_dict.items():\n            self.obs_buf_dict_raw[obs_key] = dict()\n            parse_observation(self, obs_config, self.obs_buf_dict_raw[obs_key], self.config.obs.obs_scales, self.config.obs.noise_scales, noise_extra_scale, use_noise=obs_key not in no_noise_obs_keys)\n            \n        # Compute history observations\n        for k in self.history_handler.history.keys():\n            if k in self.obs_buf_dict_raw['actor_obs']:\n                self.hist_obs_dict[k] = self.obs_buf_dict_raw['actor_obs'][k] # ZL: This assumes that history obs are always in actor_obs. \n            elif k in self.obs_buf_dict_raw['critic_obs']:\n                self.hist_obs_dict[k] = self.obs_buf_dict_raw['critic_obs'][k] \n            else:\n                raise ValueError(f\"History obs {k} not found in actor_obs or critic_obs\")\n            \n        self._post_config_observation_callback()\n        \n    def get_env_state_dict(self):\n        state_dict = super().get_env_state_dict()\n        state_dict.update({k:v.item() for k, v in self.log_dict.items() })\n        return state_dict\n\n    def _post_config_observation_callback(self):\n        self.obs_buf_dict = dict()\n\n        for obs_key, obs_config in self.config.obs.obs_dict.items():\n            obs_keys = sorted(obs_config) # Don't really need to sort\n            # obs_keys = obs_config\n            # print(\"obs_keys\", obs_keys)\n            self.obs_buf_dict[obs_key] = torch.cat([self.obs_buf_dict_raw[obs_key][key] for key in obs_keys], dim=-1)\n    \n    def _compute_torques(self, actions):\n        \"\"\" Compute torques from actions.\n            Actions can be interpreted as position or velocity targets given to a PD controller, or directly as scaled torques.\n            [NOTE]: torques must have the same dimension as the number of DOFs, even if some DOFs are not actuated.\n        Args:\n            actions (torch.Tensor): Actions\n\n        Returns:\n            [torch.Tensor]: Torques sent to the simulation\n        \"\"\"\n        actions_scaled = actions * self.config.robot.control.action_scale\n        if self.config.robot.control.get(\"action_rescale\", False):\n            dof_effort_limit = torch.tensor(self.config.robot.dof_effort_limit_list, dtype=torch.float, device=self.device)\n            stiffness = self.p_gains\n            actions_scaled = actions_scaled * dof_effort_limit / stiffness\n        control_type = self.config.robot.control.control_type\n        \n        if control_type==\"P\":\n            torques = self._kp_scale * self.p_gains*(actions_scaled + self.default_dof_pos + self.default_dof_pos_offset - self.simulator.dof_pos) - self._kd_scale * self.d_gains*self.simulator.dof_vel\n        elif control_type==\"V\":\n            torques = self._kp_scale * self.p_gains*(actions_scaled - self.simulator.dof_vel) - self._kd_scale * self.d_gains*(self.simulator.dof_vel - self.last_dof_vel)/self.sim_dt\n        elif control_type==\"T\":\n            torques = actions_scaled\n        else:\n            raise NameError(f\"Unknown controller type: {control_type}\")\n        \n        self._torque_noise.zero_()\n        if self.config.domain_rand.randomize_torque_rfi:\n            self._torque_noise.copy_((torch.rand_like(torques)*2.-1.) * self.config.domain_rand.rfi_lim * self._rfi_lim_scale * self.torque_limits)\n            torques = torques + self._torque_noise\n        \n        if self.config.robot.control.clip_torques:\n            return torch.clip(torques, -self.torque_limits, self.torque_limits)\n        \n        else:\n            return torques\n\n    def _create_terrain(self):\n        super()._create_terrain()\n\n    def _draw_debug_
