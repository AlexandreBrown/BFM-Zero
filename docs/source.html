<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BFM-Zero · Local source browser</title><link rel="stylesheet" href="guide.css"></head><body class="source-page"><main><header><h1>Read the source.</h1><div class="source-tools"><a href="index.html">← Field guide</a><label for="source-file">File</label><select id="source-file"></select><a id="raw-source">Raw file ↗</a></div><div class="source-caption" id="caption"></div></header><pre class="source-code" id="code" aria-label="Source code"></pre></main><script>const sources={"humanoidverse/train.py": "# Copyright (c) Meta Platforms, Inc. and affiliates.\n#\n# This source code is licensed under the CC BY-NC 4.0 license found in the\n# LICENSE file in the root directory of this source tree.\n\nimport os\n\nfrom humanoidverse.agents.evaluations.humanoidverse_isaac import (\n    HumanoidVerseIsaacTrackingEvaluation,\n    HumanoidVerseIsaacTrackingEvaluationConfig,\n)\nfrom humanoidverse.agents.envs.humanoidverse_isaac import load_expert_trajectories_from_motion_lib, HumanoidVerseIsaacConfig\n\nos.environ[\"OMP_NUM_THREADS\"] = \"1\"\n\nimport torch\n\ntorch.set_float32_matmul_precision(\"high\")\n\nimport json\nimport shutil\nimport tempfile\nimport time\nimport typing as tp\nimport warnings\nfrom pathlib import Path\nfrom typing import Dict, List\nfrom torch.utils._pytree import tree_map\n\nimport exca as xk\nimport gymnasium\nimport numpy as np\nimport pydantic\nimport torch  # better to use scoped import if we use processes\nimport tyro\nimport wandb\nfrom torch.utils._pytree import tree_map\nfrom tqdm import tqdm\n\n\nfrom humanoidverse.agents.base import BaseConfig\nfrom humanoidverse.agents.base_model import migrate_legacy_aux_critic_config\nfrom humanoidverse.agents.buffers.load_data import load_expert_trajectories\nfrom humanoidverse.agents.buffers.trajectory import TrajectoryDictBufferMultiDim\nfrom humanoidverse.agents.buffers.transition import DictBuffer, dtype_numpytotorch_lower_precision\nfrom humanoidverse.agents.fb_cpr.agent import FBcprAgentConfig\nfrom humanoidverse.agents.fb_cpr_aux.agent import FBcprAuxAgentConfig\nfrom humanoidverse.agents.misc.loggers import CSVLogger\nfrom humanoidverse.agents.utils import EveryNStepsChecker, get_local_workdir, set_seed_everywhere\n\nTRAIN_LOG_FILENAME = \"train_log.txt\"\nREWARD_EVAL_LOG_FILENAME = \"reward_eval_log.csv\"\nTRACKING_EVAL_LOG_FILENAME = \"tracking_eval_log.csv\"\n\nCHECKPOINT_DIR_NAME = \"checkpoint\"\n\n_ENC_CONFIG_TO_EXPERT_DATA_OBS_MAPPER = {\n    HumanoidVerseIsaacConfig: None,\n}\n\n\n\nEvaluation = tp.Annotated[\n    tp.Union[\n        HumanoidVerseIsaacTrackingEvaluationConfig,\n    ],\n    pydantic.Field(discriminator=\"name\"),\n]\n\nAgent = FBcprAgentConfig | FBcprAuxAgentConfig\n\n\nclass TrainConfig(BaseConfig):\n    # The \"pydantic.Field\" field is used to explicitely tell which field is the discriminative\n    # feature\n    agent: Agent = pydantic.Field(discriminator=\"name\")\n    motions: str | None = None\n    motions_root: str | None = None\n\n    env: HumanoidVerseIsaacConfig = pydantic.Field(discriminator=\"name\")\n\n    work_dir: str = pydantic.Field(default_factory=lambda: get_local_workdir(\"g1mujoco_train\"))\n\n    seed: int = 0\n    online_parallel_envs: int = 50\n    # Note: this is in env steps (multiples of online_parallel_envs)\n    log_every_updates: int = 100_000\n    num_env_steps: int = 30_000_000\n    # Note: this is in env steps (multiples of online_parallel_envs)\n    update_agent_every: int = 500\n    # Note: this is in env steps (multiples of online_parallel_envs)\n    num_seed_steps: int = 50_000\n    num_agent_updates: int = 50\n    # Note: this is in env steps (multiples of online_parallel_envs)\n    checkpoint_every_steps: int = 5_000_000\n    checkpoint_buffer: bool = True\n    prioritization: bool = False\n    prioritization_min_val: float = 0.5\n    prioritization_max_val: float = 5\n    prioritization_scale: float = 2\n    prioritization_mode: str = \"bin\"  # [\"bin\", \"exp\", \"lin\"]\n    padding_beginning: int = 0\n    padding_end: int = 0\n\n    # Buffer\n    use_trajectory_buffer: bool = False\n    buffer_size: int = 5_000_000\n\n    # WANDB\n    use_wandb: bool = False\n    wandb_ename: str | None = None\n    wandb_gname: str | None = None\n    wandb_pname: str | None = None\n\n    # misc\n    load_isaac_expert_data: bool = True\n    buffer_device: str = \"cpu\"\n    # Default to True; otherwise you will spam the console with tqdm\n    disable_tqdm: bool = True\n\n    # If you want to add more available evaluations, Update \"Evaluations\" type above\n    evaluations: Dict[str, Evaluation] | List[Evaluation] = pydantic.Field(default_factory=lambda: [])\n    # Note: this is in env steps (multiples of online_parallel_envs)\n    eval_every_steps: int = 1_000_000\n\n    tags: dict = pydantic.Field(default_factory=lambda: {})\n\n    # exca\n    infra: xk.TaskInfra = xk.TaskInfra(version=\"1\")\n\n    def model_post_init(self, context):\n        # TODO prioritization needs tracking eval to work, but this is bit hacky to check for it\n        if self.load_isaac_expert_data and not isinstance(self.env, HumanoidVerseIsaacConfig):\n            raise ValueError(\"Loading expert isaac data is only supported for HumanoidVerseIsaacConfig\")\n\n        if self.prioritization:\n            has_prioritization_eval = False\n            for eval_type in self.evaluations:\n                if isinstance(eval_type, (HumanoidVerseIsaacTrackingEvaluationConfig)):\n                    has_prioritization_eval = True\n                    break\n            if not has_prioritization_eval:\n                raise ValueError(\"Prioritization requires tracking evaluation to be enabled\")\n\n\n        if self.motions is None or self.motions_root is None:\n            if self.prioritization:\n                raise ValueError(\"Prioritization requires expert data to be provided (motions and motions_root)\")\n            elif self.agent == FBcprAgentConfig:\n                # TODO how to do checks like these in pydantic or more systematically?\n                raise ValueError(\"FBcprAgent requires expert data to be provided (motions and motions_root)\")\n\n        # Ensure all evaluations have unique log names\n        if isinstance(self.evaluations, list):\n            log_names = set()\n            for eval_cfg in self.evaluations:\n                if eval_cfg.name_in_logs in log_names:\n                    raise ValueError(\n                        f\"Duplicate evaluation name_in_logs found: {eval_cfg.name}. These should be unique so we do not overwrite any logs\"\n                    )\n                log_names.add(eval_cfg.name_in_logs)\n\n    def build(self):\n        \"\"\"In case of cluster run, use exca and process instead of explivit build\"\"\"\n        return Workspace(self)\n\n\ndef checkpoint_path(work_dir: Path) -> Path:\n    path = work_dir / CHECKPOINT_DIR_NAME\n    previous = work_dir / (CHECKPOINT_DIR_NAME + \".previous\")\n    # A process can stop between the two directory renames during publication.\n    return previous if not path.exists() and previous.exists() else path\n\n\ndef validate_resume_config(work_dir: Path, cfg: TrainConfig):\n    checkpoint_dir = checkpoint_path(work_dir)\n    if not checkpoint_dir.exists():\n        return\n    if (checkpoint_dir / \"buffers/train\").exists():\n        with (checkpoint_dir / \"train_status.json\").open() as f:\n            status = json.load(f)\n        if status.get(\"replay_format\") != \"explicit_successor_v1\":\n            raise ValueError(\"Legacy replay has no verified physical successors. Start a new work_dir; model weights remain loadable for inference.\")\n    with (work_dir / \"config.json\").open() as f:\n        previous = json.load(f)\n    current = cfg.model_dump(mode=\"json\")\n    # Logging, device placement and the remaining budget may change on resume.\n    operational = {\n        \"work_dir\", \"num_env_steps\", \"log_every_updates\", \"checkpoint_every_steps\", \"checkpoint_buffer\",\n        \"buffer_device\", \"disable_tqdm\", \"use_wandb\", \"wandb_ename\", \"wandb_gname\", \"wandb_pname\", \"tags\", \"infra\",\n    }\n    with (checkpoint_dir / \"config.json\").open() as f:\n        previous[\"agent\"] = json.load(f)\n    migrate_legacy_aux_critic_config(previous[\"agent\"][\"model\"])\n    for config in (previous, current):\n        config[\"agent\"][\"model\"].pop(\"device\", None)\n        config[\"env\"].pop(\"device\", None)\n    changed = sorted(key for key in previous.keys() | current.keys() if key not in operational and previous.get(key) != current.get(key))\n    if changed:\n        raise ValueError(f\"Resume configuration differs in {changed}. Use the saved configuration or a new work_dir.\")\n\n\ndef create_agent_or_load_checkpoint(work_dir: Path, cfg: TrainConfig, agent_build_kwargs: dict[str, tp.Any]):\n    checkpoint_dir = checkpoint_path(work_dir)\n    checkpoint_time = 0\n    if checkpoint_dir.exists():\n        with (checkpoint_dir / \"train_status.json\").open(\"r\") as f:\n            train_status = json.load(f)\n        checkpoint_time = train_status[\"time\"]\n\n        print(f\"Loading the agent at time {checkpoint_time}\")\n        agent = cfg.agent.object_class.load(checkpoint_dir, device=cfg.agent.model.device)\n    else:\n        agent = cfg.agent.build(**agent_build_kwargs)\n    return agent, cfg, checkpoint_time\n\n\ndef make_transition(observation, action, next_observation, reward, terminated, truncated, info, next_info, step_count):\n    \"\"\"Store same-step autoreset successors explicitly, including timeout bootstraps.\"\"\"\n    def tensor(value):\n        return torch.as_tensor(value).detach().clone()\n\n    current = {key: tensor(value) for key, value in observation.items() if key not in (\"time\", \"history\")}\n    successor = {key: tensor(value) for key, value in next_observation.items() if key not in (\"time\", \"history\")}\n    final_mask = next_info.get(\"_final_observation\")\n    if final_mask is not None:\n        for key, value in successor.items():\n            mask = torch.as_tensor(final_mask, device=value.device, dtype=torch.bool)\n            value[mask] = torch.as_tensor(next_info[\"final_observation\"][key], device=value.device)[mask]\n    data = {\n        \"observation\": current,\n        \"action\": tensor(action),\n        \"step_count\": tensor(step_count).reshape(-1, 1),\n        \"reward\": tensor(reward).reshape(-1, 1),\n        \"next\": {\n            \"observation\": successor,\n            \"terminated\": tensor(terminated).reshape(-1, 1),\n            \"truncated\": tensor(truncated).reshape(-1, 1),\n        },\n    }\n    data[\"done\"] = data[\"next\"][\"terminated\"] | data[\"next\"][\"truncated\"]\n    for key in (\"qpos\", \"qvel\"):\n        if key in info:\n            data[key] = tensor(info[key])\n            data[\"next\"][key] = tensor(next_info[key])\n            if final_mask is not None:\n                value = data[\"next\"][key]\n                mask = torch.as_tensor(final_mask, device=value.device, dtype=torch.bool)\n                value[mask] = torch.as_tensor(next_info[\"final_info\"][key], device=value.device)[mask]\n    if \"aux_rewards\" in next_info:\n        data[\"aux_rewards\"] = {key: tensor(value).reshape(-1, 1) for key, value in next_info[\"aux_rewards\"].items() if not key.startswith(\"_\")}\n    return data\n\n\ndef init_wandb(cfg: TrainConfig):\n    wandb_name = os.environ.get(\"WANDB_NAME\") or Path(cfg.work_dir).name\n    wandb_config = cfg.model_dump()\n    wandb_dir = Path(cfg.work_dir) / \"_wandb\"\n    wandb_dir.mkdir(parents=True, exist_ok=True)\n    wandb.init(entity=cfg.wandb_ename, project=cfg.wandb_pname, group=cfg.wandb_gname, name=wandb_name, config=wandb_config, dir=str(wandb_dir))\n\n\nclass Workspace:\n    def __init__(self, cfg: TrainConfig) -> None:\n        self.cfg = cfg\n        validate_resume_config(Path(cfg.work_dir), cfg)\n        set_seed_everywhere(cfg.seed)\n\n        # HACK with Isaac, we can not recreate environments with current code, so we need to\n        #      create the environment with desired number of envs here\n        if isinstance(cfg.env, HumanoidVerseIsaacConfig):\n            from omegaconf import OmegaConf\n\n            self.train_env, self.train_env_info = cfg.env.build(num_envs=cfg.online_parallel_envs)\n            self.train_env.action_space.seed(cfg.seed)\n            self.train_env.single_action_space.seed(cfg.seed)\n            self.obs_space = self.train_env.single_observation_space\n            self.action_space = self.train_env.single_action_space\n        else:\n            sample_env, _ = cfg.env.build(num_envs=1)\n            self.obs_space = sample_env.observation_space\n            self.action_space = sample_env.action_space\n\n        assert \"time\" in self.obs_space.keys(), \"Observation space must contain 'obs' and 'time' (TimeAwareObservation wrapper)\"\n        assert len(self.action_space.shape) == 1, \"Only 1D action space is supported (first dim should be vector env)\"\n        # TODO for backwards consistency, we do not pass \"time\" to the agent, so we remove it from the obs_space we pass to the agent/model\n        #      but would we need it at some point?\n        del self.obs_space.spaces[\"time\"]\n\n        self.action_dim = self.action_space.shape[0]\n\n        print(f\"Workdir: {self.cfg.work_dir}\")\n        self.work_dir = Path(self.cfg.work_dir)\n        self.work_dir.mkdir(exist_ok=True, parents=True)\n\n        if isinstance(cfg.env, HumanoidVerseIsaacConfig):\n            with open(self.work_dir / \"config.yaml\", \"w\") as file:\n                OmegaConf.save(self.train_env_info[\"unresolved_conf\"], file)\n\n        self.train_logger = CSVLogger(filename=self.work_dir / TRAIN_LOG_FILENAME)\n\n        self.agent, self.cfg, self._checkpoint_time = create_agent_or_load_checkpoint(\n            self.work_dir, self.cfg, agent_build_kwargs=dict(obs_space=self.obs_space, action_dim=self.action_dim)\n        )\n        self.agent._model.train()\n\n        if isinstance(self.cfg.evaluations, list):\n            self.evaluations = {eval_cfg.name_in_logs: eval_cfg.build() for eval_cfg in self.cfg.evaluations}\n        else:\n            self.evaluations = {eval_cfg: eval_cfg.build() for name, eval_cfg in self.cfg.evaluations.items()}\n        self.evaluate = len(self.evaluations) > 0\n\n        self.eval_loggers = {name: CSVLogger(filename=self.work_dir / f\"{name}.csv\") for name in self.evaluations.keys()}\n\n        if self.cfg.use_wandb:\n            init_wandb(self.cfg)\n\n        with (self.work_dir / \"config.json\").open(\"w\") as f:\n            f.write(self.cfg.model_dump_json(indent=4))\n\n        self.priorization_eval_name = None\n        if self.cfg.prioritization:\n            for name, evaluation in self.evaluations.items():\n                if isinstance(evaluation.cfg, HumanoidVerseIsaacTrackingEvaluationConfig):\n                    self.priorization_eval_name = name\n                    break\n            if self.priorization_eval_name is None:\n                raise ValueError(\"Prioritization requires tracking evaluation to be enabled\")\n\n        self.training_with_expert_data = True\n\n        self.manager = None\n\n    def train(self):\n        self.start_time = time.time()\n        self.train_online()\n\n    def train_online(self) -> None:\n        if self.training_with_expert_data:\n            if self.cfg.load_isaac_expert_data:\n                expert_buffer = load_expert_trajectories_from_motion_lib(self.train_env._env, self.cfg.agent, device=self.cfg.buffer_device)\n            else:\n                print(\"Loading expert trajectories\")\n                expert_buffer = load_expert_trajectories(\n                    self.cfg.motions,\n                    self.cfg.motions_root,\n                    seq_length=self.agent.cfg.model.seq_length,\n                    device=self.cfg.buffer_device,\n                    # TODO data stored in disk does not have dictionary obs, so we need to manually\n                    #      define what obs key the data on disk corresponds to\n                    obs_dict_mapper=_ENC_CONFIG_TO_EXPERT_DATA_OBS_MAPPER[self.cfg.env.__class__],\n                )\n        print(\"Creating the training environment\")\n\n        if isinstance(self.cfg.env, HumanoidVerseIsaacConfig):\n            train_env = self.train_env\n            train_env_info = self.train_env_info\n        else:\n            train_env, train_env_info = self.cfg.env.build(num_envs=self.cfg.online_parallel_envs)\n\n        print(\"Allocating buffers\")\n        replay_buffer = {}\n        checkpoint_dir = checkpoint_path(self.work_dir)\n        if (checkpoint_dir / \"buffers/train\").exists():\n            print(\"Loading checkpointed buffer\")\n            if self.cfg.use_trajectory_buffer:\n                replay_buffer[\"train\"] = TrajectoryDictBufferMultiDim.load(checkpoint_dir / \"buffers/train\", device=self.cfg.buffer_device)\n            else:\n                replay_buffer[\"train\"] = DictBuffer.load(checkpoint_dir / \"buffers/train\", device=self.cfg.buffer_device)\n            buffer = replay_buffer[\"train\"]\n            if self.cfg.use_trajectory_buffer and buffer.output_key_tp1:\n                raise ValueError(\"Legacy trajectory replay has no explicit successors. Start a new work_dir; old buffer boundaries cannot be repaired.\")\n            if self.cfg.use_trajectory_buffer and len(buffer):\n                buffer.storage[\"done\"][buffer._idx - 1] = True\n                buffer.storage[\"next\"][\"truncated\"][buffer._idx - 1] = True\n                buffer._recompute_start_stop = True\n            print(f\"Loaded buffer of size {len(buffer)}\")\n        else:\n            if self.cfg.use_trajectory_buffer:\n                output_key_t = [\"observation\", \"action\", \"z\", \"next\", \"step_count\", \"reward\"]\n                # TODO this interface should be more elegant (how to inform buffer what keys are coming in / need to be sampled?)\n                if isinstance(self.cfg.agent, (FBcprAuxAgentConfig)):\n                    output_key_t.append(\"aux_rewards\")\n\n                replay_buffer[\"train\"] = TrajectoryDictBufferMultiDim(\n                    capacity=self.cfg.buffer_size // self.cfg.online_parallel_envs,  # make sure to divide by num_envs\n                    device=self.cfg.buffer_device,\n                    n_dim=2,\n                    end_key=\"done\",\n                    output_key_t=output_key_t,  # TODO(team): fix this. in principle we could avoid to sample qpos, qvel for training but we need them for reward evaluation\n                    output_key_tp1=[],\n                )\n            else:\n                replay_buffer[\"train\"] = DictBuffer(capacity=self.cfg.buffer_size, device=self.cfg.buffer_device)\n        if self.training_with_expert_data:\n            replay_buffer[\"expert_slicer\"] = expert_buffer\n\n        print(\"Starting training\")\n        progb = tqdm(total=self.cfg.num_env_steps, disable=self.cfg.disable_tqdm)\n        td, info = train_env.reset()\n        total_metrics, context = None, None\n        start_time = time.time()\n        fps_start_time = time.time()\n        checkpoint_time_checker = EveryNStepsChecker(self._checkpoint_time, self.cfg.checkpoint_every_steps)\n        eval_time_checker = EveryNStepsChecker(self._checkpoint_time, self.cfg.eval_every_steps)\n        update_agent_time_checker = EveryNStepsChecker(self._checkpoint_time, self.cfg.update_agent_every)\n        log_time_checker = EveryNStepsChecker(self._checkpoint_time, self.cfg.log_every_updates)\n\n        eval_instances = []\n        for evaluation_name in self.evaluations.keys():\n            evaluation = self.evaluations[evaluation_name]\n            eval_instances.append(isinstance(evaluation, HumanoidVerseIsaacTrackingEvaluation))\n        uses_humanoidverse_eval = True if any(eval_instances) else False\n\n        completed_steps = self._checkpoint_time\n        for t in range(self._checkpoint_time, self.cfg.num_env_steps, self.cfg.online_parallel_envs):\n            if (t != self._checkpoint_time) and checkpoint_time_checker.check(t):\n                checkpoint_time_checker.update_last_step(t)\n                self.save(t, replay_buffer)\n\n            if (self.evaluate and eval_time_checker.check(t)) or (self.evaluate and t == self._checkpoint_time):\n                eval_metrics = self.eval(t, replay_buffer=replay_buffer)\n                eval_time_checker.update_last_step(t)\n                if uses_humanoidverse_eval:\n                    # reset if there is a humanoidverse evaluation\n                    td, info = train_env.reset()\n\n                if self.cfg.prioritization:\n                    assert len(eval_metrics[self.priorization_eval_name]) == len(replay_buffer[\"expert_slicer\"].motion_ids), (\n                        \"Mismatch in number of motions returned by the eval\"\n                    )\n                    # priorities\n                    index_in_buffer, name_in_buffer = {}, {}\n                    for i, motion_id in enumerate(replay_buffer[\"expert_slicer\"].motion_ids):\n                        index_in_buffer[motion_id] = i\n                        if hasattr(replay_buffer[\"expert_slicer\"], \"file_names\"):\n                            name_in_buffer[motion_id] = replay_buffer[\"expert_slicer\"].file_names[i]\n                    motions_id, priorities, idxs = [], [], []\n                    for _, metr in eval_metrics[self.priorization_eval_name].items():\n                        motions_id.append(metr[\"motion_id\"])\n                        priorities.append(metr[\"emd\"])\n                        idxs.append(index_in_buffer[metr[\"motion_id\"]])\n                    priorities = (\n                        torch.clamp(\n                            torch.tensor(priorities, dtype=torch.float32, device=self.agent.device),\n                            min=self.cfg.prioritization_min_val,\n                            max=self.cfg.prioritization_max_val,\n                        )\n                        * self.cfg.prioritization_scale\n                    )\n\n                    if self.cfg.prioritization_mode == \"lin\":\n                        pass\n                    elif self.cfg.prioritization_mode == \"exp\":\n                        priorities = 2**priorities\n                    elif self.cfg.prioritization_mode == \"bin\":\n                        bins = torch.floor(priorities)\n                        for i in range(int(bins.min().item()), int(bins.max().item()) + 1):\n                            mask = bins == i\n                            n = mask.sum().item()\n                            if n > 0:\n                                priorities[mask] = 1 / n\n                    else:\n                        raise ValueError(f\"Unsupported prioritization mode {self.cfg.prioritization_mode}\")\n\n                    train_env._env._motion_lib.update_sampling_weight_by_id(\n                        priorities=list(priorities), motions_id=idxs, file_name=name_in_buffer\n                    )\n\n                    replay_buffer[\"expert_slicer\"].update_priorities(\n                        priorities=priorities.to(self.cfg.buffer_device), idxs=torch.tensor(np.array(idxs), device=self.cfg.buffer_device)\n                    )\n\n            with torch.no_grad():\n                obs = tree_map(lambda x: torch.tensor(x, dtype=dtype_numpytotorch_lower_precision(x.dtype), device=self.agent.device), td)\n                # TODO consistency with obs_space: remove time assigned by TimeAwareObservationWrapper\n                step_count = obs.pop(\"time\")\n\n                history_context = None\n                if \"history\" in obs:\n                    # this works in inference mode\n                    if len(obs[\"history\"][\"action\"]) == 0:\n                        history_context = self.agent._model._context_encoder.get_initial_context(self.cfg.online_parallel_envs)\n                    else:\n                        history_context = self.agent.history_inference(obs=obs[\"history\"][\"observation\"], action=obs[\"history\"][\"action\"])[\n                            :, -1\n                        ].clone()\n\n                context = self.agent.maybe_update_rollout_context(z=context, step_count=step_count, replay_buffer=replay_buffer)\n                if t \u003c self.cfg.num_seed_steps:\n                    action = train_env.action_space.sample().astype(np.float32)\n                else:\n                    # this works in inference mode\n                    if history_context is not None:\n                        action = self.agent.act(obs=obs, z=context, context=history_context, mean=False)\n                    else:\n                        action = self.agent.act(obs=obs, z=context, mean=False)\n                    # TODO a bit hard-coded -- just to avoid moving stuff from cpu to cuda\n                    if not isinstance(self.cfg.env, HumanoidVerseIsaacConfig):\n                        action = action.cpu().detach().numpy()\n            new_td, new_reward, new_terminated, new_truncated, new_info = train_env.step(action)\n\n            # we check if at the next iteration we will evaluate\n            next_t = t + self.cfg.online_parallel_envs\n            if (self.evaluate and eval_time_checker.check(next_t)) or (self.evaluate and next_t == self._checkpoint_time):\n                if isinstance(self.cfg.env, HumanoidVerseIsaacConfig) and uses_humanoidverse_eval:\n                    # make sure we set truncated since at the next iteration we are forced to reset the environment\n                    # after the evaluation. This is because we share the environment with the evaluation\n                    new_truncated = np.ones_like(new_truncated, dtype=bool)\n\n            data = make_transition(obs, action, new_td, new_reward, new_terminated, new_truncated, info, new_info, step_count)\n            if context is not None:\n                data[\"z\"] = context\n            if history_context is not None:\n                data[\"history_context\"] = history_context\n            if self.cfg.use_trajectory_buffer:\n                data = tree_map(lambda value: value[None, ...], data)\n            replay_buffer[\"train\"].extend(data)\n\n            if len(replay_buffer[\"train\"]) > 0 and t > self.cfg.num_seed_steps and update_agent_time_checker.check(t):\n                update_agent_time_checker.update_last_step(t)\n                for _ in range(self.cfg.num_agent_updates):\n                    metrics = self.agent.update(replay_buffer, t)\n                    if total_metrics is None:\n                        num_metrics_updates = 1\n                        total_metrics = {k: metrics[k].float().clone() for k in metrics.keys()}\n                    else:\n                        num_metrics_updates += 1\n                        total_metrics = {k: total_metrics[k] + metrics[k].float() for k in metrics.keys()}\n\n            if log_time_checker.check(t) and total_metrics is not None:\n                log_time_checker.update_last_step(t)\n                m_dict = {}\n                for k in sorted(list(total_metrics.keys())):\n                    tmp = total_metrics[k] / num_metrics_updates\n                    m_dict[k] = np.round(tmp.mean().item(), 6)\n                m_dict[\"duration [minutes]\"] = (time.time() - start_time) / 60\n                m_dict[\"FPS\"] = (1 if t == 0 else self.cfg.log_every_updates) / (time.time() - fps_start_time)\n                if self.cfg.use_wandb:\n                    wandb.log(\n                        {f\"train/{k}\": v for k, v in m_dict.items()},\n                        step=t,\n                    )\n                print(m_dict)\n                total_metrics = None\n                fps_start_time = time.time()\n                m_dict[\"timestep\"] = t\n                self.train_logger.log(m_dict)\n\n            progb.update(self.cfg.online_parallel_envs)\n            completed_steps = t + self.cfg.online_parallel_envs\n            td = new_td\n            info = new_info\n        if completed_steps > self._checkpoint_time:\n            self.save(completed_steps, replay_buffer)\n            if self.evaluate and eval_time_checker.check(completed_steps):\n                self.eval(completed_steps, replay_buffer=replay_buffer)\n        train_env.close()\n\n    def eval(self, t, replay_buffer):\n        print(f\"Starting evaluation at time {t}\")\n        evaluation_results = {}\n\n        # This will contain the results, mapping evaluation.cfg.name --> dict of metrics\n        evaluation_results = {}\n        for evaluation_name in self.evaluations.keys():\n            logger = self.eval_loggers[evaluation_name]\n            evaluation = self.evaluations[evaluation_name]\n\n            # NOTE we have this inside the loop so that the agent is not moved to cpu if we don't evaluate\n            if not isinstance(self.cfg.env, HumanoidVerseIsaacConfig):\n                self.agent._model.to(\"cpu\")\n            self.agent._model.train(False)\n\n            if isinstance(self.cfg.env, HumanoidVerseIsaacConfig):\n                # Pass train env\n                evaluation_metrics, wandb_dict = evaluation.run(\n                    timestep=t, agent_or_model=self.agent, replay_buffer=replay_buffer, logger=logger, env=self.train_env\n                )\n            else:\n                evaluation_metrics, wandb_dict = evaluation.run(\n                    timestep=t,\n                    agent_or_model=self.agent,\n                    replay_buffer=replay_buffer,\n                    logger=logger,\n                )\n            # For wandb dict, put it on wan Key {key} not found in config {self.__class__.__name__}\")\n\n    def build(self, *args, **kwargs) -> Any:\n        raise NotImplementedError(f\"The object {self} did not have valid build function. Did you forget to define it?\")\n", "humanoidverse/agents/base_model.py": "import json\nimport copy\nimport pickle\nimport typing as tp\nfrom pathlib import Path\n\nimport safetensors.torch\nimport torch\nfrom torch import nn\n\nfrom .base import BaseConfig\nfrom .envs.utils.gym_spaces import json_to_space, space_to_json\n\n\ndef migrate_legacy_aux_critic_config(config: dict) -> dict:\n    if config.get(\"name\") == \"FBcprAuxModel\" and \"aux_critic_config_version\" not in config:\n        # Released checkpoints built both critics from `critic`, regardless of the saved aux config.\n        config[\"archi\"][\"aux_critic\"] = copy.deepcopy(config[\"archi\"][\"critic\"])\n        config[\"aux_critic_config_version\"] = 1\n    return config\n\n\ndef save_model(path: str, model: \"BaseModel\", build_kwargs: tp.Optional[tp.Dict[str, tp.Any]] = None) -> None:\n    output_folder = Path(path)\n    output_folder.mkdir(exist_ok=True)\n    safetensors.torch.save_model(model, output_folder / \"model.safetensors\")\n\n    json_dump = model.cfg.model_dump()\n\n    if build_kwargs is not None:\n        if \"obs_space\" in build_kwargs:\n            build_kwargs[\"obs_space\"] = space_to_json(build_kwargs[\"obs_space\"])\n        with (output_folder / \"init_kwargs.json\").open(\"w+\") as f:\n            json.dump(build_kwargs, f, indent=4)\n\n    with (output_folder / \"config.json\").open(\"w+\") as f:\n        f.write(json.dumps(json_dump, indent=4))\n\n\ndef load_model(\n    path: str, device: str | None, strict: bool, config_class: \"BaseModelConfig\", build_kwargs: tp.Optional[tp.Dict[str, tp.Any]] = None\n) -> \"BaseModel\":\n    model_dir = Path(path)\n    with (model_dir / \"config.json\").open() as f:\n        loaded_config = migrate_legacy_aux_critic_config(json.load(f))\n    if device is not None:\n        loaded_config[\"device\"] = device\n\n    if (model_dir / \"init_kwargs.pkl\").exists():\n        with (model_dir / \"init_kwargs.pkl\").open(\"rb\") as f:\n            build_kwargs = pickle.load(f)\n    elif (model_dir / \"init_kwargs.json\").exists():\n        with (model_dir / \"init_kwargs.json\").open(\"r\") as f:\n            build_kwargs = json.load(f)\n            if \"obs_space\" in build_kwargs:\n                build_kwargs[\"obs_space\"] = json_to_space(build_kwargs[\"obs_space\"])\n\n    if build_kwargs is None:\n        raise ValueError(\n            \"No build_kwargs provided, and init_kwargs.pkl not found. Please provide build_kwargs that are passed to config_class.build functionm.\"\n        )\n\n    loaded_config = config_class(**loaded_config)\n    loaded_model = loaded_config.build(**build_kwargs)\n\n    # Matteo: this is a workaround to handle loading of model with and without target networks\n    # A better solution may be to add a flag to the model config so that it is automatically\n    # handled by the class.\n    # I've added the flag strict so that we can also load the model without targets if\n    # we want to save memory\n    state_dict = safetensors.torch.load_file(model_dir / \"model.safetensors\", device=device)\n    if strict and any([\"target\" in key for key in state_dict.keys()]):\n        loaded_model._prepare_for_train()\n    # load_model also restores aliases omitted by safetensors.save_model.\n    safetensors.torch.load_model(loaded_model, model_dir / \"model.safetensors\", device=device, strict=strict)\n    return loaded_model\n\n\nclass BaseModelConfig(BaseConfig):\n    device: tp.Literal[\"cpu\", \"cuda\"] = \"cuda\"\n\n\nclass BaseModel(nn.Module):\n    config_class = BaseModelConfig\n\n    def __init__(self, obs_space, action_dim, config: BaseModelConfig):\n        super().__init__()\n        self.obs_space = obs_space\n        self.action_dim = action_dim\n        self.cfg = config\n\n    def to(self, *args, **kwargs):\n        device, _, _, _ = torch._C._nn._parse_to(*args, **kwargs)\n        if device is not None:\n            self.device = device.type  # type: ignore\n        return super().to(*args, **kwargs)\n\n    @classmethod\n    def load(cls, path: str, device: str | None = None, strict: bool = True):\n        return load_model(path, device, strict=strict, config_class=cls.config_class)\n\n    def save(self, output_folder: str) -> None:\n        return save_model(output_folder, self, build_kwargs={\"obs_space\": self.obs_space, \"action_dim\": self.action_dim})\n", "humanoidverse/agents/fb/agent.py": "# Copyright (c) Meta Platforms, Inc. and affiliates.\n#\n# This source code is licensed under the CC BY-NC 4.0 license found in the\n# LICENSE file in the root directory of this source tree.\n\nimport json\nimport pickle\nfrom pathlib import Path\nfrom typing import Dict, Literal, Tuple\n\nimport pydantic\nimport safetensors\nimport torch\nimport torch.nn.functional as F\nfrom torch.amp import autocast\nfrom torch.utils._pytree import tree_map\n\nfrom ..base import BaseConfig\nfrom ..base_model import migrate_legacy_aux_critic_config\nfrom ..envs.utils.gym_spaces import json_to_space, space_to_json\nfrom ..misc.zbuffer import ZBuffer\nfrom ..nn_models import _soft_update_params, eval_mode, weight_init\nfrom .model import FBModel, FBModelConfig\n\n\nclass FBAgentTrainConfig(BaseConfig):\n    lr_f: float = 1e-4\n    lr_b: float = 1e-4\n    lr_actor: float = 1e-4\n    weight_decay: float = 0.0\n    clip_grad_norm: float = 0.0\n    fb_target_tau: float = 0.01\n    ortho_coef: float = 1.0\n    train_goal_ratio: float = 0.5\n    fb_pessimism_penalty: float = 0.0\n    actor_pessimism_penalty: float = 0.5\n    stddev_clip: float = 0.3\n    q_loss_coef: float = 0.0\n    batch_size: int = 1024\n    discount: float = 0.99\n    use_mix_rollout: bool = False\n    update_z_every_step: int = 150\n    z_buffer_size: int = 10000\n    rollout_expert_trajectories: bool = False\n    rollout_expert_trajectories_length: int = 250\n    rollout_expert_trajectories_percentage: float = pydantic.Field(default=0.25, ge=0., le=1.)\n\n\nclass FBAgentConfig(BaseConfig):\n    name: Literal[\"FBAgent\"] = \"FBAgent\"\n    model: FBModelConfig\n    train: FBAgentTrainConfig\n    cudagraphs: bool = False\n    compile: bool = False\n\n    def build(self, obs_space, action_dim):\n        return self.object_class(obs_space, action_dim, self)\n\n    @property\n    def object_class(self):\n        return FBAgent\n\n\nclass FBAgent:\n    config_class = FBAgentConfig\n\n    def __init__(self, obs_space, action_dim, cfg: FBAgentConfig):\n        self.obs_space = obs_space\n        self.action_dim = action_dim\n        self.cfg = cfg\n        self.fb_target_tau = float(min(max(self.cfg.train.fb_target_tau, 0), 1))\n        self._model: FBModel = self.cfg.model.build(obs_space, action_dim)\n        self.setup_training()\n        self.setup_compile()\n        # This is just to be sure? I think it should not change since build\n        self._model.to(self.device)\n\n        self.env_idx_with_expert_rollout = None\n\n    @property\n    def device(self):\n        return self._model.device\n\n    @property\n    def optimizer_dict(self):\n        return {\n            \"actor_optimizer\": self.actor_optimizer.state_dict(),\n            \"backward_optimizer\": self.backward_optimizer.state_dict(),\n            \"forward_optimizer\": self.forward_optimizer.state_dict(),\n        }\n\n    def setup_training(self) -> None:\n        self._model.train(True)\n        self._model.requires_grad_(True)\n        self._model.apply(weight_init)\n        self._model._prepare_for_train()  # ensure that target nets are initialized after applying the weights\n\n        self.backward_optimizer = torch.optim.Adam(\n            self._model._backward_map.parameters(),\n            lr=self.cfg.train.lr_b,\n            capturable=self.cfg.cudagraphs and not self.cfg.compile,\n            weight_decay=self.cfg.train.weight_decay,\n        )\n        self.forward_optimizer = torch.optim.Adam(\n            self._model._forward_map.parameters(),\n            lr=self.cfg.train.lr_f,\n            capturable=self.cfg.cudagraphs and not self.cfg.compile,\n            weight_decay=self.cfg.train.weight_decay,\n        )\n        self.actor_optimizer = torch.optim.Adam(\n            self._model._actor.parameters(),\n            lr=self.cfg.train.lr_actor,\n            capturable=self.cfg.cudagraphs and not self.cfg.compile,\n            weight_decay=self.cfg.train.weight_decay,\n        )\n\n        # prepare parameter list\n        self._forward_map_paramlist = tuple(x for x in self._model._forward_map.parameters())\n        self._target_forward_map_paramlist = tuple(x for x in self._model._target_forward_map.parameters())\n        self._backward_map_paramlist = tuple(x for x in self._model._backward_map.parameters())\n        self._target_backward_map_paramlist = tuple(x for x in self._model._target_backward_map.parameters())\n\n        # precompute some useful variables\n        self.off_diag = 1 - torch.eye(self.cfg.train.batch_size, self.cfg.train.batch_size, device=self.device)\n        self.off_diag_sum = self.off_diag.sum()\n\n        self.z_buffer = ZBuffer(self.cfg.train.z_buffer_size, self.cfg.model.archi.z_dim, self._model.device)\n\n    def setup_compile(self):\n        print(f\"compile {self.cfg.compile}\")\n        if self.cfg.compile:\n            mode = \"reduce-overhead\" if not self.cfg.cudagraphs else None\n            print(f\"compiling with mode '{mode}'\")\n            self.update_fb = torch.compile(self.update_fb, mode=mode)  # use fullgraph=True to debug for graph breaks\n            self.update_actor = torch.compile(self.update_actor, mode=mode)  # use fullgraph=True to debug for graph breaks\n            self.sample_mixed_z = torch.compile(self.sample_mixed_z, mode=mode, fullgraph=True)\n\n        print(f\"cudagraphs {self.cfg.cudagraphs}\")\n        if self.cfg.cudagraphs:\n            from tensordict.nn import CudaGraphModule\n\n            self.update_fb = CudaGraphModule(self.update_fb, warmup=5)\n            self.update_actor = CudaGraphModule(self.update_actor, warmup=5)\n\n    def act(self, obs: torch.Tensor | dict[str, torch.Tensor], z: torch.Tensor, mean: bool = True) -> torch.Tensor:\n        return self._model.act(obs, z, mean)\n\n    @torch.no_grad()\n    def sample_mixed_z(self, train_goal: torch.Tensor | dict[str, torch.Tensor] | None = None, *args, **kwargs):\n        # samples a batch from the z distribution used to update the networks\n        with autocast(device_type=self.device, dtype=self._model.amp_dtype, enabled=self.cfg.model.amp):\n            z = self._model.sample_z(self.cfg.train.batch_size, device=self.device)\n\n            if train_goal is not None:\n                perm = torch.randperm(self.cfg.train.batch_size, device=self.device)\n                train_goal = tree_map(lambda x: x[perm], train_goal)\n                goals = self._model._backward_map(train_goal)\n                goals = self._model.project_z(goals)\n                mask = torch.rand((self.cfg.train.batch_size, 1), device=self.device) \u003c self.cfg.train.train_goal_ratio\n                z = torch.where(mask, goals, z)\n        return z\n\n    def update(self, replay_buffer, step: int) -> Dict[str, torch.Tensor]:\n        batch = replay_buffer[\"train\"].sample(self.cfg.train.batch_size)\n\n        obs, action, next_obs, terminated = (\n            batch[\"observation\"],\n            batch[\"action\"],\n            batch[\"next\"][\"observation\"],\n            batch[\"next\"][\"terminated\"],\n        )\n        discount = self.cfg.train.discount * ~terminated\n\n        self._model._obs_normalizer(obs)\n        self._model._obs_normalizer(next_obs)\n        with torch.no_grad(), eval_mode(self._model._obs_normalizer):\n            obs, next_obs = self._model._obs_normalizer(obs), self._model._obs_normalizer(next_obs)\n\n        torch.compiler.cudagraph_mark_step_begin()\n        z = self.sample_mixed_z(train_goal=next_obs).clone()\n        self.z_buffer.add(z)\n\n        q_loss_coef = self.cfg.train.q_loss_coef if self.cfg.train.q_loss_coef > 0 else None\n        clip_grad_norm = self.cfg.train.clip_grad_norm if self.cfg.train.clip_grad_norm > 0 else None\n\n        torch.compiler.cudagraph_mark_step_begin()\n        metrics = self.update_fb(\n            obs=obs,\n            action=action,\n            discount=discount,\n            next_obs=next_obs,\n            goal=next_obs,\n            z=z,\n            q_loss_coef=q_loss_coef,\n            clip_grad_norm=clip_grad_norm,\n        )\n        metrics.update(\n            self.update_actor(\n                obs=obs,\n                action=action,\n                z=z,\n                clip_grad_norm=clip_grad_norm,\n            )\n        )\n\n        with torch.no_grad():\n            _soft_update_params(self._forward_map_paramlist, self._target_forward_map_paramlist, self.fb_target_tau)\n            _soft_update_params(self._backward_map_paramlist, self._target_backward_map_paramlist, self.fb_target_tau)\n\n        return metrics\n\n    def sample_action_from_norm_obs(self, obs: torch.Tensor | dict[str, torch.Tensor], z: torch.Tensor) -> torch.Tensor:\n        with autocast(device_type=self.device, dtype=self._model.amp_dtype, enabled=self.cfg.model.amp):\n            dist = self._model._actor(obs, z, self._model.cfg.actor_std)\n            action = dist.sample(clip=self.cfg.train.stddev_clip)\n        return action\n\n    def update_fb(\n        self,\n        obs: torch.Tensor | dict[str, torch.Tensor],\n        action: torch.Tensor,\n        discount: torch.Tensor,\n        next_obs: torch.Tensor | dict[str, torch.Tensor],\n        goal: torch.Tensor,\n        z: torch.Tensor,\n        q_loss_coef: float | None,\n        clip_grad_norm: float | None,\n    ) -> Dict[str, torch.Tensor]:\n        with autocast(device_type=self.device, dtype=self._model.amp_dtype, enabled=self.cfg.model.amp):\n            with torch.no_grad():\n                # dist = self._model._actor(next_obs, z, self._model.cfg.actor_std)\n                # next_action = dist.sample(clip=self.cfg.train.stddev_clip)\n                next_action = self.sample_action_from_norm_obs(next_obs, z)\n                target_Fs = self._model._target_forward_map(next_obs, z, next_action)  # num_parallel x batch x z_dim\n                target_B = self._model._target_backward_map(goal)  # batch x z_dim\n                target_Ms = torch.matmul(target_Fs, target_B.T)  # num_parallel x batch x batch\n                _, _, target_M = self.get_targets_uncertainty(target_Ms, self.cfg.train.fb_pessimism_penalty)  # batch x batch\n\n            # compute FB loss\n            Fs = self._model._forward_map(obs, z, action)  # num_parallel x batch x z_dim\n            B = self._model._backward_map(goal)  # batch x z_dim\n            Ms = torch.matmul(Fs, B.T)  # num_parallel x batch x batch\n\n            diff = Ms - discount * target_M  # num_parallel x batch x batch\n            fb_offdiag = 0.5 * (diff * self.off_diag).pow(2).sum() / self.off_diag_sum\n            fb_diag = -torch.diagonal(diff, dim1=1, dim2=2).mean() * Ms.shape[0]\n            fb_loss = fb_offdiag + fb_diag\n\n            # compute orthonormality loss for backward embedding\n            Cov = torch.matmul(B, B.T)\n            orth_loss_diag = -Cov.diag().mean()\n            orth_loss_offdiag = 0.5 * (Cov * self.off_diag).pow(2).sum() / self.off_diag_sum\n            orth_loss = orth_loss_offdiag + orth_loss_diag\n            fb_loss += self.cfg.train.ortho_coef * orth_loss\n\n            q_loss = torch.zeros(1, device=z.device, dtype=z.dtype)\n            if q_loss_coef is not None:\n                with torch.no_grad():\n                    next_Qs = (target_Fs * z).sum(dim=-1)  # num_parallel x batch\n                    _, _, next_Q = self.get_targets_uncertainty(next_Qs, self.cfg.train.fb_pessimism_penalty)  # batch\n                    # TODO: we disable autocast here to make sure B and cov have the same dtype (otherwise torch.linalg.solve fails)\n                    with autocast(device_type=self.device, dtype=self._model.amp_dtype, enabled=False):\n                        cov = torch.matmul(B.T, B) / B.shape[0]  # z_dim x z_dim\n                    # inv_cov = torch.inverse(cov)  # z_dim x z_dim\n                    B_inv_conv = torch.linalg.solve(cov, B, left=False)\n                    implicit_reward = (B_inv_conv * z).sum(dim=-1)  # batch\n                    target_Q = implicit_reward.detach() + discount.squeeze() * next_Q  # batch\n                    expanded_targets = target_Q.expand(Fs.shape[0], -1)\n                Qs = (Fs * z).sum(dim=-1)  # num_parallel x batch\n                q_loss = 0.5 * Fs.shape[0] * F.mse_loss(Qs, expanded_targets)\n                fb_loss += q_loss_coef * q_loss\n\n        # optimize FB\n        self.forward_optimizer.zero_grad(set_to_none=True)\n        self.backward_optimizer.zero_grad(set_to_none=True)\n        fb_loss.backward()\n        if clip_grad_norm is not None:\n            torch.nn.utils.clip_grad_norm_(self._model._forward_map.parameters(), clip_grad_norm)\n            torch.nn.utils.clip_grad_norm_(self._model._backward_map.parameters(), clip_grad_norm)\n        self.forward_optimizer.step()\n        self.backward_optimizer.step()\n\n        with torch.no_grad():\n            output_metrics = {\n                \"target_M\": target_M.mean(),\n                \"M1\": Ms[0].mean(),\n                \"F1\": Fs[0].mean(),\n                \"B\": B.mean(),\n                \"B_norm\": torch.norm(B, dim=-1).mean(),\n                \"z_norm\": torch.norm(z, dim=-1).mean(),\n                \"fb_loss\": fb_loss,\n                \"fb_diag\": fb_diag,\n                \"fb_offdiag\": fb_offdiag,\n                \"orth_loss\": orth_loss,\n                \"orth_loss_diag\": orth_loss_diag,\n                \"orth_loss_offdiag\": orth_loss_offdiag,\n                \"q_loss\": q_loss,\n            }\n        return output_metrics\n\n    def update_actor(\n        self,\n        obs: torch.Tensor | dict[str, torch.Tensor],\n        action: torch.Tensor,\n        z: torch.Tensor,\n        clip_grad_norm: float | None,\n    ) -> Dict[str, torch.Tensor]:\n        return self.update_td3_actor(obs=obs, z=z, clip_grad_norm=clip_grad_norm)\n\n    def update_td3_actor(\n        self, obs: torch.Tensor | dict[str, torch.Tensor], z: torch.Tensor, clip_grad_norm: float | None\n    ) -> Dict[str, torch.Tensor]:\n        with autocast(device_type=self.device, dtype=self._model.amp_dtype, enabled=self.cfg.model.amp):\n            dist = self._model._actor(obs, z, self._model.cfg.actor_std)\n            action = dist.sample(clip=self.cfg.train.stddev_clip)\n            Fs = self._model._forward_map(obs, z, action)  # num_parallel x batch x z_dim\n            Qs = (Fs * z).sum(-1)  # num_parallel x batch\n            _, _, Q = self.get_targets_uncertainty(Qs, self.cfg.train.actor_pessimism_penalty)  # batch\n            actor_loss = -Q.mean()\n\n        # optimize actor\n        self.actor_optimizer.zero_grad(set_to_none=True)\n        actor_loss.backward()\n        if clip_grad_norm is not None:\n            torch.nn.utils.clip_grad_norm_(self._model._actor.parameters(), clip_grad_norm)\n        self.actor_optimizer.step()\n\n        return {\"actor_loss\": actor_loss.detach(), \"q\": Q.mean().detach()}\n\n    def get_targets_uncertainty(\n        self, preds: torch.Tensor, pessimism_penalty: torch.Tensor | float\n    ) -> Tuple[torch.Tensor, torch.Tensor, torch.Tensor]:\n        dim = 0\n        preds_mean = preds.mean(dim=dim)\n        preds_uns = preds.unsqueeze(dim=dim)  # 1 x n_parallel x ...\n        preds_uns2 = preds.unsqueeze(dim=dim + 1)  # n_parallel x 1 x ...\n        preds_diffs = torch.abs(preds_uns - preds_uns2)  # n_parallel x n_parallel x ...\n        num_parallel_scaling = preds.shape[dim] ** 2 - preds.shape[dim]\n        preds_unc = (\n            preds_diffs.sum(\n                dim=(dim, dim + 1),\n            )\n            / num_parallel_scaling\n        )\n        return preds_mean, preds_unc, preds_mean - pessimism_penalty * preds_unc\n    \n    def _sample_tracking_z(self, replay_buffer, batch_dim, traj_length):\n        if batch_dim == 0:\n            return torch.empty((0, traj_length, self.cfg.model.archi.z_dim), device=self._model.device)\n        batch = replay_buffer[\"expert_slicer\"].sample(batch_dim * traj_length, seq_length=traj_length)  # N*T x obs_dim\n        z = self._model.backward_map(batch[\"next\"][\"observation\"])  # NT x z_dim\n        z = z.view(batch_dim, traj_length, z.shape[-1])  # N x T x z_dim\n        for step in range(traj_length):\n            end_idx = min(step + self.cfg.model.seq_length, traj_length)\n            z[:, step] = z[:, step:end_idx].mean(dim=1)\n        return self._model.project_z(z)  # N x T x z_dim\n\n    def maybe_update_rollout_context(self, z: torch.Tensor | None, step_count: torch.Tensor, replay_buffer: None = None) -> torch.Tensor:\n        # get mask for environmets where we need to change z\n        if z is not None:\n            mask_reset_z = step_count % self.cfg.train.update_z_every_step == 0\n            if self.cfg.train.use_mix_rollout and not self.z_buffer.empty():\n                new_z = self.z_buffer.sample(z.shape[0], device=self._model.device)\n            else:\n                new_z = self._model.sample_z(z.shape[0], device=self._model.device)\n            z = torch.where(mask_reset_z, new_z, z.to(self._model.device))\n            if self.cfg.train.rollout_expert_trajectories:\n                idxs = step_count % self.cfg.train.rollout_expert_trajectories_length\n                if torch.any(idxs == 0):\n                    n_elem = int(self.cfg.train.rollout_expert_trajectories_percentage*step_count.shape[0])\n                    self.env_idx_with_expert_rollout = torch.randperm(step_count.shape[0], device=self._model.device)[:n_elem]\n                    self.tracking_z = self._sample_tracking_z(replay_buffer, n_elem, self.cfg.train.rollout_expert_trajectories_length)  # N x T x z_dim\n                mod_time = idxs[self.env_idx_with_expert_rollout].ravel()\n                z[self.env_idx_with_expert_rollout] = self.tracking_z[torch.arange(len(self.env_idx_with_expert_rollout), device=self._model.device), mod_time]\n        else:\n            z = self._model.sample_z(step_count.shape[0], device=self._model.device)\n            if self.cfg.train.rollout_expert_trajectories:\n                n_elem = int(self.cfg.train.rollout_expert_trajectories_percentage*step_count.shape[0])\n                self.env_idx_with_expert_rollout = torch.randperm(step_count.shape[0], device=self._model.device)[:n_elem]\n                self.tracking_z = self._sample_tracking_z(replay_buffer, n_elem, self.cfg.train.rollout_expert_trajectories_length)  # N x T x z_dim\n                z[self.env_idx_with_expert_rollout] = self.tracking_z[:, 0]\n        return z\n\n    @classmethod\n    def load(cls, path: str, device: str | None = None):\n        path = Path(path)\n        with (path / \"config.json\").open() as f:\n            loaded_config = json.load(f)\n        if device is not None:\n            loaded_config[\"model\"][\"device\"] = device\n\n        if (path / \"init_kwargs.pkl\").exists():\n            # Load arguments from a pickle file\n            with (path / \"init_kwargs.pkl\").open(\"rb\") as f:\n                args = pickle.load(f)\n            obs_space = args[\"obs_space\"]\n            action_dim = args[\"action_dim\"]\n        else:\n            # load argeuments from a json file\n            with (path / \"init_kwargs.json\").open(\"r\") as f:\n                args = json.load(f)\n            obs_space = json_to_space(args[\"obs_space\"])\n            action_dim = args[\"action_dim\"]\n\n        loaded_config[\"model\"] = migrate_legacy_aux_critic_config(loaded_config[\"model\"])\n        config = cls.config_class(**loaded_config)\n        agent = config.build(obs_space, action_dim)\n        optimizers = torch.load(str(path / \"optimizers.pth\"), weights_only=True, map_location=device)\n        for k, v in optimizers.items():\n            getattr(agent, k).load_state_dict(v)\n        safetensors.torch.load_model(agent._model, path / \"model/model.safetensors\", device=device, strict=True)\n        agent._model.train()\n        agent._model.requires_grad_(True)\n        return agent\n\n    def save(self, output_folder: str) -> None:\n        output_folder = Path(output_folder)\n        output_folder.mkdir(exist_ok=True, parents=True)\n        json_dump = self.cfg.model_dump()\n        with (output_folder / \"config.json\").open(\"w+\") as f:\n            json.dump(json_dump, f, indent=4)\n        # save optimizer\n        torch.save(\n            self.optimizer_dict,\n            output_folder / \"optimizers.pth\",\n        )\n        # save model\n        model_folder = output_folder / \"model\"\n        model_folder.mkdir(exist_ok=True)\n        self._model.save(output_folder=str(model_folder))\n\n        # Save the arguments required to create this agent (in addition to the config)\n        init_kwargs = {\n            \"obs_space\": space_to_json(self.obs_space),\n            \"action_dim\": self.action_dim,\n        }\n        with (output_folder / \"init_kwargs.json\").open(\"w\") as f:\n            json.dump(init_kwargs, f, indent=4)\n", "humanoidverse/agents/fb/model.py": "# Copyright (c) Meta Platforms, Inc. and affiliates.\n#\n# This source code is licensed under the CC BY-NC 4.0 license found in the\n# LICENSE file in the root directory of this source tree.\n\nimport copy\nimport math\nimport typing as tp\n\nimport numpy as np\nimport pydantic\nimport torch\nimport torch.nn.functional as F\nfrom torch.amp import autocast\nfrom torch.utils._pytree import tree_map\n\nfrom ..base import BaseConfig\nfrom ..base_model import BaseModel, BaseModelConfig\nfrom ..nn_filter_models import (\n    ActorFilterArchiConfig,\n    BackwardFilterArchiConfig,\n    ForwardFilterArchiConfig,\n    ResidualActorFilterArchiConfig,\n    SimpleActorFilterArchiConfig,\n)\nfrom ..nn_models import (\n    ActorArchiConfig,\n    BackwardArchiConfig,\n    ForwardArchiConfig,\n    ResidualActorArchiConfig,\n    SimpleActorArchiConfig,\n    eval_mode,\n)\nfrom ..normalizers import ObsNormalizerConfig\nfrom ..pytree_utils import tree_get_batch_size\n\n\nclass FBModelArchiConfig(BaseConfig):\n    z_dim: int = 100\n    norm_z: bool = True\n    f: ForwardArchiConfig | ForwardFilterArchiConfig = pydantic.Field(ForwardArchiConfig(), discriminator=\"name\")\n    b: BackwardArchiConfig | BackwardFilterArchiConfig = pydantic.Field(BackwardArchiConfig(), discriminator=\"name\")\n    # Because of the \"name\" attribute, these two can be chosen between via strings easily\n    actor: (\n        ActorArchiConfig\n        | ActorFilterArchiConfig\n        | SimpleActorArchiConfig\n        | ResidualActorArchiConfig\n        | SimpleActorFilterArchiConfig\n        | ResidualActorFilterArchiConfig\n    ) = pydantic.Field(SimpleActorArchiConfig(), discriminator=\"name\")\n\n\nclass FBModelConfig(BaseModelConfig):\n    name: tp.Literal[\"FBModel\"] = \"FBModel\"\n\n    archi: FBModelArchiConfig = FBModelArchiConfig()\n    obs_normalizer: ObsNormalizerConfig = ObsNormalizerConfig()\n    inference_batch_size: int = 500_000\n    seq_length: int = 1\n    actor_std: float = 0.2\n    amp: bool = False\n\n    def build(self, obs_space, action_dim) -> \"FBModel\":\n        return self.object_class(obs_space, action_dim, self)\n\n    @property\n    def object_class(self):\n        return FBModel\n\n\nclass FBModel(BaseModel):\n    config_class = FBModelConfig\n\n    def __init__(self, obs_space, action_dim, cfg: FBModelConfig):\n        super().__init__(obs_space, action_dim, cfg)\n        self.obs_space = obs_space\n        self.action_dim = action_dim\n        self.cfg: FBModelConfig = cfg\n        arch = self.cfg.archi\n        self.device = self.cfg.device\n        self.amp_dtype = torch.bfloat16\n\n        # create networks\n        self._backward_map = arch.b.build(obs_space, arch.z_dim)\n        self._forward_map = arch.f.build(obs_space, arch.z_dim, action_dim)\n        self._actor = arch.actor.build(obs_space, arch.z_dim, action_dim)\n        self._obs_normalizer = self.cfg.obs_normalizer.build(obs_space)\n\n        # make sure the model is in eval mode and never computes gradients\n        self.train(False)\n        self.requires_grad_(False)\n        self.to(self.device)\n\n    def _prepare_for_train(self) -> None:\n        # create TARGET networks\n        self._target_backward_map = copy.deepcopy(self._backward_map)\n        self._target_forward_map = copy.deepcopy(self._forward_map)\n\n    def _normalize(self, obs: torch.Tensor | dict[str, torch.Tensor]):\n        with torch.no_grad(), eval_mode(self._obs_normalizer):\n            return self._obs_normalizer(obs)\n\n    @torch.no_grad()\n    def backward_map(self, obs: torch.Tensor | dict[str, torch.Tensor]):\n        with autocast(device_type=self.device, dtype=self.amp_dtype, enabled=self.cfg.amp):\n            return self._backward_map(self._normalize(obs))\n\n    @torch.no_grad()\n    def forward_map(self, obs: torch.Tensor | dict[str, torch.Tensor], z: torch.Tensor, action: torch.Tensor):\n        with autocast(device_type=self.device, dtype=self.amp_dtype, enabled=self.cfg.amp):\n            return self._forward_map(self._normalize(obs), z, action)\n\n    @torch.no_grad()\n    def actor(self, obs: torch.Tensor | dict[str, torch.Tensor], z: torch.Tensor, std: float):\n        with autocast(device_type=self.device, dtype=self.amp_dtype, enabled=self.cfg.amp):\n            return self._actor(self._normalize(obs), z, std)\n\n    def sample_z(self, size: int, device: str = \"cpu\") -> torch.Tensor:\n        z = torch.randn((size, self.cfg.archi.z_dim), dtype=torch.float32, device=device)\n        return self.project_z(z)\n\n    def project_z(self, z):\n        if self.cfg.archi.norm_z:\n            z = math.sqrt(z.shape[-1]) * F.normalize(z, dim=-1)\n        return z\n\n    def act(self, obs: torch.Tensor | dict[str, torch.Tensor], z: torch.Tensor, mean: bool = True) -> torch.Tensor:\n        dist = self.actor(obs, z, self.cfg.actor_std)\n        if mean:\n            return dist.mean.float()\n        return dist.sample().float()  # TODO we upcast to float32 to make sure the action can be converted to numpy later\n\n    def reward_inference(\n        self, next_obs: torch.Tensor | dict[str, torch.Tensor], reward: torch.Tensor, weight: torch.Tensor | None = None\n    ) -> torch.Tensor:\n        with autocast(device_type=self.device, dtype=self.amp_dtype, enabled=self.cfg.amp):\n            batch_size = tree_get_batch_size(next_obs)\n            num_batches = int(np.ceil(batch_size / self.cfg.inference_batch_size))\n            z = 0\n            wr = reward if weight is None else reward * weight\n            for i in range(num_batches):\n                start_idx, end_idx = i * self.cfg.inference_batch_size, (i + 1) * self.cfg.inference_batch_size\n                next_obs_slice = tree_map(lambda x: x[start_idx:end_idx].to(self.device), next_obs)\n                B = self.backward_map(next_obs_slice)\n                z += torch.matmul(wr[start_idx:end_idx].to(self.device).T, B)\n        return self.project_z(z)\n\n    def reward_wr_inference(self, next_obs: torch.Tensor | dict[str, torch.Tensor], reward: torch.Tensor) -> torch.Tensor:\n        return self.reward_inference(next_obs, reward, F.softmax(10 * reward, dim=0))\n\n    def goal_inference(self, next_obs: torch.Tensor | dict[str, torch.Tensor]) -> torch.Tensor:\n        z = self.backward_map(next_obs)\n        return self.project_z(z)\n\n    def tracking_inference(self, next_obs: torch.Tensor | dict[str, torch.Tensor]) -> torch.Tensor:\n        z = self.backward_map(next_obs)\n        for step in range(z.shape[0]):\n            end_idx = min(step + self.cfg.seq_length, z.shape[0])\n            z[step] = z[step:end_idx].mean(dim=0)\n        return self.project_z(z)\n", "humanoidverse/agents/fb_cpr/agent.py": "# Copyright (c) Meta Platforms, Inc. and affiliates.\n#\n# This source code is licensed under the CC BY-NC 4.0 license found in the\n# LICENSE file in the root directory of this source tree.\n\nfrom typing import Dict, Literal\n\nimport torch\nimport torch.nn.functional as F\nfrom torch import autograd\nfrom torch.amp import autocast\nfrom torch.utils._pytree import tree_map\n\nfrom ..base import BaseConfig\nfrom ..fb.agent import FBAgent, FBAgentTrainConfig\nfrom ..nn_models import _soft_update_params, eval_mode\nfrom ..pytree_utils import tree_get_batch_size\nfrom .model import FBcprModel, FBcprModelConfig\n\n\nclass FBcprAgentTrainConfig(FBAgentTrainConfig):\n    lr_discriminator: float = 1e-4\n    lr_critic: float = 1e-4\n    critic_target_tau: float = 0.005\n    critic_pessimism_penalty: float = 0.5\n    reg_coeff: float = 1\n    scale_reg: bool = True\n    # the z distribution for rollouts (when agent.use_mix_rollout=1) and for the mini-batches used in the network updates is:\n    # - a fraction of 'expert_asm_ratio' zs from expert trajectory encoding\n    # - a fraction of 'train_goal_ratio' zs from goal encoding (goals sampled from the train buffer)\n    # - the remaining fraction from the uniform distribution\n    expert_asm_ratio: float = 0\n    # a fraction of 'relabel_ratio' transitions in each mini-batch are relabeled with a z sampled from the above distribution\n    relabel_ratio: float | None = 1\n    grad_penalty_discriminator: float = 10.0\n    # Commented out as example but not useful\n    # grad_penalty_obs_weight: float | None = None  # must be in (0,1)\n    weight_decay_discriminator: float = 0.0\n\n\nclass FBcprAgentConfig(BaseConfig):\n    name: Literal[\"FBcprAgent\"] = \"FBcprAgent\"\n    model: FBcprModelConfig = FBcprModelConfig()\n    train: FBcprAgentTrainConfig = FBcprAgentTrainConfig()\n    cudagraphs: bool = False\n    compile: bool = False\n\n    def build(self, obs_space, action_dim):\n        return FBcprAgent(obs_space, action_dim, self)\n\n    @property\n    def object_class(self):\n        return FBcprAgent\n\n\nclass FBcprAgent(FBAgent):\n    config_class = FBcprAgentConfig\n\n    def __init__(self, obs_space, action_dim, cfg: FBcprAgentConfig):\n        self.obs_space = obs_space\n        self.action_dim = action_dim\n        self.cfg = cfg\n        # make sure batch size is a multiple of seq_length\n        seq_length = cfg.model.seq_length\n        batch_size = cfg.train.batch_size\n        assert (batch_size / seq_length) == (batch_size // seq_length), \"Batch size should be divisable by seq_length\"\n        del seq_length, batch_size\n\n        self._model: FBcprModel = self.cfg.model.build(obs_space, action_dim)\n        # This is just to be sure? I think it should not change since build\n        self._model.to(self.device)\n        self.setup_training()\n        self.setup_compile()\n        self.env_idx_with_expert_rollout = None\n\n    @classmethod\n    def supported_evaluations(cls):\n        return [\"reward\", \"tracking\"]\n\n    @property\n    def optimizer_dict(self):\n        optimizers = super().optimizer_dict\n        optimizers.update(\n            {\n                \"critic_optimizer\": self.critic_optimizer.state_dict(),\n                \"discriminator_optimizer\": self.discriminator_optimizer.state_dict(),\n            }\n        )\n        return optimizers\n\n    def setup_training(self) -> None:\n        super().setup_training()\n\n        # prepare parameter list\n        self._critic_map_paramlist = tuple(x for x in self._model._critic.parameters())\n        self._target_critic_map_paramlist = tuple(x for x in self._model._target_critic.parameters())\n\n        self.critic_optimizer = torch.optim.Adam(\n            self._model._critic.parameters(),\n            lr=self.cfg.train.lr_critic,\n            capturable=self.cfg.cudagraphs and not self.cfg.compile,\n            weight_decay=self.cfg.train.weight_decay,\n        )\n        self.discriminator_optimizer = torch.optim.Adam(\n            self._model._discriminator.parameters(),\n            lr=self.cfg.train.lr_discriminator,\n            capturable=self.cfg.cudagraphs and not self.cfg.compile,\n            weight_decay=self.cfg.train.weight_decay_discriminator,\n        )\n\n    def setup_compile(self):\n        super().setup_compile()\n        if self.cfg.compile:\n            mode = \"reduce-overhead\" if not self.cfg.cudagraphs else None\n            self.update_critic = torch.compile(self.update_critic, mode=mode)\n            self.update_discriminator = torch.compile(self.update_discriminator, mode=mode)\n            self.encode_expert = torch.compile(self.encode_expert, mode=mode, fullgraph=True)\n\n        if self.cfg.cudagraphs:\n            from tensordict.nn import CudaGraphModule\n\n            self.update_critic = CudaGraphModule(self.update_critic, warmup=5)\n            self.update_discriminator = CudaGraphModule(self.update_discriminator, warmup=5)\n            self.encode_expert = CudaGraphModule(self.encode_expert, warmup=5)\n\n    @torch.no_grad()\n    def sample_mixed_z(self, train_goal: torch.Tensor, expert_encodings: torch.Tensor, *args, **kwargs):\n        with autocast(device_type=self.device, dtype=self._model.amp_dtype, enabled=self.cfg.model.amp):\n            z = self._model.sample_z(self.cfg.train.batch_size, device=self.device)\n            p_goal = self.cfg.train.train_goal_ratio\n            p_expert_asm = self.cfg.train.expert_asm_ratio\n            prob = torch.tensor(\n                [p_goal, p_expert_asm, 1 - p_goal - p_expert_asm],\n                dtype=torch.float32,\n                device=self.device,\n            )\n            mix_idxs = torch.multinomial(prob, num_samples=self.cfg.train.batch_size, replacement=True).reshape(-1, 1)\n\n            # zs obtained by encoding train goals\n            perm = torch.randperm(self.cfg.train.batch_size, device=self.device)\n            train_goal = tree_map(lambda x: x[perm], train_goal)\n            goals = self._model._backward_map(train_goal)\n            goals = self._model.project_z(goals)\n            z = torch.where(mix_idxs == 0, goals, z)\n\n            # zs obtained by encoding expert trajectories\n            perm = torch.randperm(self.cfg.train.batch_size, device=self.device)\n            z = torch.where(mix_idxs == 1, expert_encodings[perm], z)\n\n        return z\n\n    @torch.no_grad()\n    def encode_expert(\n        self,\n        next_obs: torch.Tensor | dict[str, torch.Tensor],\n    ):\n        # encode expert trajectories through B\n        with autocast(device_type=self.device, dtype=self._model.amp_dtype, enabled=self.cfg.model.amp):\n            B_expert = self._model._backward_map(next_obs).detach()  # batch x d\n            B_expert = B_expert.view(\n                self.cfg.train.batch_size // self.cfg.model.seq_length,\n                self.cfg.model.seq_length,\n                B_expert.shape[-1],\n            )  # N x L x d\n            z_expert = B_expert.mean(dim=1)  # N x d\n            z_expert = self._model.project_z(z_expert)\n            z_expert = torch.repeat_interleave(z_expert, self.cfg.model.seq_length, dim=0)  # batch x d\n        return z_expert\n\n    def update(self, replay_buffer, step: int) -> Dict[str, torch.Tensor]:\n        expert_batch = replay_buffer[\"expert_slicer\"].sample(self.cfg.train.batch_size)\n        train_batch = replay_buffer[\"train\"].sample(self.cfg.train.batch_size)\n\n        train_obs, train_action, train_next_obs = (\n            tree_map(lambda x: x.to(self.device), train_batch[\"observation\"]),\n            train_batch[\"action\"].to(self.device),\n            tree_map(lambda x: x.to(self.device), train_batch[\"next\"][\"observation\"]),\n        )\n        discount = self.cfg.train.discount * ~train_batch[\"next\"][\"terminated\"].to(self.device)\n        expert_obs, expert_next_obs = (\n            tree_map(lambda x: x.to(self.device), expert_batch[\"observation\"]),\n            tree_map(lambda x: x.to(self.device), expert_batch[\"next\"][\"observation\"]),\n        )\n\n        self._model._obs_normalizer(train_obs)\n        self._model._obs_normalizer(train_next_obs)\n\n        with torch.no_grad(), eval_mode(self._model._obs_normalizer):\n            train_obs, train_next_obs = (\n                self._model._obs_normalizer(train_obs),\n                self._model._obs_normalizer(train_next_obs),\n            )\n            expert_obs, expert_next_obs = (\n                self._model._obs_normalizer(expert_obs),\n                self._model._obs_normalizer(expert_next_obs),\n            )\n\n        torch.compiler.cudagraph_mark_step_begin()\n        expert_z = self.encode_expert(next_obs=expert_next_obs)\n        train_z = train_batch[\"z\"].to(self.device)\n\n        # train the discriminator\n        grad_penalty = self.cfg.train.grad_penalty_discriminator if self.cfg.train.grad_penalty_discriminator > 0 else None\n        metrics = self.update_discriminator(\n            expert_obs=expert_obs,\n            expert_z=expert_z,\n            train_obs=train_obs,\n            train_z=train_z,\n            grad_penalty=grad_penalty,\n        )\n\n        z = self.sample_mixed_z(train_goal=train_next_obs, expert_encodings=expert_z).clone()\n        self.z_buffer.add(z)\n\n        if self.cfg.train.relabel_ratio is not None:\n            mask = torch.rand((self.cfg.train.batch_size, 1), device=self.device) \u003c= self.cfg.train.relabel_ratio\n            train_z = torch.where(mask, z, train_z)\n\n        q_loss_coef = self.cfg.train.q_loss_coef if self.cfg.train.q_loss_coef > 0 else None\n        clip_grad_norm = self.cfg.train.clip_grad_norm if self.cfg.train.clip_grad_norm > 0 else None\n\n        metrics.update(\n            self.update_fb(\n                obs=train_obs,\n                action=train_action,\n                discount=discount,\n                next_obs=train_next_obs,\n                goal=train_next_obs,\n                z=train_z,\n                q_loss_coef=q_loss_coef,\n                clip_grad_norm=clip_grad_norm,\n            )\n        )\n        metrics.update(\n            self.update_critic(\n                obs=train_obs,\n                action=train_action,\n                discount=discount,\n                next_obs=train_next_obs,\n                z=train_z,\n            )\n        )\n        metrics.update(\n            self.update_actor(\n                obs=train_obs,\n                action=train_action,\n                z=train_z,\n                clip_grad_norm=clip_grad_norm,\n            )\n        )\n\n        with torch.no_grad():\n            _soft_update_params(\n                self._forward_map_paramlist,\n                self._target_forward_map_paramlist,\n                self.cfg.train.fb_target_tau,\n            )\n            _soft_update_params(\n                self._backward_map_paramlist,\n                self._target_backward_map_paramlist,\n                self.cfg.train.fb_target_tau,\n            )\n            _soft_update_params(\n                self._critic_map_paramlist,\n                self._target_critic_map_paramlist,\n                self.cfg.train.critic_target_tau,\n            )\n\n        return metrics\n\n    @torch.compiler.disable\n    def gradient_penalty_wgan(\n        self,\n        real_obs: torch.Tensor | dict[str, torch.Tensor],\n        real_z: torch.Tensor,\n        fake_obs: torch.Tensor | dict[str, torch.Tensor],\n        fake_z: torch.Tensor,\n    ) -> torch.Tensor:\n        batch_size = tree_get_batch_size(real_obs)\n        alpha = torch.rand(batch_size, 1, device=real_z.device)\n\n        # TODO does not work for nested dicts\n        interpolated_obs = {}\n        interpolated_obs_list = []\n        if isinstance(real_obs, torch.Tensor):\n            if real_obs.shape != fake_obs.shape:\n                raise ValueError(f\"Shape mismatch: {real_obs.shape} vs {fake_obs.shape}\")\n            interpolated_obs = (alpha * real_obs + (1 - alpha) * fake_obs).requires_grad_(True)\n            interpolated_obs_list.append(interpolated_obs)\n        else:\n            for key in real_obs.keys():\n                real_obs_tensor = real_obs[key]\n                fake_obs_tensor = fake_obs[key]\n                if isinstance(real_obs_tensor, torch.Tensor):\n                    interpolated_obs[key] = (alpha * real_obs_tensor + (1 - alpha) * fake_obs_tensor).requires_grad_(True)\n                    interpolated_obs_list.append(interpolated_obs[key])\n                else:\n                    raise ValueError(f\"Unsupported type for key {key}: {type(real_obs_tensor)}\")\n\n        interpolated_z = alpha * real_z + (1 - alpha) * fake_z\n        interpolated_z = interpolated_z.requires_grad_(True)\n\n        d_interpolates = self._model._discriminator.compute_logits(interpolated_obs, interpolated_z)\n        gradients = autograd.grad(\n            outputs=d_interpolates,\n            inputs=interpolated_obs_list + [interpolated_z],\n            grad_outputs=torch.ones_like(d_interpolates),\n            create_graph=True,\n            retain_graph=True,\n            only_inputs=True,\n            # obs might contain entries that are not used by discriminator, in which case autograd.grad would complain about unused variables\n            # We need to explicitely allow unused variables\n            # TODO maybe remove these variables from the inputs completely instead? (we could read self._model._discriminator.filtered_space.keys, but this creates a dependency on the discriminator)\n            allow_unused=True,\n        )\n\n        # Filter out None's from gradients: if any input is not used by the discriminator, autograd.grad will return None for its gradient\n        gradients = [g for g in gradients if g is not None]\n        cat_gradients = torch.cat(gradients, dim=1)\n        gradient_penalty = ((cat_gradients.norm(2, dim=1) - 1) ** 2).mean()\n\n        # Example of code with grad_penalty_obs_weight\n        # obs_dim = real_obs.shape[-1]\n        # grad_obs = gradients[:, :obs_dim]\n        # grad_z = gradients[:, obs_dim:]\n        # w_obs = self.cfg.train.grad_penalty_obs_weight\n        # w_z = 1 - w_obs\n        # gradient_penalty_obs = ((grad_obs.norm(2, dim=1) - w_obs) ** 2).mean()\n        # gradient_penalty_z = ((grad_z.norm(2, dim=1) - w_z) ** 2).mean()\n        # gradient_penalty = 0.5 * (gradient_penalty_obs + gradient_penalty_z)\n        return gradient_penalty\n\n    def update_discriminator(\n        self,\n        expert_obs: torch.Tensor | dict[str, torch.Tensor],\n        expert_z: torch.Tensor,\n        train_obs: torch.Tensor | dict[str, torch.Tensor],\n        train_z: torch.Tensor,\n        grad_penalty: float | None,\n    ) -> Dict[str, torch.Tensor]:\n        with autocast(device_type=self.device, dtype=self._model.amp_dtype, enabled=self.cfg.model.amp):\n            expert_logits = self._model._discriminator.compute_logits(obs=expert_obs, z=expert_z)\n            unlabeled_logits = self._model._discriminator.compute_logits(obs=train_obs, z=train_z)\n            # these are equivalent to binary cross entropy\n            expert_loss = -torch.nn.functional.logsigmoid(expert_logits)\n            unlabeled_loss = torch.nn.functional.softplus(unlabeled_logits)\n            loss = torch.mean(expert_loss + unlabeled_loss)\n\n            if grad_penalty is not None:\n                wgan_gp = self.gradient_penalty_wgan(expert_obs, expert_z, train_obs, train_z)\n                loss += grad_penalty * wgan_gp\n\n        self.discriminator_optimizer.zero_grad(set_to_none=True)\n        loss.backward()\n        self.discriminator_optimizer.step()\n\n        with torch.no_grad():\n            output_metrics = {\n                \"disc_loss\": loss.detach(),\n                \"disc_expert_loss\": expert_loss.detach().mean().detach(),\n                \"disc_train_loss\": unlabeled_loss.detach().mean().detach(),\n            }\n            if grad_penalty is not None:\n                output_metrics[\"disc_wgan_gp_loss\"] = wgan_gp.detach()\n        return output_metrics\n\n    def update_critic(\n        self,\n        obs: torch.Tensor | dict[str, torch.Tensor],\n        action: torch.Tensor,\n        discount: torch.Tensor,\n        next_obs: torch.Tensor | dict[str, torch.Tensor],\n        z: torch.Tensor,\n    ) -> Dict[str, torch.Tensor]:\n        with autocast(device_type=self.device, dtype=self._model.amp_dtype, enabled=self.cfg.model.amp):\n            num_parallel = self.cfg.model.archi.critic.num_parallel\n            # compute target critic\n            with torch.no_grad():\n                reward = self._model._discriminator.compute_reward(obs=obs, z=z)\n                dist = self._model._actor(next_obs, z, self._model.cfg.actor_std)\n                next_action = dist.sample(clip=self.cfg.train.stddev_clip)\n                next_Qs = self._model._target_critic(next_obs, z, next_action)  # num_parallel x batch x 1\n                Q_mean, Q_unc, next_V = self.get_targets_uncertainty(next_Qs, self.cfg.train.critic_pessimism_penalty)\n                target_Q = reward + discount * next_V\n                expanded_targets = target_Q.expand(num_parallel, -1, -1)\n\n            # compute critic loss\n            Qs = self._model._critic(obs, z, action)  # num_parallel x batch x (1 or n_bins)\n            critic_loss = 0.5 * num_parallel * F.mse_loss(Qs, expanded_targets)\n\n        # optimize critic\n        self.critic_optimizer.zero_grad(set_to_none=True)\n
