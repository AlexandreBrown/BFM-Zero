clip_grad_norm)\n        self.actor_optimizer.step()\n\n        with torch.no_grad():\n            output_metrics = {\n                \"actor_loss\": actor_loss.detach(),\n                \"Q_discriminator\": Q_discriminator.mean().detach(),\n                \"Q_fb\": Q_fb.mean().detach(),\n            }\n        return output_metrics\n", "humanoidverse/agents/fb_cpr/model.py": "# Copyright (c) Meta Platforms, Inc. and affiliates.\n#\n# This source code is licensed under the CC BY-NC 4.0 license found in the\n# LICENSE file in the root directory of this source tree.\n\nimport copy\nimport typing as tp\n\nimport pydantic\nimport torch\nfrom torch.amp import autocast\n\nfrom ..fb.model import FBModel, FBModelArchiConfig, FBModelConfig\nfrom ..nn_filter_models import DiscriminatorFilterArchiConfig, ForwardFilterArchiConfig\nfrom ..nn_models import DiscriminatorArchiConfig, ForwardArchiConfig\n\n\nclass FBcprModelArchiConfig(FBModelArchiConfig):\n    critic: ForwardArchiConfig | ForwardFilterArchiConfig = pydantic.Field(ForwardArchiConfig(), discriminator=\"name\")\n    discriminator: DiscriminatorArchiConfig | DiscriminatorFilterArchiConfig = pydantic.Field(\n        DiscriminatorArchiConfig(), discriminator=\"name\"\n    )\n\n\nclass FBcprModelConfig(FBModelConfig):\n    name: tp.Literal[\"FBcprModel\"] = \"FBcprModel\"\n    archi: FBcprModelArchiConfig = FBcprModelArchiConfig()\n\n    @property\n    def object_class(self):\n        return FBcprModel\n\n\nclass FBcprModel(FBModel):\n    config_class = FBcprModelConfig\n\n    def __init__(self, obs_space, action_dim, cfg: FBcprModelConfig):\n        super().__init__(obs_space, action_dim, cfg)\n        # For IDEs\n        self.cfg: FBcprModelConfig = cfg\n        self._discriminator = cfg.archi.discriminator.build(obs_space, cfg.archi.z_dim)\n        self._critic = cfg.archi.critic.build(obs_space, cfg.archi.z_dim, action_dim, output_dim=1)\n\n        # make sure the model is in eval mode and never computes gradients\n        self.train(False)\n        self.requires_grad_(False)\n        self.to(self.device)\n\n    def _prepare_for_train(self) -> None:\n        super()._prepare_for_train()\n        self._target_critic = copy.deepcopy(self._critic)\n\n    @torch.no_grad()\n    def critic(self, obs: torch.Tensor | dict[str, torch.Tensor], z: torch.Tensor, action: torch.Tensor):\n        with autocast(device_type=self.device, dtype=self.amp_dtype, enabled=self.cfg.amp):\n            return self._critic(self._normalize(obs), z, action)\n\n    @torch.no_grad()\n    def discriminator(self, obs: torch.Tensor | dict[str, torch.Tensor], z: torch.Tensor):\n        with autocast(device_type=self.device, dtype=self.amp_dtype, enabled=self.cfg.amp):\n            return self._discriminator(self._normalize(obs), z)\n", "humanoidverse/agents/fb_cpr_aux/agent.py": "# Copyright (c) Meta Platforms, Inc. and affiliates.\n#\n# This source code is licensed under the CC BY-NC 4.0 license found in the\n# LICENSE file in the root directory of this source tree.\n\nimport typing as tp\nfrom typing import Dict\n\nimport pydantic\nimport torch\nimport torch.nn.functional as F\nfrom torch.amp import autocast\nfrom torch.utils._pytree import tree_map\n\nfrom ..base import BaseConfig\nfrom ..fb_cpr.agent import FBcprAgent, FBcprAgentTrainConfig\nfrom ..nn_models import _soft_update_params, eval_mode\nfrom .model import FBcprAuxModelConfig\n\n\nclass FBcprAuxAgentTrainConfig(FBcprAgentTrainConfig):\n    lr_aux_critic: float = 1e-4\n    reg_coeff_aux: float = 1.0\n    aux_critic_pessimism_penalty: float = 0.5\n\n\nclass FBcprAuxAgentConfig(BaseConfig):\n    name: tp.Literal[\"FBcprAuxAgent\"] = \"FBcprAuxAgent\"\n\n    model: FBcprAuxModelConfig = FBcprAuxModelConfig()\n    train: FBcprAuxAgentTrainConfig = FBcprAuxAgentTrainConfig()\n    aux_rewards: list[str] = pydantic.Field(default_factory=list)\n    aux_rewards_scaling: dict[str, float] = pydantic.Field(default_factory=dict)\n    cudagraphs: bool = False\n    compile: bool = False\n\n    def build(self, obs_space, action_dim: int) -> \"FBcprAuxAgent\":\n        return self.object_class(\n            obs_space=obs_space,\n            action_dim=action_dim,\n            cfg=self,\n        )\n\n    @property\n    def object_class(self):\n        return FBcprAuxAgent\n\n\nclass FBcprAuxAgent(FBcprAgent):\n    config_class = FBcprAuxAgentConfig\n\n    def setup_training(self) -> None:\n        super().setup_training()\n\n        # prepare parameter list\n        self._aux_critic_map_paramlist = tuple(x for x in self._model._aux_critic.parameters())\n        self._aux_target_critic_map_paramlist = tuple(x for x in self._model._target_aux_critic.parameters())\n\n        self.aux_critic_optimizer = torch.optim.Adam(\n            self._model._aux_critic.parameters(),\n            lr=self.cfg.train.lr_aux_critic,\n            capturable=self.cfg.cudagraphs and not self.cfg.compile,\n            weight_decay=self.cfg.train.weight_decay,\n        )\n\n    @property\n    def optimizer_dict(self):\n        optimizers = super().optimizer_dict\n        optimizers[\"aux_critic_optimizer\"] = self.aux_critic_optimizer.state_dict()\n        return optimizers\n\n    def setup_compile(self):\n        super().setup_compile()\n        if self.cfg.compile:\n            mode = \"reduce-overhead\" if not self.cfg.cudagraphs else None\n            self.update_aux_critic = torch.compile(self.update_aux_critic, mode=mode)\n\n        if self.cfg.cudagraphs:\n            from tensordict.nn import CudaGraphModule\n\n            self.update_aux_critic = CudaGraphModule(self.update_aux_critic, warmup=5)\n\n    def update(self, replay_buffer, step: int) -> Dict[str, torch.Tensor]:\n        expert_batch = replay_buffer[\"expert_slicer\"].sample(self.cfg.train.batch_size)\n        train_batch = replay_buffer[\"train\"].sample(self.cfg.train.batch_size)\n\n        train_obs, train_action, train_next_obs = (\n            tree_map(lambda x: x.to(self.device), train_batch[\"observation\"]),\n            train_batch[\"action\"].to(self.device),\n            tree_map(lambda x: x.to(self.device), train_batch[\"next\"][\"observation\"]),\n        )\n        discount = self.cfg.train.discount * ~train_batch[\"next\"][\"terminated\"].to(self.device)\n        expert_obs, expert_next_obs = (\n            tree_map(lambda x: x.to(self.device), expert_batch[\"observation\"]),\n            tree_map(lambda x: x.to(self.device), expert_batch[\"next\"][\"observation\"]),\n        )\n\n        self._model._obs_normalizer(train_obs)\n        self._model._obs_normalizer(train_next_obs)\n\n        with torch.no_grad(), eval_mode(self._model._obs_normalizer):\n            train_obs, train_next_obs = (\n                self._model._obs_normalizer(train_obs),\n                self._model._obs_normalizer(train_next_obs),\n            )\n            expert_obs, expert_next_obs = (\n                self._model._obs_normalizer(expert_obs),\n                self._model._obs_normalizer(expert_next_obs),\n            )\n\n        torch.compiler.cudagraph_mark_step_begin()\n        expert_z = self.encode_expert(next_obs=expert_next_obs)\n        train_z = train_batch[\"z\"].to(self.device)\n\n        # train the discriminator\n        grad_penalty = self.cfg.train.grad_penalty_discriminator if self.cfg.train.grad_penalty_discriminator > 0 else None\n        metrics = self.update_discriminator(\n            expert_obs=expert_obs,\n            expert_z=expert_z,\n            train_obs=train_obs,\n            train_z=train_z,\n            grad_penalty=grad_penalty,\n        )\n\n        z = self.sample_mixed_z(train_goal=train_next_obs, expert_encodings=expert_z).clone()\n        self.z_buffer.add(z)\n\n        if self.cfg.train.relabel_ratio is not None:\n            mask = torch.rand((self.cfg.train.batch_size, 1), device=self.device) \u003c= self.cfg.train.relabel_ratio\n            train_z = torch.where(mask, z, train_z)\n\n        q_loss_coef = self.cfg.train.q_loss_coef if self.cfg.train.q_loss_coef > 0 else None\n        clip_grad_norm = self.cfg.train.clip_grad_norm if self.cfg.train.clip_grad_norm > 0 else None\n\n        metrics.update(\n            self.update_fb(\n                obs=train_obs,\n                action=train_action,\n                discount=discount,\n                next_obs=train_next_obs,\n                goal=train_next_obs,\n                z=train_z,\n                q_loss_coef=q_loss_coef,\n                clip_grad_norm=clip_grad_norm,\n            )\n        )\n        metrics.update(\n            self.update_critic(\n                obs=train_obs,\n                action=train_action,\n                discount=discount,\n                next_obs=train_next_obs,\n                z=train_z,\n            )\n        )\n        # compute scalar auxiliary reward as a weighted sum of the auxiliary rewards\n        aux_reward = torch.zeros(\n            (self.cfg.train.batch_size, 1),\n            device=self.device,\n            dtype=torch.float32,\n        )\n        for aux_reward_name in self.cfg.aux_rewards:\n            # let's log even this information\n            metrics[f\"aux_rew/{aux_reward_name}\"] = train_batch[\"aux_rewards\"][aux_reward_name].mean()\n            aux_reward += self.cfg.aux_rewards_scaling[aux_reward_name] * train_batch[\"aux_rewards\"][aux_reward_name].to(self.device)\n\n        aux_reward = self._model._aux_reward_normalizer(aux_reward)\n\n        metrics.update(\n            self.update_aux_critic(\n                obs=train_obs,\n                action=train_action,\n                discount=discount,\n                aux_reward=aux_reward,\n                next_obs=train_next_obs,\n                z=train_z,\n            )\n        )\n        metrics.update(\n            self.update_actor(\n                obs=train_obs,\n                action=train_action,\n                z=train_z,\n                clip_grad_norm=clip_grad_norm,\n            )\n        )\n\n        with torch.no_grad():\n            _soft_update_params(\n                self._forward_map_paramlist,\n                self._target_forward_map_paramlist,\n                self.cfg.train.fb_target_tau,\n            )\n            _soft_update_params(\n                self._backward_map_paramlist,\n                self._target_backward_map_paramlist,\n                self.cfg.train.fb_target_tau,\n            )\n            _soft_update_params(\n                self._critic_map_paramlist,\n                self._target_critic_map_paramlist,\n                self.cfg.train.critic_target_tau,\n            )\n            _soft_update_params(\n                self._aux_critic_map_paramlist,\n                self._aux_target_critic_map_paramlist,\n                self.cfg.train.critic_target_tau,\n            )\n\n        return metrics\n\n    def update_aux_critic(\n        self,\n        obs: torch.Tensor | dict[str, torch.Tensor],\n        action: torch.Tensor,\n        discount: torch.Tensor,\n        aux_reward: torch.Tensor,\n        next_obs: torch.Tensor | dict[str, torch.Tensor],\n        z: torch.Tensor,\n    ) -> Dict[str, torch.Tensor]:\n        with autocast(device_type=self.device, dtype=self._model.amp_dtype, enabled=self.cfg.model.amp):\n            num_parallel = self.cfg.model.archi.aux_critic.num_parallel\n            # compute target critic\n            with torch.no_grad():\n                dist = self._model._actor(next_obs, z, self._model.cfg.actor_std)\n                next_action = dist.sample(clip=self.cfg.train.stddev_clip)\n                next_Qs = self._model._target_aux_critic(next_obs, z, next_action)  # num_parallel x batch x 1\n                Q_mean, Q_unc, next_V = self.get_targets_uncertainty(next_Qs, self.cfg.train.aux_critic_pessimism_penalty)\n                target_Q = aux_reward + discount * next_V\n                expanded_targets = target_Q.expand(num_parallel, -1, -1)\n\n            # compute critic loss\n            Qs = self._model._aux_critic(obs, z, action)  # num_parallel x batch x (1 or n_bins)\n            aux_critic_loss = 0.5 * num_parallel * F.mse_loss(Qs, expanded_targets)\n\n        # optimize critic\n        self.aux_critic_optimizer.zero_grad(set_to_none=True)\n        aux_critic_loss.backward()\n        self.aux_critic_optimizer.step()\n\n        with torch.no_grad():\n            output_metrics = {\n                \"target_auxQ\": target_Q.mean().detach(),\n                \"auxQ1\": Qs.mean().detach(),\n                \"mean_next_auxQ\": Q_mean.mean().detach(),\n                \"unc_auxQ\": Q_unc.mean().detach(),\n                \"aux_critic_loss\": aux_critic_loss.mean().detach(),\n                \"mean_aux_reward\": aux_reward.mean().detach(),\n            }\n        return output_metrics\n\n    def update_actor(\n        self,\n        obs: torch.Tensor | dict[str, torch.Tensor],\n        action: torch.Tensor,\n        z: torch.Tensor,\n        clip_grad_norm: float | None,\n    ) -> Dict[str, torch.Tensor]:\n        with autocast(device_type=self.device, dtype=self._model.amp_dtype, enabled=self.cfg.model.amp):\n            dist = self._model._actor(obs, z, self._model.cfg.actor_std)\n            action = dist.sample(clip=self.cfg.train.stddev_clip)\n\n            # compute discriminator reward loss\n            Qs_discriminator = self._model._critic(obs, z, action)  # num_parallel x batch x (1 or n_bins)\n            _, _, Q_discriminator = self.get_targets_uncertainty(Qs_discriminator, self.cfg.train.actor_pessimism_penalty)  # batch\n\n            # compute auxiliary reward loss\n            Qs_aux = self._model._aux_critic(obs, z, action)  # num_parallel x batch x (1 or n_bins)\n            _, _, Q_aux = self.get_targets_uncertainty(Qs_aux, self.cfg.train.actor_pessimism_penalty)  # batch\n\n            # compute fb reward loss\n            Fs = self._model._forward_map(obs, z, action)  # num_parallel x batch x z_dim\n            Qs_fb = (Fs * z).sum(-1)  # num_parallel x batch\n            _, _, Q_fb = self.get_targets_uncertainty(Qs_fb, self.cfg.train.actor_pessimism_penalty)  # batch\n\n            weight = Q_fb.abs().mean().detach() if self.cfg.train.scale_reg else 1.0\n            actor_loss = (\n                -Q_discriminator.mean() * self.cfg.train.reg_coeff * weight\n                - Q_aux.mean() * self.cfg.train.reg_coeff_aux * weight\n                - Q_fb.mean()\n            )\n\n        # optimize actor\n        self.actor_optimizer.zero_grad(set_to_none=True)\n        actor_loss.backward()\n        if clip_grad_norm is not None:\n            torch.nn.utils.clip_grad_norm_(self._model._actor.parameters(), clip_grad_norm)\n        self.actor_optimizer.step()\n\n        with torch.no_grad():\n            output_metrics = {\n                \"actor_loss\": actor_loss.detach(),\n                \"Q_discriminator\": Q_discriminator.mean().detach(),\n                \"Q_aux\": Q_aux.mean().detach(),\n                \"Q_fb\": Q_fb.mean().detach(),\n            }\n        return output_metrics\n", "humanoidverse/agents/fb_cpr_aux/model.py": "# Copyright (c) Meta Platforms, Inc. and affiliates.\n#\n# This source code is licensed under the CC BY-NC 4.0 license found in the\n# LICENSE file in the root directory of this source tree.\n\nimport copy\nimport typing as tp\n\nimport torch\nfrom torch.amp import autocast\n\nfrom ..fb_cpr.model import FBcprModel, FBcprModelArchiConfig, FBcprModelConfig\nfrom ..nn_models import ForwardArchiConfig, RewardNormalizerConfig\n\n\nclass FBcprAuxModelArchiConfig(FBcprModelArchiConfig):\n    aux_critic: ForwardArchiConfig = ForwardArchiConfig()\n\n\nclass FBcprAuxModelConfig(FBcprModelConfig):\n    name: tp.Literal[\"FBcprAuxModel\"] = \"FBcprAuxModel\"\n    aux_critic_config_version: tp.Literal[1] = 1\n    archi: FBcprAuxModelArchiConfig = FBcprAuxModelArchiConfig()\n    norm_aux_reward: RewardNormalizerConfig = RewardNormalizerConfig()\n\n    @property\n    def object_class(self):\n        return FBcprAuxModel\n\n\nclass FBcprAuxModel(FBcprModel):\n    config_class = FBcprAuxModelConfig\n\n    def __init__(self, obs_space, action_dim: int, cfg: FBcprAuxModelConfig):\n        # NOTE for future: if we inherit models, we need to make sure that the cfg we pass in (which is wrong)\n        #      can still be used to build the underlying models\n        super().__init__(obs_space, action_dim, cfg)\n        self.cfg = cfg\n        self._aux_critic = cfg.archi.aux_critic.build(obs_space, cfg.archi.z_dim, action_dim, output_dim=1)\n        self._aux_reward_normalizer = cfg.norm_aux_reward.build()\n\n        # make sure the model is in eval mode and never computes gradients\n        self.train(False)\n        self.requires_grad_(False)\n        self.to(self.cfg.device)\n\n    def _prepare_for_train(self) -> None:\n        super()._prepare_for_train()\n        self._target_aux_critic = copy.deepcopy(self._aux_critic)\n\n    @torch.no_grad()\n    def aux_critic(self, obs: torch.Tensor | dict[str, torch.Tensor], z: torch.Tensor, action: torch.Tensor):\n        with autocast(device_type=self.device, dtype=self.amp_dtype, enabled=self.cfg.amp):\n            return self._aux_critic(self._normalize(obs), z, action)\n", "humanoidverse/agents/nn_models.py": "# Copyright (c) Meta Platforms, Inc. and affiliates.\n#\n# This source code is licensed under the CC BY-NC 4.0 license found in the\n# LICENSE file in the root directory of this source tree.\n\nimport math\nimport numbers\nimport typing as tp\n\nimport gymnasium\nimport numpy as np\nimport torch\nimport torch.nn.functional as F\nfrom torch import distributions as pyd\nfrom torch import nn\nfrom torch.distributions.utils import _standard_normal\n\nfrom .base import BaseConfig\nfrom .nn_filters import IdentityInputFilterConfig, NNFilter\n\n##########################\n# Initialization utils\n##########################\n\n\n# Initialization for parallel layers\ndef parallel_orthogonal_(tensor, gain=1):\n    if tensor.ndimension() == 2:\n        tensor = nn.init.orthogonal_(tensor, gain=gain)\n        return tensor\n    if tensor.ndimension() \u003c 3:\n        raise ValueError(\"Only tensors with 3 or more dimensions are supported\")\n    n_parallel = tensor.size(0)\n    rows = tensor.size(1)\n    cols = tensor.numel() // n_parallel // rows\n    flattened = tensor.new(n_parallel, rows, cols).normal_(0, 1)\n\n    qs = []\n    for flat_tensor in torch.unbind(flattened, dim=0):\n        if rows \u003c cols:\n            flat_tensor.t_()\n\n        # Compute the qr factorization\n        q, r = torch.linalg.qr(flat_tensor)\n        # Make Q uniform according to https://arxiv.org/pdf/math-ph/0609050.pdf\n        d = torch.diag(r, 0)\n        ph = d.sign()\n        q *= ph\n\n        if rows \u003c cols:\n            q.t_()\n        qs.append(q)\n\n    qs = torch.stack(qs, dim=0)\n    with torch.no_grad():\n        tensor.view_as(qs).copy_(qs)\n        tensor.mul_(gain)\n    return tensor\n\n\ndef weight_init(m):\n    if isinstance(m, nn.Linear):\n        nn.init.orthogonal_(m.weight.data)\n        if hasattr(m.bias, \"data\"):\n            m.bias.data.fill_(0.0)\n    elif isinstance(m, DenseParallel):\n        gain = nn.init.calculate_gain(\"relu\")\n        parallel_orthogonal_(m.weight.data, gain)\n        if hasattr(m.bias, \"data\"):\n            m.bias.data.fill_(0.0)\n    elif hasattr(m, \"reset_parameters\"):\n        m.reset_parameters()\n\n\n##########################\n# Update utils\n##########################\n\n\ndef _soft_update_params(net_params: tp.Any, target_net_params: tp.Any, tau: float):\n    torch._foreach_mul_(target_net_params, 1 - tau)\n    torch._foreach_add_(target_net_params, net_params, alpha=tau)\n\n\ndef soft_update_params(net, target_net, tau) -> None:\n    tau = float(min(max(tau, 0), 1))\n    net_params = tuple(x.data for x in net.parameters())\n    target_net_params = tuple(x.data for x in target_net.parameters())\n    _soft_update_params(net_params, target_net_params, tau)\n\n\nclass eval_mode:\n    def __init__(self, *models) -> None:\n        self.models = models\n        self.prev_states = []\n\n    def __enter__(self) -> None:\n        self.prev_states = []\n        for model in self.models:\n            self.prev_states.append(model.training)\n            model.train(False)\n\n    def __exit__(self, *args) -> None:\n        for model, state in zip(self.models, self.prev_states):\n            model.train(state)\n\n\n##########################\n# Creation utils\n##########################\n\n\nclass ForwardArchiConfig(BaseConfig):\n    name: tp.Literal[\"ForwardArchi\"] = \"ForwardArchi\"\n    hidden_dim: int = 1024\n    model: tp.Literal[\"simple\", \"residual\"] = \"simple\"  # {'simple', 'residual'}\n    hidden_layers: int = 1\n    embedding_layers: int = 2\n    num_parallel: int = 2\n    ensemble_mode: tp.Literal[\"batch\", \"seq\", \"vmap\"] = \"batch\"  # {'batch', 'seq', 'vmap'}\n    input_filter: NNFilter = IdentityInputFilterConfig()\n\n    def model_post_init(self, context):\n        if self.num_parallel > 1 and self.ensemble_mode == \"seq\":\n            raise ValueError(\"seq ensemble mode is not compatible with num_parallel > 1. Use 'batch' or 'vmap' instead.\")\n\n    def build(self, obs_space, z_dim: int, action_dim, output_dim=None) -> torch.nn.Module:\n        \"\"\"Note: Forward model is also used for critics\"\"\"\n        if self.ensemble_mode == \"seq\":\n            return SequetialFMap(obs_space, z_dim, action_dim, self)\n        elif self.ensemble_mode == \"vmap\":\n            raise NotImplementedError(\"vmap ensemble mode is currently not supported\")\n\n        assert self.ensemble_mode == \"batch\", \"Invalid value for ensemble_mode. Use {'batch', 'seq', 'vmap'}\"\n        return _build_batch_forward(self, obs_space, z_dim, action_dim, output_dim)\n\n\ndef _build_batch_forward(cfg, obs_space, z_dim, action_dim, output_dim=None):\n    if cfg.model == \"residual\":\n        forward_cls = ResidualForwardMap\n    elif cfg.model == \"simple\":\n        forward_cls = ForwardMap\n    else:\n        raise ValueError(f\"Unsupported forward_map model {cfg.model}\")\n    return forward_cls(obs_space, z_dim, action_dim, cfg, output_dim=output_dim)\n\n\nclass ActorArchiConfig(BaseConfig):\n    name: tp.Literal[\"actor\"] = \"actor\"\n    model: tp.Literal[\"simple\", \"residual\"] = \"simple\"\n    hidden_dim: int = 1024\n    hidden_layers: int = 1\n    embedding_layers: int = 2\n    input_filter: NNFilter = IdentityInputFilterConfig()\n\n    def build(self, obs_space, z_dim, action_dim):\n        if self.model == \"residual\":\n            return ResidualActor(obs_space, z_dim, action_dim, self)\n        elif self.model == \"simple\":\n            return Actor(obs_space, z_dim, action_dim, self)\n        else:\n            raise ValueError(f\"Unsupported actor model {self.model}. Define 'model' or use other configs explicitely\")\n\n\nclass DiscriminatorArchiConfig(BaseConfig):\n    name: tp.Literal[\"DiscriminatorArchi\"] = \"DiscriminatorArchi\"\n    hidden_dim: int = 1024\n    hidden_layers: int = 2\n    input_filter: NNFilter = IdentityInputFilterConfig()\n\n    def build(self, obs_space, z_dim) -> \"Discriminator\":\n        return Discriminator(obs_space, z_dim, self)\n\n\ndef linear(input_dim, output_dim, num_parallel=1):\n    if num_parallel > 1:\n        return DenseParallel(input_dim, output_dim, n_parallel=num_parallel)\n    return nn.Linear(input_dim, output_dim)\n\n\ndef layernorm(input_dim, num_parallel=1):\n    if num_parallel > 1:\n        return ParallelLayerNorm([input_dim], n_parallel=num_parallel)\n    return nn.LayerNorm(input_dim)\n\n\n##########################\n# Simple MLP models\n##########################\n\n\nclass BackwardArchiConfig(BaseConfig):\n    name: tp.Literal[\"BackwardArchi\"] = \"BackwardArchi\"\n    hidden_dim: int = 256\n    hidden_layers: int = 2\n    norm: bool = True\n    input_filter: NNFilter = IdentityInputFilterConfig()\n\n    def build(self, obs_space, z_dim: int):\n        return BackwardMap(obs_space, z_dim, self)\n\n\nclass BackwardMap(nn.Module):\n    def __init__(self, obs_space, z_dim, cfg: BackwardArchiConfig) -> None:\n        super().__init__()\n        self.cfg: BackwardArchiConfig = cfg\n\n        self.input_filter = cfg.input_filter.build(obs_space)\n        filtered_space = self.input_filter.output_space\n\n        assert isinstance(filtered_space, gymnasium.spaces.Box), (\n            f\"filtered_space must be a Box space, got {type(filtered_space)}. Did you forget to set input_filter?\"\n        )\n        assert len(filtered_space.shape) == 1, \"filtered_space must have a 1D shape\"\n        seq = [nn.Linear(filtered_space.shape[0], cfg.hidden_dim), nn.LayerNorm(cfg.hidden_dim), nn.Tanh()]\n        for _ in range(cfg.hidden_layers - 1):\n            seq += [nn.Linear(cfg.hidden_dim, cfg.hidden_dim), nn.ReLU()]\n        seq += [nn.Linear(cfg.hidden_dim, z_dim)]\n        if cfg.norm:\n            seq += [Norm()]\n        self.net = nn.Sequential(*seq)\n\n    def forward(self, x: torch.Tensor | dict[str, torch.Tensor]) -> torch.Tensor:\n        x = self.input_filter(x)\n        return self.net(x)\n\n\ndef simple_embedding(input_dim, hidden_dim, hidden_layers, num_parallel=1):\n    assert hidden_layers >= 2, \"must have at least 2 embedding layers\"\n    seq = [linear(input_dim, hidden_dim, num_parallel), layernorm(hidden_dim, num_parallel), nn.Tanh()]\n    for _ in range(hidden_layers - 2):\n        seq += [linear(hidden_dim, hidden_dim, num_parallel), nn.ReLU()]\n    seq += [linear(hidden_dim, hidden_dim // 2, num_parallel), nn.ReLU()]\n    return nn.Sequential(*seq)\n\n\nclass ForwardMap(nn.Module):\n    def __init__(\n        self,\n        obs_space,\n        z_dim,\n        action_dim,\n        cfg: ForwardArchiConfig,\n        output_dim=None,\n    ) -> None:\n        super().__init__()\n\n        self.input_filter = cfg.input_filter.build(obs_space)\n        filtered_space = self.input_filter.output_space\n\n        assert isinstance(filtered_space, gymnasium.spaces.Box), (\n            f\"filtered_space must be a Box space, got {type(filtered_space)}. Did you forget to set input_filter?\"\n        )\n        assert len(filtered_space.shape) == 1, \"filtered_space must have a 1D shape\"\n        obs_dim = filtered_space.shape[0]\n        self.cfg = cfg\n        self.z_dim = z_dim\n        self.num_parallel = cfg.num_parallel\n        self.hidden_dim = cfg.hidden_dim\n\n        self.embed_z = simple_embedding(obs_dim + z_dim, cfg.hidden_dim, cfg.embedding_layers, cfg.num_parallel)\n        self.embed_sa = simple_embedding(obs_dim + action_dim, cfg.hidden_dim, cfg.embedding_layers, cfg.num_parallel)\n\n        seq = []\n        for _ in range(cfg.hidden_layers):\n            seq += [linear(cfg.hidden_dim, cfg.hidden_dim, cfg.num_parallel), nn.ReLU()]\n        seq += [linear(cfg.hidden_dim, output_dim if output_dim else z_dim, cfg.num_parallel)]\n        self.Fs = nn.Sequential(*seq)\n\n    def forward(self, obs: torch.Tensor | dict[str, torch.Tensor], z: torch.Tensor, action: torch.Tensor):\n        obs = self.input_filter(obs)\n        if self.num_parallel > 1:\n            obs = obs.expand(self.num_parallel, -1, -1)\n            z = z.expand(self.num_parallel, -1, -1)\n            action = action.expand(self.num_parallel, -1, -1)\n        z_embedding = self.embed_z(torch.cat([obs, z], dim=-1))  # num_parallel x bs x h_dim // 2\n        sa_embedding = self.embed_sa(torch.cat([obs, action], dim=-1))  # num_parallel x bs x h_dim // 2\n        return self.Fs(torch.cat([sa_embedding, z_embedding], dim=-1))\n\n\nclass SequetialFMap(nn.Module):\n    def __init__(self, obs_space, z_dim, action_dim, cfg, output_dim=None):\n        super().__init__()\n        assert len(obs_space.shape) == 1, \"obs_space must have a 1D shape\"\n        obs_dim = obs_space.shape[0]\n        self.models = nn.ModuleList(\n            [_build_batch_forward(cfg, obs_dim, z_dim, action_dim, cfg, output_dim, parallel=False) for _ in range(cfg.num_parallel)]\n        )\n\n    def forward(self, obs: torch.Tensor | dict[str, torch.Tensor], z: torch.Tensor, action: torch.Tensor) -> torch.Tensor:\n        predictions = [model(obs, z, action) for model in self.models]\n        return torch.stack(predictions)\n\n\nclass SimpleActorArchiConfig(ActorArchiConfig):\n    name: tp.Literal[\"simple\"] = \"simple\"\n    model: tp.Literal[\"simple\"] = \"simple\"\n\n    def build(self, obs_space, z_dim: int, action_dim: int) -> \"Actor\":\n        return Actor(obs_space, z_dim, action_dim, self)\n\n\nclass Actor(nn.Module):\n    def __init__(self, obs_space, z_dim, action_dim, cfg: SimpleActorArchiConfig) -> None:\n        super().__init__()\n\n        self.input_filter = cfg.input_filter.build(obs_space)\n        filtered_space = self.input_filter.output_space\n\n        assert isinstance(filtered_space, gymnasium.spaces.Box), (\n            f\"filtered_space must be a Box space, got {type(filtered_space)}. Did you forget to set input_filter?\"\n        )\n        assert len(filtered_space.shape) == 1, \"filtered_space must have a 1D shape\"\n        obs_dim = filtered_space.shape[0]\n        self.cfg: SimpleActorArchiConfig = cfg\n        self.embed_z = simple_embedding(obs_dim + z_dim, cfg.hidden_dim, cfg.embedding_layers)\n        self.embed_s = simple_embedding(obs_dim, cfg.hidden_dim, cfg.embedding_layers)\n\n        seq = []\n        for _ in range(cfg.hidden_layers):\n            seq += [linear(cfg.hidden_dim, cfg.hidden_dim), nn.ReLU()]\n        seq += [linear(cfg.hidden_dim, action_dim)]\n        self.policy = nn.Sequential(*seq)\n\n    def forward(self, obs: torch.Tensor | dict[str, torch.Tensor], z, std):\n        obs = self.input_filter(obs)\n        z_embedding = self.embed_z(torch.cat([obs, z], dim=-1))  # bs x h_dim // 2\n        s_embedding = self.embed_s(obs)  # bs x h_dim // 2\n        embedding = torch.cat([s_embedding, z_embedding], dim=-1)\n        mu = torch.tanh(self.policy(embedding))\n        std = torch.ones_like(mu) * std\n        dist = TruncatedNormal(mu, std)\n        return dist\n\n\nclass Discriminator(nn.Module):\n    def __init__(self, obs_space, z_dim, cfg: DiscriminatorArchiConfig) -> None:\n        super().__init__()\n        self.cfg = cfg\n\n        self.input_filter = cfg.input_filter.build(obs_space)\n        filtered_space = self.input_filter.output_space\n\n        assert isinstance(filtered_space, gymnasium.spaces.Box), (\n            f\"filtered_space must be a Box space, got {type(filtered_space)}. Did you forget to set input_filter?\"\n        )\n        assert len(filtered_space.shape) == 1, \"filtered_space must have a 1D shape\"\n        obs_dim = filtered_space.shape[0]\n        seq = [nn.Linear(obs_dim + z_dim, cfg.hidden_dim), nn.LayerNorm(cfg.hidden_dim), nn.Tanh()]\n        for _ in range(cfg.hidden_layers - 1):\n            seq += [nn.Linear(cfg.hidden_dim, cfg.hidden_dim), nn.ReLU()]\n        seq += [nn.Linear(cfg.hidden_dim, 1)]\n        self.trunk = nn.Sequential(*seq)\n\n    def forward(self, obs: torch.Tensor | dict[str, torch.Tensor], z: torch.Tensor) -> torch.Tensor:\n        s = self.compute_logits(obs, z)\n        return torch.sigmoid(s)\n\n    def compute_logits(self, obs: torch.Tensor | dict[str, torch.Tensor], z: torch.Tensor) -> torch.Tensor:\n        obs = self.input_filter(obs)\n        x = torch.cat([z, obs], dim=1)\n        logits = self.trunk(x)\n        return logits\n\n    def compute_reward(self, obs: torch.Tensor | dict[str, torch.Tensor], z: torch.Tensor, eps: float = 1e-7) -> torch.Tensor:\n        s = self.forward(obs, z)\n        s = torch.clamp(s, eps, 1 - eps)\n        reward = s.log() - (1 - s).log()\n        return reward\n\n\nclass VForwardArchiConfig(BaseConfig):\n    hidden_dim: int = 1024\n    hidden_layers: int = 1\n    embedding_layers: int = 2\n    num_parallel: int = 2\n    input_filter: NNFilter = IdentityInputFilterConfig()\n\n    def build(self, obs_space, z_dim: int, output_dim=None) -> torch.nn.Module:\n        return VForwardMap(obs_space, z_dim, output_dim, self)\n\n\nclass VForwardMap(nn.Module):\n    def __init__(\n        self,\n        obs_space,\n        z_dim,\n        output_dim=None,\n        cfg: VForwardArchiConfig = VForwardArchiConfig(),\n    ) -> None:\n        super().__init__()\n\n        self.input_filter = cfg.input_filter.build(obs_space)\n        filtered_space = self.input_filter.output_space\n\n        assert isinstance(filtered_space, gymnasium.spaces.Box), (\n            f\"filtered_space must be a Box space, got {type(filtered_space)}. Did you forget to set input_filter?\"\n        )\n        assert len(filtered_space.shape) == 1, \"filtered_space must have a 1D shape\"\n        obs_dim = filtered_space.shape[0]\n        self.z_dim = z_dim\n        self.num_parallel = cfg.num_parallel\n        self.hidden_dim = cfg.hidden_dim\n\n        self.embed_z = simple_embedding(obs_dim + z_dim, cfg.hidden_dim, cfg.embedding_layers, cfg.num_parallel)\n        self.embed_s = simple_embedding(obs_dim, cfg.hidden_dim, cfg.embedding_layers, cfg.num_parallel)\n\n        seq = []\n        for _ in range(cfg.hidden_layers):\n            seq += [linear(cfg.hidden_dim, cfg.hidden_dim, cfg.num_parallel), nn.ReLU()]\n        seq += [linear(cfg.hidden_dim, output_dim if output_dim else z_dim, cfg.num_parallel)]\n        self.Fs = nn.Sequential(*seq)\n\n    def forward(self, obs: torch.Tensor | dict[str, torch.Tensor], z: torch.Tensor) -> torch.Tensor:\n        obs = self.input_filter(obs)\n        if self.num_parallel > 1:\n            obs = obs.expand(self.num_parallel, -1, -1)\n            z = z.expand(self.num_parallel, -1, -1)\n        z_embedding = self.embed_z(torch.cat([obs, z], dim=-1))  # num_parallel x bs x h_dim // 2\n        s_embedding = self.embed_s(obs)  # num_parallel x bs x h_dim // 2\n        return self.Fs(torch.cat([s_embedding, z_embedding], dim=-1))\n\n\n##########################\n# Residual models\n##########################\n\n\nclass ResidualBlock(nn.Module):\n    def __init__(self, dim, num_parallel: int = 1):\n        super().__init__()\n        ln = layernorm(dim, num_parallel)\n        lin = linear(dim, dim, num_parallel)\n        self.mlp = nn.Sequential(ln, lin, nn.Mish())\n\n    def forward(self, x):\n        return x + self.mlp(x)\n\n\nclass Block(nn.Module):\n    def __init__(self, input_dim, output_dim, activation, num_parallel: int = 1):\n        super().__init__()\n        ln = layernorm(input_dim, num_parallel)\n        lin = linear(input_dim, output_dim, num_parallel)\n        seq = [ln, lin] + ([nn.Mish()] if activation else [])\n        self.mlp = nn.Sequential(*seq)\n\n    def forward(self, x):\n        return self.mlp(x)\n\n\ndef residual_embedding(input_dim, hidden_dim, hidden_layers, num_parallel=1):\n    assert hidden_layers >= 2, \"must have at least 2 embedding layers\"\n    seq = [Block(input_dim, hidden_dim, True, num_parallel)]\n    for _ in range(hidden_layers - 2):\n        seq += [ResidualBlock(hidden_dim, num_parallel)]\n    seq += [Block(hidden_dim, hidden_dim // 2, True, num_parallel)]\n    return nn.Sequential(*seq)\n\n\nclass ResidualForwardMap(nn.Module):\n    def __init__(\n        self,\n        obs_space,\n        z_dim,\n        action_dim,\n        cfg: ForwardArchiConfig,\n        output_dim=None,\n    ) -> None:\n        super().__init__()\n\n        self.input_filter = cfg.input_filter.build(obs_space)\n        filtered_space = self.input_filter.output_space\n\n        assert isinstance(filtered_space, gymnasium.spaces.Box), (\n            f\"filtered_space must be a Box space, got {type(filtered_space)}. Did you forget to set input_filter?\"\n        )\n        assert len(filtered_space.shape) == 1, \"filtered_space must have a 1D shape\"\n        obs_dim = filtered_space.shape[0]\n        self.z_dim = z_dim\n        self.num_parallel = cfg.num_parallel\n        self.hidden_dim = cfg.hidden_dim\n\n        self.embed_z = residual_embedding(obs_dim + z_dim, cfg.hidden_dim, cfg.hidden_layers, cfg.num_parallel)\n        self.embed_sa = residual_embedding(obs_dim + action_dim, cfg.hidden_dim, cfg.hidden_layers, cfg.num_parallel)\n\n        seq = [ResidualBlock(cfg.hidden_dim, cfg.num_parallel) for _ in range(cfg.hidden_layers)]\n        seq += [Block(cfg.hidden_dim, output_dim if output_dim else z_dim, False, cfg.num_parallel)]\n        self.Fs = nn.Sequential(*seq)\n\n    def forward(self, obs: torch.Tensor | dict[str, torch.Tensor], z: torch.Tensor, action: torch.Tensor) -> torch.Tensor:\n        obs = self.input_filter(obs)\n        if self.num_parallel > 1:\n            obs = obs.expand(self.num_parallel, -1, -1)\n            z = z.expand(self.num_parallel, -1, -1)\n            action = action.expand(self.num_parallel, -1, -1)\n        z_embedding = self.embed_z(torch.cat([obs, z], dim=-1))  # num_parallel x bs x h_dim // 2\n        sa_embedding = self.embed_sa(torch.cat([obs, action], dim=-1))  # num_parallel x bs x h_dim // 2\n        return self.Fs(torch.cat([sa_embedding, z_embedding], dim=-1))\n\n\nclass ResidualActorArchiConfig(ActorArchiConfig):\n    name: tp.Literal[\"residual\"] = \"residual\"\n    model: tp.Literal[\"residual\"] = \"residual\"\n\n    def build(self, obs_space, z_dim, action_dim) -> \"Actor\":\n        return ResidualActor(obs_space, z_dim, action_dim, self)\n\n\nclass ResidualActor(nn.Module):\n    def __init__(self, obs_space, z_dim, action_dim, cfg: ResidualActorArchiConfig) -> None:\n        super().__init__()\n\n        self.input_filter = cfg.input_filter.build(obs_space)\n        filtered_space = self.input_filter.output_space\n\n        assert isinstance(filtered_space, gymnasium.spaces.Box), (\n            f\"filtered_space must be a Box space, got {type(filtered_space)}. Did you forget to set input_filter?\"\n        )\n        assert len(filtered_space.shape) == 1, \"filtered_space must have a 1D shape\"\n        obs_dim = filtered_space.shape[0]\n        self.cfg: ResidualActorArchiConfig = cfg\n        self.embed_z = residual_embedding(obs_dim + z_dim, cfg.hidden_dim, cfg.embedding_layers)\n        self.embed_s = residual_embedding(obs_dim, cfg.hidden_dim, cfg.embedding_layers)\n\n        seq = [ResidualBlock(cfg.hidden_dim) for _ in range(cfg.hidden_layers)] + [Block(cfg.hidden_dim, action_dim, False)]\n        self.policy = nn.Sequential(*seq)\n\n    def forward(self, obs: torch.Tensor | dict[str, torch.Tensor], z, std):\n        obs = self.input_filter(obs)\n        z_embedding = self.embed_z(torch.cat([obs, z], dim=-1))  # bs x h_dim // 2\n        s_embedding = self.embed_s(obs)  # bs x h_dim // 2\n        embedding = torch.cat([s_embedding, z_embedding], dim=-1)\n        mu = torch.tanh(self.policy(embedding))\n        std = torch.ones_like(mu) * std\n        dist = TruncatedNormal(mu, std)\n        return dist\n\n\n##########################\n# Helper modules\n##########################\n\n\nclass DenseParallel(nn.Module):\n    def __init__(\n        self,\n        in_features: int,\n        out_features: int,\n        n_parallel: int,\n        bias: bool = True,\n        device=None,\n        dtype=None,\n        reset_params=True,\n    ) -> None:\n        factory_kwargs = {\"device\": device, \"dtype\": dtype}\n        super(DenseParallel, self).__init__()\n        self.in_features = in_features\n        self.out_features = out_features\n        self.n_parallel = n_parallel\n        if n_parallel is None or (n_parallel == 1):\n            self.weight = nn.Parameter(torch.empty((out_features, in_features), **factory_kwargs))\n            if bias:\n                self.bias = nn.Parameter(torch.empty(out_features, **factory_kwargs))\n            else:\n                self.register_parameter(\"bias\", None)\n        else:\n            self.weight = nn.Parameter(torch.empty((n_parallel, in_features, out_features), **factory_kwargs))\n            if bias:\n                self.bias = nn.Parameter(torch.empty((n_parallel, 1, out_features), **factory_kwargs))\n            else:\n                self.register_parameter(\"bias\", None)\n            if self.bias is None:\n                raise NotImplementedError\n        if reset_params:\n            self.reset_parameters()\n\n    def load_module_list_weights(self, module_list) -> None:\n        with torch.no_grad():\n            assert len(module_list) == self.n_parallel\n            weight_list = [m.weight.T for m in module_list]\n            target_weight = torch.stack(weight_list, dim=0)\n            self.weight.data.copy_(target_weight.data)\n            if self.bias:\n                bias_list = [ln.bias.unsqueeze(0) for ln in module_list]\n                target_bias = torch.stack(bias_list, dim=0)\n                self.bias.data.copy_(target_bias.data)\n\n    # TODO why do these layers have their own reset scheme?\n    def reset_parameters(self) -> None:\n        nn.init.kaiming_uniform_(self.weight, a=np.sqrt(5))\n        if self.bias is not None:\n            fan_in, _ = nn.init._calculate_fan_in_and_fan_out(self.weight)\n            bound = 1 / np.sqrt(fan_in) if fan_in > 0 else 0\n            nn.init.uniform_(self.bias, -bound, bound)\n\n    def forward(self, input):\n        if self.n_parallel is None or (self.n_parallel == 1):\n            return F.linear(input, self.weight, self.bias)\n        else:\n            return torch.baddbmm(self.bias, input, self.weight)\n\n    def extra_repr(self) -> str:\n        return \"in_features={}, out_features={}, n_parallel={}, bias={}\".format(\n            self.in_features, self.out_features, self.n_parallel, self.bias is not None\n        )\n\n\nclass ParallelLayerNorm(nn.Module):\n    def __init__(self, normalized_shape, n_parallel, eps=1e-5, elementwise_affine=True, device=None, dtype=None) -> None:\n        factory_kwargs = {\"device\": device, \"dtype\": dtype}\n        super(ParallelLayerNorm, self).__init__()\n        if isinstance(normalized_shape, numbers.Integral):\n            normalized_shape = [\n                normalized_shape,\n            ]\n        assert len(normalized_shape) == 1\n        self.n_parallel = n_parallel\n        self.normalized_shape = list(normalized_shape)\n        self.eps = eps\n        self.elementwise_affine = elementwise_affine\n        if self.elementwise_affine:\n            if n_parallel is None or (n_parallel == 1):\n                self.weight = nn.Parameter(torch.empty([*self.normalized_shape], **factory_kwargs))\n                self.bias = nn.Parameter(torch.empty([*self.normalized_shape], **factory_kwargs))\n            else:\n                self.weight = nn.Parameter(torch.empty([n_parallel, 1, *self.normalized_shape], **factory_kwargs))\n                self.bias = nn.Parameter(torch.empty([n_parallel, 1, *self.normalized_shape], **factory_kwargs))\n        else:\n            self.register_parameter(\"weight\", None)\n            self.register_parameter(\"bias\", None)\n\n        self.reset_parameters()\n\n    def reset_parameters(self) -> None:\n        if self.elementwise_affine:\n            nn.init.ones_(self.weight)\n            nn.init.zeros_(self.bias)\n\n    def load_module_list_weights(self, module_list) -> None:\n        with torch.no_grad():\n            assert len(module_list) == self.n_parallel\n            if self.elementwise_affine:\n                ln_weights = [ln.weight.unsqueeze(0) for ln in module_list]\n                ln_biases = [ln.bias.unsqueeze(0) for ln in module_list]\n                target_ln_weights = torch.stack(ln_weights, dim=0)\n                target_ln_bias = torch.stack(ln_biases, dim=0)\n                self.weight.data.copy_(target_ln_weights.data)\n                self.bias.data.copy_(target_ln_bias.data)\n\n    def forward(self, input):\n        norm_input = F.layer_norm(input, self.normalized_shape, None, None, self.eps)\n        if self.elementwise_affine:\n            return (norm_input * self.weight) + self.bias\n        else:\n            return norm_input\n\n    def extra_repr(self) -> str:\n        return \"{normalized_shape}, eps={eps}, elementwise_affine={elementwise_affine}\".format(**self.__dict__)\n\n\nclass TruncatedNormal(pyd.Normal):\n    def __init__(self, loc, scale, low=-1.0, high=1.0, eps=1e-6) -> None:\n        super().__init__(loc, scale, validate_args=False)\n        self.low = low\n        self.high = high\n        self.eps = eps\n        self.noise_upper_limit = high - self.loc\n        self.noise_lower_limit = low - self.loc\n\n    def _clamp(self, x) -> torch.Tensor:\n        clamped_x = torch.clamp(x, self.low + self.eps, self.high - self.eps)\n        x = x - x.detach() + clamped_x.detach()\n        return x\n\n    def sample(self, clip=None, sample_shape=torch.Size()) -> torch.Tensor:  # type: ignore\n        shape = self._extended_shape(sample_shape)\n        eps = _standard_normal(shape, dtype=self.loc.dtype, device=self.loc.device)\n        eps *= self.scale\n        if clip is not None:\n            eps = torch.clamp(eps, -clip, clip)\n        x = self.loc + eps\n        return self._clamp(x)\n\n\nclass Norm(nn.Module):\n    def __init__(self) -> None:\n        super().__init__()\n\n    def forward(self, x) -> torch.Tensor:\n        return math.sqrt(x.shape[-1]) * F.normalize(x, dim=-1)\n\n\nclass EMA(nn.Module):\n    \"\"\"exponential moving average\"\"\"\n\n    def __init__(self, tau=0.99, epsilon=1e-8, shape=(1,), translate=False, scale=False) -> None:\n        super().__init__()\n        self.tau = tau\n        self.epsilon = epsilon\n        self.register_buffer(\"mean\", torch.zeros(shape, dtype=torch.float32))\n        self.register_buffer(\"mean_square\", torch.zeros(shape, dtype=torch.float32))\n        self.register_buffer(\"counter\", torch.LongTensor([0]))\n        self.translate = translate\n        self.scale = scale\n\n    def forward(self, x):\n        m = x.mean()\n        sm = x.pow(2).mean()\n        self.mean.data = self.tau * self.mean + (1 - self.tau) * m\n        self.mean_square.data = self.tau * self.mean_square + (1 - self.tau) * sm\n        self.counter += 1  # type: ignore\n        norm = 1 - self.tau**self.counter\n        ema_mean = self.mean / norm\n        ema_mean_square = self.mean_square / norm\n        var = torch.clamp(ema_mean_square - ema_mean**2, min=self.epsilon)\n\n        translate_mean = ema_mean if self.translate else 0\n        scale_std = torch.sqrt(var) if self.scale else 1\n        return (x - translate_mean) / scale_std\n\n    @property\n    def S(self):\n        norm = 1 - self.tau**self.counter\n        ema_mean = self.mean / norm\n        ema_mean_square = self.mean_square / norm\n        var = torch.clamp(ema_mean_square - ema_mean**2, self.epsilon)\n        return var\n\n    @property\n    def M(self):\n        norm = 1 - self.tau**self.counter\n        ema_mean = self.mean / norm\n        return ema_mean\n\n\nclass RewardNormalizerConfig(BaseConfig):\n    name: tp.Literal[\"RewardNormalizer\"] = \"RewardNormalizer\"\n    translate: bool = False\n    scale: bool = False\n\n    def build(self) -> nn.Module:\n        return EMA(translate=self.translate, scale=self.scale)\n", "humanoidverse/agents/nn_filters.py": "import typing as tp\n\nimport gymnasium\nimport numpy as np\nimport pydantic\nimport torch\nfrom torch import nn\n\nfrom .base import BaseConfig\n\n\nclass IdentityInputFilterConfig(BaseConfig):\n    \"\"\"\n    Filter that does nothing, just returns the input as is.\n    Useful for testing or when no filtering is needed.\n    \"\"\"\n\n    def build(self, space):\n        nn_module = nn.Identity()\n        # Put output_space in the nn module for compatibility with other components\n        nn_module.output_space = space\n        return nn_module\n\n\nclass DictInputFilterConfig(BaseConfig):\n    \"\"\"\n    Filter to turn dictionary inputs into single tensors.\n\n    If key is a string, it extracts the corresponding key from the dictionary.\n    If key is a list of strings, it concatenates the values of those keys into a single tensor.\n    \"\"\"\n\n    key: str | list[str] | tuple[str, ...]\n\n    def build(self, space):\n        if isinstance(self.key, str):\n            return DictInputFilter(space, self)\n        else:\n            if len(self.key) == 1:\n                # If only one key is provided, we can use DictInputFilter\n                return DictInputFilter(space, DictInputFilterConfig(key=self.key[0]))\n            # Note: why different class for single-key case and two-key case?\n            #       Mainly pre-emptive avoidance of nesting if-clauses with isinstance checks, in case torch compiler does not like it\n            return DictInputConcatFilter(space, self)\n\n\nclass DictInputFilter(nn.Module):\n    \"\"\"\n    Simple input filter that extracts a specific key from a dictionary input space.\n\n    Allows calling the model with either a dictionary or a tensor.\n    If a tensor is passed, assume it is the desired vector.\n    \"\"\"\n\n    def __init__(self, space, cfg: DictInputFilterConfig) -> None:\n        super().__init__()\n        self.cfg = cfg\n        self.output_space = self.get_output_space(space, cfg)\n\n    @classmethod\n    def get_output_space(cls, space, cfg: DictInputFilterConfig):\n        assert isinstance(space, gymnasium.spaces.Dict), \"space must be a Dict space\"\n        assert cfg.key in space.spaces, f\"key {cfg.key} not found in space of keys {space.spaces.keys()}\"\n        return space.spaces[cfg.key]\n\n    def forward(self, _input: torch.Tensor | dict[str, torch.Tensor]):\n        if isinstance(_input, dict):\n            _input = _input[self.cfg.key]\n        # If input is already a tensor, we assume it is already filtered\n        return _input\n\n\nclass DictInputConcatFilter(nn.Module):\n    \"\"\"\n    Input filter that concatenates multiple keys from a dictionary input space.\n\n    Dev note: why not just use DictInputFilter for both? I wanted to avoid nesting if-clauses with isinstance checks, in case this breaks compilation\n    \"\"\"\n\n    def __init__(self, space, cfg: DictInputFilterConfig) -> None:\n        super().__init__()\n        self.cfg = cfg\n        self.output_space = self.get_output_space(space, cfg)\n\n    @classmethod\n    def get_output_space(cls, input_space, cfg: DictInputFilterConfig):\n        assert isinstance(input_space, gymnasium.spaces.Dict), \"input_space must be a Dict space\"\n        assert all(key in input_space.spaces for key in cfg.key), f\"keys {cfg.key} not found in obs_space {input_space.spaces.keys()}\"\n        assert all(isinstance(input_space[key], gymnasium.spaces.Box) for key in cfg.key), \"All keys must be Box spaces\"\n        assert all(len(input_space[key].shape) == 1 for key in cfg.key), (\n            f\"All key spaces must have 1D shape, got {[input_space[key].shape for key in cfg.key]}\"\n        )\n        first_dtype = input_space.spaces[cfg.key[0]].dtype\n        assert all(input_space.spaces[key].dtype == first_dtype for key in cfg.key), (\n            f\"All keys must have the same dtype {input_space.spaces[cfg.key[0]].dtype}\"\n        )\n        return gymnasium.spaces.Box(\n            low=np.concatenate([input_space.spaces[key].low for key in cfg.key]),\n            high=np.concatenate([input_space.spaces[key].high for key in cfg.key]),\n            dtype=input_space.spaces[cfg.key[0]].dtype,\n        )\n\n    def forward(self, _input: torch.Tensor | dict[str, torch.Tensor]):\n        if isinstance(_input, dict):\n            # Concatenate the observations from the specified keys\n            _input = torch.cat([_input[key] for key in self.cfg.key], dim=-1)\n\n        return _input\n\n\nNNFilter = tp.Annotated[\n    tp.Union[\n        IdentityInputFilterConfig,\n        DictInputFilterConfig,\n    ],\n    pydantic.Field(discriminator=\"name\"),\n]\n", "humanoidverse/agents/misc/zbuffer.py": "# Copyright (c) Meta Platforms, Inc. and affiliates.\n#\n# This source code is licensed under the CC BY-NC 4.0 license found in the\n# LICENSE file in the root directory of this source tree.\n\nfrom typing import Union\n\nimport numpy as np\nimport torch\n\n\nclass ZBuffer:\n    def __init__(self, capacity: int, dim: int, device: Union[torch.device, str], dtype: torch.dtype = torch.float32):\n        self._storage = torch.zeros((capacity, dim), device=device, dtype=dtype)\n        self._idx = 0\n        self._is_full = False\n        self.capacity = capacity\n        self.device = device\n\n    def __len__(self) -> int:\n        return self.capacity if self._is_full else self._idx\n\n    def empty(self) -> bool:\n        return self._idx == 0 and not self._is_full\n\n    def add(self, data: torch.Tensor) -> None:\n        if self._idx + data.shape[0] >= self.capacity:\n            diff = self.capacity - self._idx\n            self._storage[self._idx : self._idx + data.shape[0]] = data[:diff]\n            self._storage[: data.shape[0] - diff] = data[diff:]\n            self._is_full = True\n        else:\n            self._storage[self._idx : self._idx + data.shape[0]] = data\n        self._idx = (self._idx + data.shape[0]) % self.capacity\n\n    def sample(self, num, device=None) -> torch.Tensor:\n        idx = np.random.randint(0, len(self), size=num)\n        return self._storage[idx].clone().to(device if device is not None else self.device)\n", "humanoidverse/agents/envs/humanoidverse_isaac.py": "import os\n\nos.environ[\"HYDRA_FULL_ERROR\"] = \"1\"\n# For Isaac Sim\nos.environ[\"OMNI_KIT_ACCEPT_EULA\"] = \"YES\"\nimport typing as tp\nfrom typing import Any, Dict, Tuple, Union\n\nimport gymnasium\nimport humanoidverse\nimport hydra\nimport numpy as np\nimport torch\nimport pydantic\nfrom gymnasium import Env\nfrom gymnasium.vector import VectorEnv\nfrom humanoidverse.envs.legged_robot_motions.legged_robot_motions import LeggedRobotMotions, compute_humanoid_observations_max\nfrom humanoidverse.utils.helpers import pre_process_config, get_reference_proprioception\nfrom omegaconf import OmegaConf\nfrom torch.utils._pytree import tree_map\n\nfrom ..base import BaseConfig\nfrom ..buffers.trajectory import TrajectoryDictBuffer\nfrom .utils.history_handler import HistoryHandler\nfrom humanoidverse.envs.env_utils.history_handler import HistoryHandler as HVHistoryHandler\n\n# Resolve humanoidverse root: use package __file__ when set,\n# otherwise derive from this file (e.g. when run from release_version/humanoidverse where __file__ can be None).\nif getattr(humanoidverse, \"__file__\", None) is not None:\n    HUMANOIDVERSE_DIR = os.path.dirname(humanoidverse.__file__)\nelse:\n    HUMANOIDVERSE_DIR = os.path.dirname(os.path.dirname(os.path.dirname(os.path.abspath(__file__))))\n# THIS_FILE_DIR = os.path.abspath(os.path.dirname(__file__))\nHYDRA_CONFIG_DIR = os.path.join(HUMANOIDVERSE_DIR, \"config\")\nHYDRA_CONFIG_REL_PATH = os.path.join(\"exp\", \"bfm_zero\", \"bfm_zero\")\n\n\ndef load_expert_trajectories_from_motion_lib(env, agent_cfg, device=\"cpu\", add_history_noaction: bool = False):\n    \"\"\"\n    Load expert trajectories from motion library.\n    \"\"\"\n    env._motion_lib.load_motions_for_training()  # loading all motions from the motion lib\n    episodes = []\n    file_names = []\n    history_handler = HVHistoryHandler(1, env.config.obs.obs_auxiliary, env.config.obs.obs_dims, device)\n    history_config = env.config.obs.obs_auxiliary[\"history_actor\"]\n    for i in range(env._motion_lib._num_unique_motions):\n        motion_times = torch.arange(int(np.ceil((env._motion_lib._motion_lengths[i] / env.dt).cpu()))).to(env.device) * env.dt\n        # import ipdb; ipdb.set_trace()\n        motion_id = torch.tensor([i]).to(env.device).repeat(motion_times.shape[0])\n        motion_res = env._motion_lib.get_motion_state(motion_id, motion_times)\n        file_names.append(env._motion_lib._motion_data_keys[i])\n        # import ipdb; ipdb.set_trace()\n        ref_body_pos = motion_res[\"rg_pos_t\"]\n        ref_body_rots = motion_res[\"rg_rot_t\"]\n        ref_body_vels = motion_res[\"body_vel_t\"]\n        ref_body_angular_vels = motion_res[\"body_ang_vel_t\"]\n\n        # construct observation\n        # TODO is this aligned with the environment observation logic?\n        obs_dict = compute_humanoid_observations_max(\n            ref_body_pos,\n            ref_body_rots,\n            ref_body_vels,\n            ref_body_angular_vels,\n            local_root_obs=True,\n            root_height_obs=env.config.obs.root_height_obs,\n        )\n        max_local_self_obs = torch.cat([v for v in obs_dict.values()], dim=-1)\n\n        data = get_reference_proprioception(\n            env, motion_res[\"dof_pos\"], motion_res[\"dof_vel\"], ref_body_rots[:, 0], ref_body_angular_vels[:, 0]\n        )\n        bogus_actions = torch.zeros_like(data[\"dof_pos\"])\n        state = torch.cat(list(data.values()), dim=-1)\n\n        ### compute history_actor\n        # TODO: speed this up\n        # We use the same history has the environment but we drop the action\n        if add_history_noaction:\n            history_handler.reset([0])\n            history_actor = []\n            for ii in range(state.shape[0]):\n                history_tensors = []\n                for key in sorted(history_config.keys()):\n                    if key not in [\"action\", \"actions\"]:\n                        history_length = history_config[key]\n                        history_tensor = history_handler.query(key)[:, :history_length]\n                        history_tensor = history_tensor.reshape(history_tensor.shape[0], -1)  # Shape: [1, history_length*obs_dim]\n                        history_tensors.append(history_tensor)\n                history_tensors = torch.cat(history_tensors, dim=1)  # this is history_actor at time i\n                history_actor.append(history_tensors)\n\n                # update history with the current state\n                for key in history_handler.history.keys():\n                    if key not in [\"action\", \"actions\"]:\n                        history_handler.add(key, data[key][ii][None, ...])\n            history_actor = torch.stack(history_actor, dim=0).squeeze(1)  # Shape: [T, history_length*obs_dim]\n        ###\n\n        curr_motion_len = state.shape[0]\n        truncated = torch.zeros(curr_motion_len, dtype=bool).to(env.device)\n        truncated[-1] = True\n\n        assert state.shape[0] == curr_motion_len, f\"{env._motion_lib._motion_data_keys[i]}: {state.shape[0]} vs {curr_motion_len}\"\n        assert max_local_self_obs.shape[0] == curr_motion_len, (\n            f\"{env._motion_lib._motion_data_keys[i]}: {max_local_self_obs.shape[0]} vs {curr_motion_len}\"\n        )\n        assert bogus_actions.shape[0] == curr_motion_len, (\n            f\"{env._motion_lib._motion_data_keys[i]}: {bogus_actions.shape[0]} vs {curr_motion_len}\"\n        )\n        assert truncated.shape[0] == curr_motion_len, f\"{env._motion_lib._motion_data_keys[i]}: {truncated.shape[0]} vs {curr_motion_len}\"\n        if add_history_noaction:\n            assert history_actor.shape[0] == curr_motion_len, (\n                f\"{env._motion_lib._motion_data_keys[i]}: {history_actor.shape[0]} vs {curr_motion_len}\"\n            )\n\n        ep = {\n            \"observation\": {\n                \"state\": state,\n                \"last_action\": bogus_actions,\n                \"privileged_state\": max_local_self_obs,\n            },\n            \"terminated\": torch.zeros(curr_motion_len, dtype=bool).to(env.device),\n            \"truncated\": truncated,\n            \"motion_id\": torch.ones(curr_motion_len, dtype=torch.long) * i,\n        }\n        if add_history_noaction:\n            ep[\"observation\"][\"history_noaction\"] = history_actor\n        episodes.append(ep)\n\n    expert_buffer = TrajectoryDictBuffer(\n        episodes=episodes,\n        seq_length=agent_cfg.model.seq_length,\n        device=device,\n    )\n\n    assert expert_buffer.storage[\"observation\"][\"state\"].shape[0] == expert_buffer.storage[\"truncated\"].shape[0]\n    assert expert_buffer.storage[\"observation\"][\"last_action\"].shape[0] == expert_buffer.storage[\"truncated\"].shape[0]\n    assert expert_buffer.storage[\"observation\"][\"privileged_state\"].shape[0] == expert_buffer.storage[\"truncated\"].shape[0]\n    assert expert_buffer.storage[\"terminated\"].shape[0] == expert_buffer.storage[\"truncated\"].shape[0]\n    assert expert_buffer.storage[\"motion_id\"].shape[0] == expert_buffer.storage[\"truncated\"].shape[0]\n\n    expert_buffer.file_names = file_names\n    return expert_buffer\n\n\ndef get_enabled_dr_dynamics_obs_names(env: LeggedRobotMotions) -> list[str]:\n    \"\"\"Get list of dr_* raw observations that are actually being varied in the code (e.g., if ctrl_delay is randomized, then include dr_ctrl_delay observation in the list)\n\n    Useful for picking not including dr_* observations that are not actually varied in the environment.\"\"\"\n    isaac_config = env.config\n\n    dr_dynamics = []\n    if isaac_config.domain_rand.randomize_ctrl_delay:\n        dr_dynamics.append(\"dr_ctrl_delay\")\n    if isaac_config.domain_rand.randomize_pd_gain:\n        dr_dynamics.append(\"dr_pd_gains\")\n    if isaac_config.domain_rand.randomize_base_com:\n        dr_dynamics.append(\"dr_coms\")\n    if isaac_config.domain_rand.randomize_link_mass:\n        dr_dynamics.append(\"dr_masses\")\n    if isaac_config.domain_rand.randomize_friction:\n        dr_dynamics.append(\"dr_frictions\")\n    if isaac_config.domain_rand.randomize_torque_rfi:\n        dr_dynamics.append(\"dr_torque_rfi\")\n    if isaac_config.domain_rand.randomize_rfi_lim:\n        dr_dynamics.append(\"dr_rfi_lim\")\n\n    # Special case for obs noise: check if any noise is actually applied\n    if isaac_config.obs.noise_scales is not None:\n        for key, noise_scale in isaac_config.obs.noise_scales.items():\n            if noise_scale > 0.0:\n                # At least one noise scale is applied, so lets include all obs_noise_scales\n                dr_dynamics.append(\"dr_obs_noise_scales\")\n                break\n\n    return dr_dynamics\n\n\nclass IsaacRendererWithMuJoco:\n    \"\"\"Renders Isaac state via MuJoCo. Only 29 DOF (36-D qpos: 7 free + 29 joints) is supported.\"\"\"\n\n    def __init__(self, render_size: int = 512):\n        from humanoidverse.utils.g1_env_config import G1EnvConfig\n\n        self.mujoco_env, _ = G1EnvConfig(render_height=render_size, render_width=render_size).build(num_envs=1)\n\n    def render(self, hv_env: \"HumanoidVerseVectorEnv\", env_idxs: list[int] | None = None):\n        base_pos = hv_env.simulator.robot_root_states[:, [0, 1, 2, 6, 3, 4, 5]].clone().detach().cpu().numpy()\n        joint_pos = hv_env.simulator.dof_pos.clone().detach().cpu().numpy()\n        if joint_pos.shape[1] != 29:\n            raise ValueError(\n                f\"Isaac dof_pos must be 29-D (codebase is 29 DOF only), got {joint_pos.shape[1]}.\"\n            )\n        mujoco_qpos = np.concatenate([base_pos, joint_pos], axis=1)  # (n_envs, 36)\n\n        all_images = []\n        if env_idxs is None:\n            env_idxs = list(range(hv_env.num_envs))\n        elif not isinstance(env_idxs, (list, tuple)):\n            env_idxs = [int(env_idxs)]  # e.g. render(env, 0) -> render env 0 only\n        for env_idx in env_idxs:\n            qvel = self.mujoco_env.unwrapped._mj_data.qvel.copy()\n            self.mujoco_env.reset(options={\"qpos\": mujoco_qpos[env_idx], \"qvel\": qvel})\n            all_images.append(self.mujoco_env.render())\n\n        return all_images\n    \n    def from_qpos(self, qpos):\n        \"\"\"Render frames for each qpos. Only 36-D qpos (7 free + 29 joints) is supported.\"\"\"\n        frames = []\n        n = len(qpos)\n        for i, q in enumerate(qpos):\n            if (i + 1) % 50 == 0 or i == 0 or i == n - 1:\n                print(f\"  Rendering expert frame {i + 1}/{n}\")\n            q = np.asarray(q).ravel()\n            if q.size != 36:\n                raise ValueError(\n                    f\"from_qpos expects 36-D qpos (7 free + 29 joints), got shape {q.shape}. \"\n                    \"23-DOF / 30-D qpos is not supported.\"\n                )\n            self.mujoco_env.reset(options={\"qpos\": q})\n            frames.append(self.mujoco_env.render())\n        return frames\n\n\n\nclass HumanoidVerseVectorEnv(VectorEnv):\n    \"\"\"Wrapper to make the humanoidverse env compatible with gymnasium's VectorEnv interface.\"\"\"\n\n    def __init__(\n        self,\n        env: LeggedRobotMotions,\n        add_time_aware_observation: bool = True,\n        include_last_action: bool = True,\n        context_length: int | None = None,\n        include_dr_info: bool = False,\n        included_dr_obs_names: list[str] | None = None,\n        include_history_actor: bool = True,\n        include_history_noaction: bool = False,\n    ):\n        super().__init__()\n        self._env = env\n        self.spec = self._env.spec\n        self.num_envs = self._env.num_envs\n        self.add_time_aware_observation = add_time_aware_observation\n        self.include_last_action = include_last_action\n        self.context_length = context_length\n        self.history_handler = None\n        self.include_dr_info = include_dr_info\n        self.include_history_actor = include_history_actor\n        self.include_history_noaction = include_history_noaction\n        if included_dr_obs_names is not None:\n            self.included_dr_obs_names = included_dr_obs_names\n        else:\n            self.included_dr_obs_names = get_enabled_dr_dynamics_obs_names(self._env)\n        if self.include_dr_info and len(self.included_dr_obs_names) == 0:\n            raise ValueError(\n                \"include_dr_info is True, but no dr_* observations are enabled in the environment. \"\n                \"Check the domain randomization settings in the environment config.\"\n            )\n\n        # TODO does might not be ideal, but we need to reset things to get the observation space\n        example_observation, _ = self.reset()\n        observation_spaces = {}\n        for key, value in example_observation.items():\n            if key != \"history\":\n                observation_spaces[key] = gymnasium.spaces.Box(\n                    low=-float(\"inf\"),\n                    high=float(\"inf\"),\n                    shape=value.shape,\n                    dtype=np.float32,\n                )\n        if self.include_history_noaction:\n            history_length = 0\n            for k, v in self._env.config.obs.obs_auxiliary[\"history_actor\"].items():\n                if k not in [\"action\", \"actions\"]:\n                    history_length += v * self._env.config.obs.obs_dims[k]\n            observation_spaces[\"history_noaction\"] = gymnasium.spaces.Box(\n                low=-float(\"inf\"),\n                high=float(\"inf\"),\n                shape=(self.num_envs, history_length),\n                dtype=np.float32,\n            )\n\n        if add_time_aware_observation:\n            # Update the observation spaces to include time-aware observation\n            observation_spaces[\"time\"] = gymnasium.spaces.Box(\n                low=0.0,\n                high=float(\"inf\"),\n                shape=(1,),\n                dtype=np.int32,\n            )\n        self.observation_space = gymnasium.spaces.Dict(observation_spaces)\n        self.single_action_space = self._env.get_wrapper_attr(\"single_action_space\")\n        # Repeat the action space to match the vectorized environment\n        action_space_shape = (self.num_envs,) + self.single_action_space.shape\n        self.action_space = gymnasium.spaces.Box(\n            low=np.tile(self.single_action_space.low, (self.num_envs, 1)),\n            high=np.tile(self.single_action_space.high, (self.num_envs, 1)),\n            shape=action_space_shape,\n            dtype=self.single_action_space.dtype,\n        )\n        if self.context_length:\n            # keep track of the high level history of the observations and action\n            dims = {\"action\": self.single_action_space.shape[0]}\n            for k, v in self.single_observation_space.spaces.items():\n                dims[k] = 1 if len(v.shape) == 0 else v.shape[0]\n            self.history_handler = HistoryHandler(self.num_envs, context_length=self.context_length, keys_dims=dims, device=self.device)\n\n        _target_dof_pos = self._env.default_dof_pos.clone().unsqueeze(-1).repeat(self.num_envs, 1, 2)\n        # Set velocities to zero\n        _target_dof_pos[..., 1] = 0.0\n        root_state = self._env.base_init_state.clone()\n        if self._env.config.simulator.config.name == \"isaacsim\":\n            root_state[3:7] = root_state[[6, 3, 4, 5]]\n        self._default_pose_target_reset = {\n            \"dof_states\": _target_dof_pos,\n            \"root_states\": root_state,\n        }\n\n    @property\n    def single_observation_space(self):\n        \"\"\"Return the observation space for a single environment.\"\"\"\n        single_obs_spaces = {}\n        for key, space in self.observation_space.spaces.items():\n            single_obs_spaces[key] = gymnasium.spaces.Box(\n                low=space.low[0],\n                high=space.high[0],\n                shape=space.shape[1:],\n                dtype=space.dtype,\n            )\n        return gymnasium.spaces.Dict(single_obs_spaces)\n\n    @property\n    def device(self):\n        return self.base_env.device\n\n    @property\n    def base_env(self) -> Env:\n        return self._env.unwrapped\n\n    @property\n    def unwrapped(self):\n        return self.base_env\n\n    def reset(\n        self,\n        *,\n        seed: int | None = None,\n        options: dict[str, Any] | None = None,\n        to_numpy: bool = True,\n        reset_to_default_pose: bool = False,\n        target_states: dict[str, torch.Tensor] | None = None,\n    ) -> tuple[torch.Tensor, dict[str, Any]]:\n        if seed is not None:\n            from humanoidverse.agents.utils import set_seed_everywhere\n\n            set_seed_everywhere(seed)\n            self.action_space.seed(seed)\n            self.single_action_space.seed(seed)\n        if reset_to_default_pose and target_states is not None:\n            raise ValueError(\"Cannot specify both reset_to_default_pose and target_states.\")\n        target_states = target_states or (self._default_pose_target_reset if reset_to_default_pose else None)\n        _, info = self.base_env.reset_all(target_states=target_states)\n        observation = self._get_g1env_observation(to_numpy=to_numpy)\n        qpos, qvel = self._get_qpos_qvel(to_numpy=to_numpy)\n        # add only observation to the history\n        # observation is now 1 step ahead\n        if self.history_handler is not None:\n            self._update_history(torch.arange(self.num_envs, device=self.device), observation, None)\n            observation[\"history\"] = {\"observation\": [], \"action\": []}\n        self.env_to_reset = []\n        info = {\"qpos\": qpos, \"qvel\": qvel}\n        return observation, info\n\n    def _get_qpos_qvel(self, to_numpy: bool = True, sim_state=None):\n        if sim_state is None:\n            sim_state = {\n                \"root_states\": self._env.simulator.robot_root_states,\n                \"dof_pos\": self._env.simulator.dof_pos,\n                \"dof_vel\": self._env.simulator.dof_vel,\n                \"base_ang_vel\": self._env._get_obs_base_ang_vel(),\n            }\n        base_pos = sim_state[\"root_states\"][:, [0, 1, 2, 6, 3, 4, 5]].clone().detach()\n        qpos = sim_state[\"dof_pos\"].clone().detach()\n        mujoco_qpos = torch.cat([base_pos, qpos], dim=-1)\n        qvel = sim_state[\"dof_vel\"].clone().detach()\n        base_lin_vel = sim_state[\"root_states\"][:, 7:10].clone().detach()\n        base_ang_vel = sim_state[\"base_ang_vel\"].clone().detach()\n        mujoco_qvel = torch.cat([base_lin_vel, base_ang_vel, qvel], dim=-1)\n        if to_numpy:\n            mujoco_qpos = mujoco_qpos.cpu().numpy()\n            mujoco_qvel = mujoco_qvel.cpu().numpy()\n        return mujoco_qpos, mujoco_qvel\n\n    def _get_g1env_observation(self, to_numpy: bool = True, raw_obs=None, episode_length=None):\n        \"\"\"Turn current Isaac sim state into a G1Env-like observation.\"\"\"\n\n        # G1Env state: https://github.com/fairinternal/HumEnv/blob/main/g1env/robot.py#L545-L551\n        if raw_obs is None:\n            raw_obs = self._env.obs_buf_dict_raw[\"actor_obs\"]\n        if episode_length is None:\n            episode_length = self._env.episode_length_buf\n\n        g1env_state = torch.cat(\n            [\n                raw_obs[\"dof_pos\"],\n                raw_obs[\"dof_vel\"],\n                raw_obs[\"projected_gravity\"],\n                raw_obs[\"base_ang_vel\"],\n            ],\n            dim=-1,\n        )\n        last_action = raw_obs[\"actions\"]\n\n        # This is the function used to produce \"max_local_self\"\n        # G1Env:\n        #  https://github.com/fairinternal/HumEnv/blob/main/g1env/robot.py#L584-L587\n        #  https://github.com/fairinternal/HumEnv/blob/main/g1env/robot.py#L713\n        privileged_state = raw_obs[\"max_local_self\"]\n        observation = {\n            \"state\": g1env_state,\n            \"privileged_state\": privileged_state,\n        }\n        if self.include_last_action:\n            observation[\"last_action\"] = last_action\n        if self.add_time_aware_observation:\n            observation[\"time\"] = episode_length.unsqueeze(-1)\n        if self.include_history_actor:\n            observation[\"history_actor\"] = raw_obs[\"history_actor\"]\n        if self.include_history_noaction:\n tart_stop_traj(\n                done.squeeze(-1)[: len(self)], at_capacity=self._is_full, cursor=self._idx - 1\n            )\n            self._recompute_start_stop = False\n\n        output, offset = {}, 0\n        if len(self.output_key_tp1) > 0:\n            output[\"next\"] = {}\n            offset = 1\n        for start, length in zip(self.start_idx, self.lengths):\n            idxs = (start[0] + torch.arange(length - offset, device=self.device)) % self.capacity\n            for k in self.output_key_t:\n                if k not in output:\n                    output[k] = []\n                output[k].append(tree_map(lambda x: x[idxs, start[1]], self.storage[k]))\n            idxs = (start[0] + 1 + torch.arange(length - offset, device=self.device)) % self.capacity\n            for k in self.output_key_tp1:\n                if k not in output[\"next\"]:\n                    output[\"next\"][k] = []\n                output[\"next\"][k].append(tree_map(lambda x: x[idxs, start[1]], self.storage[k]))\n        for k in self.output_key_t:\n            output[k] = tree_concat(output[k])\n        for k in self.output_key_tp1:\n            output[\"next\"][k] = tree_concat(output[\"next\"][k])\n        return output\n\n\ndef get_idxs(seq_length, num_slices, lengths, start_idx, storage_length, priorities: torch.Tensor | None = None, offset=1):\n    if priorities is not None:\n        traj_idx = torch.multinomial(priorities, num_slices, replacement=True)\n    else:\n        traj_idx = torch.randint(lengths.shape[0], (num_slices,), device=lengths.device)\n    end_point = lengths[traj_idx] - seq_length - offset + 1\n    relative_starts = (torch.rand(num_slices, device=lengths.device) * end_point).floor().to(start_idx.dtype)\n    starts = torch.cat(\n        [\n            (start_idx[traj_idx, 0] + relative_starts).unsqueeze(1),\n            start_idx[traj_idx, 1:],\n        ],\n        1,\n    )\n    idxs = _tensor_slices_from_startend(seq_length, starts, storage_length=storage_length)\n    return idxs\n\n\ndef find_start_stop_traj(end: torch.Tensor, at_capacity: bool = True, cursor=None | int):\n    length = end.shape[0]\n    if not at_capacity:\n        end = torch.index_fill(\n            end,\n            index=torch.tensor(length - 1, device=end.device, dtype=torch.long),\n            dim=0,\n            value=1,\n        )\n    else:\n        if cursor is not None:\n            if not _is_int(cursor):\n                raise ValueError(\"cursor must be an int\")\n            end = torch.index_fill(\n                end,\n                index=torch.tensor(cursor, device=end.device, dtype=torch.long),\n                dim=0,\n                value=1,\n            )\n        if not end.any(0).all():\n            mask = ~end.any(0, True)\n            mask = torch.cat([torch.zeros_like(end[:-1]), mask])\n            end = torch.masked_fill(mask, end, 1)\n    return _end_to_start_stop(length=length, end=end)\n\n\ndef _end_to_start_stop(end, length):\n    # Using transpose ensures the start and stop are sorted the same way\n    stop_idx = end.transpose(0, -1).nonzero()\n    stop_idx[:, [0, -1]] = stop_idx[:, [-1, 0]].clone()\n    # First build the start indices as the stop + 1, we'll shift it later\n    start_idx = stop_idx.clone()\n    start_idx[:, 0] += 1\n    start_idx[:, 0] %= end.shape[0]\n    # shift start: to do this, we check when the non-first dim indices are identical\n    # and get a mask like [False, True, True, False, True, ...] where False means\n    # that there's a switch from one dim to another (ie, a switch from one element of the batch\n    # to another). We roll this one step along the time dimension and these two\n    # masks provide us with the indices of the permutation matrix we need\n    # to apply to start_idx.\n    if start_idx.shape[0] > 1:\n        start_idx_mask = (start_idx[1:, 1:] == start_idx[:-1, 1:]).all(-1)\n        m1 = torch.cat([torch.zeros_like(start_idx_mask[:1]), start_idx_mask])\n        m2 = torch.cat([start_idx_mask, torch.zeros_like(start_idx_mask[:1])])\n        start_idx_replace = torch.empty_like(start_idx)\n        start_idx_replace[m1] = start_idx[m2]\n        start_idx_replace[~m1] = start_idx[~m2]\n        start_idx = start_idx_replace\n    else:\n        # In this case we have only one start and stop has already been set\n        pass\n    lengths = stop_idx[:, 0] - start_idx[:, 0] + 1\n    lengths[lengths \u003c= 0] = lengths[lengths \u003c= 0] + length\n    return start_idx, stop_idx, lengths\n\n\ndef _tensor_slices_from_startend(seq_length, starts, storage_length):\n    arange = torch.arange(seq_length, device=starts.device, dtype=starts.dtype)\n    ndims = starts.shape[-1] - 1 if (starts.ndim - 1) else 0\n    if ndims:\n        arange_reshaped = torch.empty(list(arange.shape) + [ndims + 1], device=starts.device, dtype=starts.dtype)\n        arange_reshaped[..., 0] = arange\n        arange_reshaped[..., 1:] = 0\n    else:\n        arange_reshaped = arange.unsqueeze(-1)\n    arange_expanded = arange_reshaped.expand([starts.shape[0]] + list(arange_reshaped.shape))\n    n_missing_dims = arange_expanded.dim() - starts.dim()\n    start_expanded = starts[(slice(None),) + (None,) * n_missing_dims].expand_as(arange_expanded)\n    result = (start_expanded + arange_expanded).flatten(0, 1)\n    result[:, 0] = result[:, 0] % storage_length\n    return result\n\n\ndef key_exists(data, key):\n    if isinstance(key, str):\n        return key in data.keys()\n    else:\n        if len(key) == 1:\n            return key[0] in data.keys()\n        if key[0] not in data.keys():\n            return False\n        return key_exists(data[key[0]], key[1:])\n\n\ndef set_key(data, key, value):\n    if isinstance(key, str):\n        data[key] = value\n    elif len(key) == 1:\n        data[key[0]] = value\n    else:\n        set_key(data, key[1:], value)\n\n\ndef get_key(data, key):\n    if isinstance(key, str):\n        return data[key]\n    elif len(key) == 1:\n
