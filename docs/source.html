    # print(f\"obs_key: {obs_key}, obs_noise: {obs_noise}\")\n        \n        actor_obs = getattr(cls, f\"_get_obs_{obs_key}\")().clone()\n        obs_scale = obs_scales[obs_key]\n        \n       \n        buf_dict[obs_key] = (actor_obs + (torch.rand_like(actor_obs)* 2. - 1.) * obs_noise) * obs_scale\n\n\ndef export_policy_as_jit(actor_critic, path):\n    if hasattr(actor_critic, 'memory_a'):\n        # assumes LSTM: TODO add GRU\n        exporter = PolicyExporterLSTM(actor_critic)\n        exporter.export(path)\n    else: \n        os.makedirs(path, exist_ok=True)\n        path = os.path.join(path, 'policy_1.pt')\n        model = copy.deepcopy(actor_critic.actor).to('cpu')\n        traced_script_module = torch.jit.script(model)\n        traced_script_module.save(path)\n\nclass PolicyExporterLSTM(torch.nn.Module):\n    def __init__(self, actor_critic):\n        super().__init__()\n        self.actor = copy.deepcopy(actor_critic.actor)\n        self.is_recurrent = actor_critic.is_recurrent\n        self.memory = copy.deepcopy(actor_critic.memory_a.rnn)\n        self.memory.cpu()\n        self.register_buffer(f'hidden_state', torch.zeros(self.memory.num_layers, 1, self.memory.hidden_size))\n        self.register_buffer(f'cell_state', torch.zeros(self.memory.num_layers, 1, self.memory.hidden_size))\n\n    def forward(self, x):\n        out, (h, c) = self.memory(x.unsqueeze(0), (self.hidden_state, self.cell_state))\n        self.hidden_state[:] = h\n        self.cell_state[:] = c\n        return self.actor(out.squeeze(0))\n\n    @torch.jit.export\n    def reset_memory(self):\n        self.hidden_state[:] = 0.\n        self.cell_state[:] = 0.\n \n    def export(self, path):\n        os.makedirs(path, exist_ok=True)\n        path = os.path.join(path, 'policy_lstm_1.pt')\n        self.to('cpu')\n        traced_script_module = torch.jit.script(self)\n        traced_script_module.save(path)\n\n\ndef get_reference_proprioception(env, dof_pos, dof_vel, base_quat, base_ang_vel):\n    \"\"\"Match the noise-free online proprioception (local frame and configured scales).\"\"\"\n    from humanoidverse.utils.torch_utils import quat_rotate_inverse\n\n    data = {\n        \"dof_pos\": dof_pos - env.default_dof_pos[0],\n        \"dof_vel\": dof_vel,\n        \"projected_gravity\": quat_rotate_inverse(base_quat, env.gravity_vec[:1].expand(base_quat.shape[0], -1), w_last=True),\n        \"base_ang_vel\": quat_rotate_inverse(base_quat, base_ang_vel, w_last=True),\n    }\n    return {key: value * env.config.obs.obs_scales[key] for key, value in data.items()}\n\n\ndef get_backward_observation(env, motion_id, use_root_height_obs: bool = False, velocity_multiplier: float = 1.0) -> torch.Tensor:\n    from humanoidverse.utils.torch_utils import quat_rotate_inverse\n    from humanoidverse.envs.legged_robot_motions.legged_robot_motions import compute_humanoid_observations_max, compute_humanoid_observations_max_with_contact\n    \n    motion_times = torch.arange(int(np.ceil((env._motion_lib._motion_lengths[motion_id]/env.dt).cpu()))).to(env.device) * env.dt\n    \n    # get blend motion state\n    motion_state = env._motion_lib.get_motion_state(motion_id, motion_times)\n\n    ref_body_pos = motion_state[\"rg_pos_t\"]\n    ref_body_rots = motion_state[\"rg_rot_t\"]\n    ref_body_vels = motion_state[\"body_vel_t\"] * velocity_multiplier\n    ref_body_angular_vels = motion_state[\"body_ang_vel_t\"] * velocity_multiplier\n    ref_dof_pos = motion_state[\"dof_pos\"] - env.default_dof_pos[0]\n    ref_dof_vel = motion_state[\"dof_vel\"] * velocity_multiplier\n\n    # construct observation\n    if env.use_contact_in_obs_max:\n        contact_binary = env.foot_contact_detect(ref_body_pos, ref_body_vels)\n        obs_dict = compute_humanoid_observations_max_with_contact(\n            ref_body_pos,\n            ref_body_rots,\n            ref_body_vels,\n            ref_body_angular_vels,\n            local_root_obs=True,\n            root_height_obs=use_root_height_obs,\n            contact_binary=contact_binary\n        )\n    else:\n        obs_dict = compute_humanoid_observations_max(\n            ref_body_pos,\n            ref_body_rots,\n            ref_body_vels,\n            ref_body_angular_vels,\n            local_root_obs=True,\n            root_height_obs=use_root_height_obs,\n        )\n    max_local_self_obs = torch.cat([v for v in obs_dict.values()], dim=-1)\n\n    if env.config.obs.use_obs_filter:\n        base_quat = ref_body_rots[:, 0]  # root orientation\n        ref_ang_vel = ref_body_angular_vels[:, 0]\n        projected_gravity = quat_rotate_inverse(\n            base_quat,\n            env.gravity_vec[0:1].repeat(max_local_self_obs.shape[0], 1),\n            w_last=True\n        )\n        bogus_actions = ref_dof_pos\n\n        bogus_history_actor = torch.cat([bogus_actions, ref_ang_vel, ref_dof_pos, ref_dof_vel, projected_gravity], dim=-1).repeat(1, 4)\n        ref_dict = {\n            \"actions\": bogus_actions,\n            \"ref_ang_vel\": ref_ang_vel,\n            \"ref_dof_pos\": ref_dof_pos,\n            \"ref_dof_vel\": ref_dof_vel,\n            \"dof_pos\": motion_state[\"dof_pos\"],\n            \"fake_history\": bogus_history_actor,\n            \"max_local_self_obs\": max_local_self_obs,\n            \"projected_gravity\": projected_gravity,\n            \"ref_body_pos\": ref_body_pos,\n            \"ref_body_rots\": ref_body_rots,\n            \"ref_body_vels\": ref_body_vels,\n            \"ref_body_angular_vels\": ref_body_angular_vels\n        }\n        proprioception = get_reference_proprioception(\n            env, motion_state[\"dof_pos\"], ref_dof_vel, base_quat, ref_body_angular_vels[:, 0]\n        )\n        state = torch.cat(list(proprioception.values()), dim=-1)\n        last_action = bogus_actions\n        # TODO get obs from raw obs instead of the obs\n        bfmzero_obs = {\n            \"state\": state,\n            \"last_action\": last_action,\n            \"privileged_state\": max_local_self_obs\n        }\n        return bfmzero_obs, ref_dict\n    else:\n        ref_dict = {\n            \"max_local_self_obs\": max_local_self_obs,\n        }\n        return max_local_self_obs, ref_dict\n\n\ndef export_meta_policy_as_onnx(inference_model, path, exported_policy_name, example_obs_dict, z_dim, history: bool = False, use_29dof: bool = True):\n    os.makedirs(path, exist_ok=True)\n    path = os.path.join(path, exported_policy_name)\n    inference_model = inference_model.eval()\n    actor = copy.deepcopy(inference_model).to(\"cpu\")\n\n    class PPOWrapper(nn.Module):\n        def __init__(self, actor, history):\n            \"\"\"\n            model: The original PyTorch model.\n            input_keys: List of input names as keys for the input dictionary.\n            \"\"\"\n            super(PPOWrapper, self).__init__()\n            self.actor = actor\n            self.history = history\n\n        def forward(self, actor_obs):\n            \"\"\"\n            Dynamically creates a dictionary from the input keys and args.\n            \"\"\"\n            actor_obs, ctx = actor_obs[:, :-z_dim], actor_obs[:, -z_dim:]\n            if use_29dof:\n                state_end = 64\n                action_end = state_end+29\n            else:\n                state_end = 52\n                action_end = state_end+23\n            state = actor_obs[:, :state_end]\n            last_action = actor_obs[:, state_end:(action_end)]\n            actor_dict = {\n                \"state\": state,\n                \"last_action\": last_action\n            }\n            if self.history:\n                actor_dict[\"history_actor\"] = actor_obs[:, (action_end):]\n\n            return self.actor.act(actor_dict, ctx)\n\n    wrapper = PPOWrapper(actor, history=history)\n    example_input_list = example_obs_dict[\"actor_obs\"]\n    torch.onnx.export(\n        wrapper,\n        example_input_list,  # Pass x1 and x2 as separate inputs\n        path,\n        verbose=True,\n        input_names=[\"actor_obs\"],  # Specify the input names\n        output_names=[\"action\"],  # Name the output\n        opset_version=13,  # Specify the opset version, if needed\n    )\n", "humanoidverse/config/obs/bfm_zero_obs.yaml": "# @package _global_\n\n# Be careful when using _raw, history\nobs:\n  use_obs_filter: True\n  root_height_obs: True\n  obs_dict:\n    actor_obs: [\n      base_ang_vel,\n      projected_gravity,\n      dof_pos,\n      dof_vel,\n      actions,\n      history_actor,\n      max_local_self,\n    ]\n\n    critic_obs: [\n      max_local_self\n    ]\n\n  obs_auxiliary: # define those coumpounds in obs_dict, for example, you can define different long/short history with different length\n    history_actor: {\n      base_ang_vel: 4,\n      projected_gravity: 4,\n      dof_pos: 4,\n      dof_vel: 4,\n      actions: 4,\n    }\n\n  obs_scales: {\n    actions: 1.0,\n    dof_pos: 1.0,\n    dof_vel: 1.0,\n    max_local_self: 1.0,\n    base_lin_vel: 1.0,\n    base_ang_vel: 0.25,\n    projected_gravity: 1.0,\n    history_actor: 1.0,\n  }\n\n  noise_scales: {\n    base_lin_vel: 0.0,\n    base_ang_vel: 0.2,\n    projected_gravity: 0.05,\n    dof_pos: 0.01,\n    dof_vel: 0.5,\n    actions: 0.0,\n    max_local_self: 0.0,\n    history_actor: 0.0,\n  }\n\n  add_noise_currculum: False\n  noise_initial_value: 0.05\n  noise_value_max: 1.0\n  noise_value_min: 0.00001\n  soft_dof_pos_curriculum_degree: 0.00001\n  soft_dof_pos_curriculum_level_down_threshold: 40\n  soft_dof_pos_curriculum_level_up_threshold: 42\n\n  obs_dims:\n    - base_lin_vel: 3\n    - base_ang_vel: 3\n    - projected_gravity: 3\n    - dof_pos: ${robot.dof_obs_size}\n    - dof_vel: ${robot.dof_obs_size}\n    - actions: ${robot.dof_obs_size}\n    - max_local_self: ${eval:'(3 + 6 + 3 + 3) * (${robot.num_bodies} + ${robot.motion.nums_extend_bodies}) + 1 - 3 - 1'}\n\n\n  post_compute_config: {} # Will store values after preprocessing, don't put anything here", "humanoidverse/con own_threshold: 40\n  reward_penalty_level_up_threshold: 42 # shortest motion in TairanTestbed is 92, therefore 46 is the middle point, we set 42 here for curriculum learning level up\n  reward_penalty_degree: 0.000003 # 0.00001\n  num_compute_average_epl: 10000\n\n  reward_limit:\n    soft_dof_pos_limit: 0.95\n    soft_dof_vel_limit: 0.95\n    soft_torque_limit: 0.95\n\n    reward_limits_curriculum:\n      soft_dof_pos_curriculum: False\n      soft_dof_pos_initial_limit: 1.15\n      soft_dof_pos_max_limit: 1.15\n      soft_dof_pos_min_limit: 0.95\n      soft_dof_pos_curriculum_degree: 0.00000025\n      soft_dof_pos_curriculum_level_down_threshold: 40\n      soft_dof_pos_curriculum_level_up_threshold: 42\n\n      soft_dof_vel_curriculum: False\n      soft_dof_vel_initial_limit: 1.15\n      soft_dof_vel_max_limit: 1.25\n      soft_dof_vel_min_limit: 0.95\n      soft_dof_vel_curriculum_degree: 0.00000025\n      soft_dof_vel_curriculum_level_down_threshold: 40\n      soft_dof_vel_curriculum_level_up_threshold: 42\n\n      soft_torque_curriculum: False\n      soft_torque_initial_limit: 1.15\n      soft_torque_max_limit: 1.25\n      soft_torque_min_limit: 0.85\n      soft_torque_curriculum_degree: 0.00000025\n      soft_torque_curriculum_level_down_threshold: 40\n      soft_torque_curriculum_level_up_threshold: 42\n\n  reward_penalty_reward_names : [\n    \"penalty_torques\",\n    # \"penalty_dof_acc\",\n    # \"penalty_dof_vel\",\n    \"penalty_action_rate\",\n    \"limits_dof_pos\",\n    # \"limits_dof_vel\",\n    \"limits_torque\",\n    \"penalty_slippage\",\n    \"penalty_undesired_contact\",\n    \"penalty_ankle_roll\",\n    \"penalty_feet_ori\"\n    ]", "humanoidverse/config/domain_rand/domain_rand.yaml": "# @package _global_\n\ndomain_rand:\n  # push robots\n  push_robots : True\n  push_interval_s : [1, 3]\n  max_push_vel_xy : 0.5\n  max_push_ang_vel: 0.5\n  push_robot_recovery_time : 2.0\n\n  # base com\n  randomize_base_com : True\n  base_com_range:\n    x : [-0.02, 0.02]\n    y : [-0.02, 0.02]\n    z : [-0.02, 0.02]\n\n  # link mass\n  randomize_link_mass : True\n  link_mass_range : [0.95, 1.05]\n\n  # pd gain\n  randomize_pd_gain : False\n  kp_range : [0.75, 1.25]\n  kd_range : [0.75, 1.25]\n\n  # friction\n  randomize_friction : True\n  friction_range : [0.5, 1.25]\n\n  # base mass\n  randomize_base_mass : False\n\n  # rfi\n  randomize_torque_rfi : False\n  rfi_lim : 0.1\n  randomize_rfi_lim : False\n  rfi_lim_range : [0.5, 1.5]\n\n\n  # control delay\n  randomize_ctrl_delay : False\n  ctrl_delay_step_range : [0, 1] # integer max real delay is 90ms\n\n  # Mimicing BeyondMimic: https://github.com/HybridRobotics/whole_body_tracking/blob/dcecabd8c24c68f59d143fdf8e3a670f420c972d/source/whole_body_tracking/whole_body_tracking/tasks/tracking/tracking_env_cfg.py#L170\n  randomize_default_dof_pos : True\n  default_dof_pos_noise_range : [-0.02, 0.02]\n", "humanoidverse/config/simulator/isaacsim.yaml": "# @package _global_\n\n# Env structure\nsimulator:\n  _target_: humanoidverse.simulator.isaacsim.isaacsim.IsaacSim\n  _recursive_: False\n  config:\n    name: \"isaacsim\"\n    terrain: ${terrain}\n    plane:\n        static_friction: 1.0\n        dynamic_friction: 1.0\n        restitution: 0.0\n    sim:\n      fps: 200\n      control_decimation: 4\n      substeps: 1\n      physx:\n        num_threads: 10\n        solver_type: 1 # 0: pgs, 1: tgs\n        num_position_iterations: 4\n        num_velocity_iterations: 0\n        contact_offset: 0.01\n        rest_offset: 0.0\n        bounce_threshold_velocity: 0.5\n        max_depenetration_velocity: 1.0\n        default_buffer_size_multiplier: 5\n        contact_collection: 2\n      render_mode: \"human\" # [None, \"human\", \"rgb_array\"]\n      render_interval: 4\n    \n    scene:\n      num_envs: ${num_envs}\n      env_spacing: ${env.config.env_spacing}\n      replicate_physics: True", "humanoidverse/tracking_inference.py": "import os\n\nos.environ[\"MUJOCO_GL\"] = \"egl\"  # Use EGL for rendering\nos.environ[\"OMP_NUM_THREADS\"] = \"1\"\n\nfrom pathlib import Path\nfrom humanoidverse.agents.load_utils import load_model_from_checkpoint_dir\nimport json\nfrom humanoidverse.agents.envs.humanoidverse_isaac import HumanoidVerseIsaacConfig, IsaacRendererWithMuJoco\nimport torch\nfrom humanoidverse.utils.helpers import export_meta_policy_as_onnx\nfrom humanoidverse.utils.helpers import get_backward_observation\nimport joblib\nimport mediapy as media\nimport numpy as np\nfrom torch.utils._pytree import tree_map\n\nimport humanoidverse\nif getattr(humanoidverse, \"__file__\", None) is not None:\n    HUMANOIDVERSE_DIR = Path(humanoidverse.__file__).parent\nelse:\n    HUMANOIDVERSE_DIR = Path(__file__).resolve().parent\n\n\ndef main(model_folder: Path, data_path: Path | None = None, headless: bool = True, device=\"cuda\", simulator: str = \"isaacsim\", save_mp4: bool=False, disable_dr: bool = False, disable_obs_noise: bool = False, motion_list: list[int] = [25]):\n    # motion_list: motion ids to evaluate (default [25])\n    \n    model_folder = Path(model_folder)\n\n    model = load_model_from_checkpoint_dir(model_folder / \"checkpoint\", device=device)\n    model.to(device)\n    model.eval()\n    model_name = \"model\"\n    model_name = model.__class__.__name__\n    with open(model_folder / \"config.json\", \"r\") as f:\n        config = json.load(f)\n\n    use_root_height_obs = config[\"env\"].get(\"root_height_obs\", False)\n\n    if data_path is not None:\n        config[\"env\"][\"lafan_tail_path\"] = str(Path(data_path).resolve())\n    elif not Path(config[\"env\"].get(\"lafan_tail_path\", \"\")).exists():\n        default_path = HUMANOIDVERSE_DIR / \"data\" / \"lafan_29dof.pkl\"\n        if default_path.exists():\n            config[\"env\"][\"lafan_tail_path\"] = str(default_path)\n        else:\n            config[\"env\"][\"lafan_tail_path\"] = \"data/lafan_29dof.pkl\"\n    # import ipdb; ipdb.set_trace()\n    config[\"env\"][\"hydra_overrides\"].append(\"env.config.max_episode_length_s=10000\")\n    config[\"env\"][\"hydra_overrides\"].append(f\"env.config.headless={headless}\")\n    config[\"env\"][\"hydra_overrides\"].append(f\"simulator={simulator}\")\n    config[\"env\"][\"disable_domain_randomization\"] = disable_dr\n    config[\"env\"][\"disable_obs_noise\"] = disable_obs_noise\n\n    # Outputs under model_folder/tracking_inference (sibling of exported/)\n    output_dir = model_folder / \"exported\"\n    output_dir.mkdir(parents=True, exist_ok=True)\n    export_meta_policy_as_onnx(\n        model,\n        output_dir,\n        f\"{model_name}.onnx\",\n        {\"actor_obs\": torch.randn(1, model._actor.input_filter.output_space.shape[0] + model.cfg.archi.z_dim)},\n        z_dim=model.cfg.archi.z_dim,\n        history=('history_actor' in model.cfg.archi.actor.input_filter.key),\n        use_29dof=True,\n    )\n    print(f\"Exported model to {output_dir}/{model_name}.onnx\")\n\n    def tracking_inference(obs) -> torch.Tensor:\n        z = model.backward_map(obs)\n        for step in range(z.shape[0]):\n            end_idx = min(step + 1, z.shape[0])\n            z[step] = z[step:end_idx].mean(dim=0)\n        return model.project_z(z)\n\n    # rgb_renderer = IsaacRendererWithMuJoco(render_size=256)\n    env_cfg = HumanoidVerseIsaacConfig(**config[\"env\"])\n    num_envs = 1\n    wrapped_env, _ = env_cfg.build(num_envs)\n    env = wrapped_env._env\n    print(\"=\"*80)\n    print(env.config.simulator)\n    print(\"-\"*80)\n    \n    output_dir = model_folder / \"tracking_inference\"\n\n    for MOTION_ID in motion_list:\n        env.set_is_evaluating(MOTION_ID)\n        # we visulize the first env\n        obs, obs_dict = get_backward_observation(env, 0, use_root_height_obs=use_root_height_obs)\n\n        expert_qpos = np.concatenate([\n            obs_dict[\"ref_body_pos\"][:,0].cpu().numpy(),\n            np.roll(obs_dict[\"ref_body_rots\"][:,0].cpu().numpy(),1,axis=-1),\n            obs_dict[\"dof_pos\"].cpu().numpy()\n        ], axis=-1)\n\n        # import ipdb; ipdb.set_trace()\n\n        z = tracking_inference(tree_map(lambda x: x[1:], obs))\n        output_dir.mkdir(parents=True, exist_ok=True)\n        joblib.dump(z.cpu().numpy(), output_dir / f\"zs_{MOTION_ID}.pkl\")\n        print(f\"Saved zs_{MOTION_ID}.pkl\")\n        \n        observation, info = wrapped_env.reset(to_numpy=False)\n\n        # Root state: pos(3) + quat(4) + lin_vel(3) + ang_vel(3). Isaac expects quat as wxyz; motion lib uses xyzw.\n        ref_body_rots = obs_dict[\"ref_body_rots\"][0, 0].clone()\n        if simulator == \"isaacsim\":\n            ref_body_rots = ref_body_rots[[3, 0, 1, 2]]  # xyzw -> wxyz for correct humanoid facing in Isaac\n        ref_root_init_state = torch.cat(\n                [\n                    obs_dict[\"ref_body_pos\"][0, 0],\n                    ref_body_rots,\n                    obs_dict[\"ref_body_vels\"][0, 0],\n                    obs_dict[\"ref_body_angular_vels\"][0, 0],\n                ]\n            )\n        dof_init_state = torch.zeros_like(wrapped_env._env.simulator.dof_state.view(num_envs, -1, 2)[0])\n        dof_init_state[..., 0] = obs_dict[\"dof_pos\"][0]\n        dof_init_state[..., 1] = obs_dict[\"ref_dof_vel\"][0]\n        target_states = {\n            \"dof_states\": dof_init_state,\n            \"root_states\": torch.stack([ref_root_init_state.clone() for i in range(num_envs)])\n        }\n        env_ids = torch.arange(num_envs, dtype=torch.long)\n        observation, info = wrapped_env._env.reset_envs_idx(env_ids, target_states=target_states)\n        # refresh_env_ids = wrapped_env._env.need_to_refresh_envs.nonzero(as_tuple=False).flatten()\n        # wrapped_env._env.simulator.set_actor_root_state_tensor(refresh_env_ids, wrapped_env._env.target_robot_root_states)\n        # wrapped_env._env.simulator.set_dof_state_tensor(refresh_env_ids, wrapped_env._env.target_robot_dof_state)\n        # wrapped_env._env.need_to_refresh_envs[refresh_env_ids] = False\n        observation_new, reward, terminated, truncated, info = wrapped_env.step(torch.zeros((num_envs, wrapped_env.action_space.shape[-1]), dtype=torch.float32), to_numpy=False)\n        observation = wrapped_env._get_g1env_observation(to_numpy=False)\n        qpos, qvel = wrapped_env._get_qpos_qvel(to_numpy=True)\n        assert np.allclose(wrapped_env._env.simulator.dof_pos.clone().cpu(), expert_qpos[0,7:])\n        joint_pos = [wrapped_env._env.simulator.dof_state[..., 0].clone().cpu().numpy()]\n\n        # Visualization length: match inference length so expert and policy videos align\n        episode_len = z.shape[0]\n        print(f\"Saving video for tracking ({episode_len} steps)\")\n        if save_mp4:\n            rgb_renderer = IsaacRendererWithMuJoco(render_size=256)\n            # Only render 1 + episode_len frames (same as frames list), not the full motion\n            expert_video = rgb_renderer.from_qpos(expert_qpos[: 1 + episode_len])\n            frames = [rgb_renderer.render(wrapped_env._env, 0)[0]]\n\n        print(f\"Running tracking inference for {episode_len} steps\")\n        for i in range(episode_len):\n            print(f\"Step {i} of {episode_len}\")\n            action = model.act(observation, z[i % len(z)].repeat(num_envs, 1), mean=True)\n            observation, reward, terminated, truncated, info = wrapped_env.step(action, to_numpy=False)\n            joint_pos.append(wrapped_env._env.simulator.dof_state[..., 0].clone().cpu().numpy())\n            if save_mp4:\n                frames.append(rgb_renderer.render(wrapped_env._env, 0)[0])\n\n        joint_pos = np.stack(joint_pos, axis=0).squeeze(1)\n        stats = {}\n    \n        # breakpoint()  # use PYTHONBREAKPOINT=0 to disable, or install ipdb for a nicer debugger\n\n        if save_mp4:\n            new_frames = []\n            for a, b in zip(expert_video, frames):\n                new_frames.append(np.concatenate([a, b], axis=1))\n            video_path = output_dir / (\"tracking.mp4\" if len(motion_list) == 1 else f\"tracking_{MOTION_ID}.mp4\")\n            media.write_video(str(video_path), new_frames, fps=50)\n            print(f\"Saved video for tracking: {video_path}\")\n\n\nif __name__ == \"__main__\":\n    import tyro\n\n    tyro.cli(main)\n", "humanoidverse/goal_inference.py": "import os\n\nos.environ[\"MUJOCO_GL\"] = \"egl\"  # Use EGL for rendering\nos.environ[\"OMP_NUM_THREADS\"] = \"1\"\nfrom pathlib import Path\nimport json\nimport torch\nimport joblib\nimport mediapy as media\nimport numpy as np\nfrom torch.utils._pytree import tree_map\nfrom tqdm import tqdm\n\nimport humanoidverse\nfrom humanoidverse.agents.load_utils import load_model_from_checkpoint_dir\nfrom humanoidverse.agents.envs.humanoidverse_isaac import HumanoidVerseIsaacConfig, IsaacRendererWithMuJoco\nfrom humanoidverse.utils.helpers import export_meta_policy_as_onnx\nfrom humanoidverse.utils.helpers import get_backward_observation\n\n# Resolve humanoidverse root directory\nif getattr(humanoidverse, \"__file__\", None) is not None:\n    HUMANOIDVERSE_DIR = Path(humanoidverse.__file__).parent\nelse:\n    HUMANOIDVERSE_DIR = Path(__file__).parent.parent.parent\n\n\ndef main(model_folder: Path, data_path: Path | None = None, headless: bool = True, device=\"cuda\", simulator: str = \"isaacsim\", save_mp4: bool=False, disable_dr: bool = False, disable_obs_noise: bool = False, episode_len: int = 500, video_folder: str | None = None):\n\n    model_folder = Path(model_folder)\n    video_folder = Path(video_folder) if video_folder is not None else model_folder / \"goal_inference\" / \"videos\"\n    video_folder.mkdir(parents=True, exist_ok=True)\n\n    model = load_model_from_checkpoint_dir(model_folder / \"checkpoint\", device=device)\n    model.to(device)\n    model.eval()\n    model_name = \"model\"\n    model_name = model.__class__.__name__\n    with open(model_folder / \"config.json\", \"r\") as f:\n        config = json.load(f)\n\n    u l_json_paths:\n        if path.exists():\n            goal_json = str(path)\n            break\n    \n    if goal_json is None:\n        raise FileNotFoundError(\n            f\"Could not find goal_frames_lafan29dof.json. Searched in: {goal_json_paths}\"\n        )\n    \n    with open(goal_json, \"r\") as f:\n        goals_to_evaluate = json.load(f)\n    pbar = tqdm(goals_to_evaluate, leave=False, disable=False)\n    z_dict = {}\n    with torch.no_grad():\n        for goal in pbar:\n            env.set_is_evaluating(goal[\"motion_id\"])\n                # we visulize the first env\n            gobs, gobs_dict = get_backward_observation(env, 0, use_root_height_obs=use_root_height_obs, velocity_multiplier=0)\n            num_frames = next(iter(gobs.values())).shape[0]\n            frame_pbar = tqdm(goal[\"frames\"], leave=False, disable=False, desc=\"frames\")\n            for frame_idx in frame_pbar:\n                if frame_idx >= num_frames:\n                    pbar.write(f\"  Skipping frame_idx {frame_idx} (motion has {num_frames} frames)\")\n                    continue\n                goal_name = f\"{goal['motion_name']}_{frame_idx}\"\n                goal_observation = {k: v[frame_idx][None,...] for k,v in gobs.items()}\n                goal_observation = tree_map(lambda x: torch.tensor(x, device=model.device, dtype=torch.float32), goal_observation)\n\n                z_dict[goal_name] = model.goal_inference(goal_observation).cpu().numpy()\n    path = model_folder / \"goal_inference\"\n    path.mkdir(exist_ok=True)\n    with open(os.path.join(path, \"goal_reaching.pkl\"), \"wb\") as f:\n        joblib.dump(z_dict, f)\n\n    if save_mp4:\n        rgb_renderer = IsaacRendererWithMuJoco(render_size=256)\n\n    observation, info = wrapped_env.reset(to_numpy=False)\n    observation, info = wrapped_env.reset(to_numpy=False)\n    observation, info = wrapped_env.reset(to_numpy=False)\n    observation, info = wrapped_env.reset(to_numpy=False)\n\n    frames = []\n ,\n        \"move-arms--90-0.7-l-l\",\n\n        # spin + arms\n        \"spin-arms-5-l-l\",\n        \"spin-arms--5-l-l\",\n        \"spin-arms-5-l-m\",\n        \"spin-arms--5-l-m\",\n        # \"spin-arms-5-m-m\",\n        # \"spin-arms--5-m-m\",\n        \"spin-arms-5-m-l\",\n        \"spin-arms--5-m-l\",\n\n        # sit\n        \"crouch-0\",\n        \"crouch-0.25\",\n        \"sitonground\",\n    ]\n\n    print(\"Loading the replay buffer...\", end=\" \", flush=True)\n    start_t = time.time()\n    buffer_path = model_folder / \"checkpoint/buffers/train_reduced\"\n    if buffer_path.is_dir():\n        # Load reduced buffer if that exists\n        dataset = DictBuffer.load(buffer_path, device=\"cpu\")\n        print(\"Loaded reduced buffer\")\n    else:\n        # Try loading the original dataset\n        buffer_path = model_folder / \"checkpoint/buffers/train\"\n        dataset = TrajectoryDictBufferMultiDim.load(buffer_path, device=\"cpu\")\n        print(\"Loaded original buffer\")\n    # dataset = fast_load_buffer(model_folder / \"checkpoint/buffers/train\", device=\"cpu\")\n    print(f\"done in {time.time()-start_t}s\")\n    inference_function = \"reward_wr_inference\"\n    reward_eval_agent = RewardWrapperHV(\n        model=model,\n        inference_dataset=dataset,\n        num_samples_per_inference=num_samples,\n        inference_function=inference_function,\n        max_workers=24,\n        process_executor=True,\n        env_model=str(HUMANOIDVERSE_DIR / \"data\" / \"robots\" / \"g1\" / \"scene_29dof_freebase_noadditional_actuators.xml\"),\n    )\n    z_dict = {}\n    for r in range(n_inferences):\n        for task in tasks:\n            print(f\"Started inference for {task}...\", end=\" \", flush=True)\n            start_t = time.time()\n            z = reward_eval_agent.reward_inference(task=task)\n            z_dict[task] = z_dict.get(task, []) + [z.cpu()]\n            print(f\"done in {time.time()-start_t}s\")\n\n            path = model_folder / \"reward_inference\"\n            path.mkdir(exist_ok=True)\n            with open(os.path.join(path, \"reward_locomotion.pkl\"), \"wb\") as f:\n                joblib.dump(z_dict, f)\n            print(f\"Saved file at {path}/reward_locomotion.pkl\")\n\n    # z_dict = joblib.load(model_folder / \"reward_inference/reward_locomotion.pkl\")\n\n    if not skip_rollouts:\n        print(\"Generating videos...\")\n        if save_mp4:\n            rgb_renderer = IsaacRendererWithMuJoco(render_size=256)\n        for task in tasks:\n            frames = []\n            for z in z_dict[task]:\n                z = z.repeat(num_envs, 1).to(device)\n                \n                observation, info = wrapped_env.reset(to_numpy=False, reset_to_default_pose=True)\n                if save_mp4:\n                    frames.append(rgb_renderer.render(wrapped_env._env, 0)[0])\n                for i in range(episode_length):\n                    action = model.act(observation, z, mean=True)\n                    observation, reward, terminated, truncated, info = wrapped_env.step(action, to_numpy=False)\n\n                    if save_mp4:\n                        frames.append(rgb_renderer.render(wrapped_env._env, 0)[0])\n            if save_mp4:\n                file = video_folder / f\"{task}.mp4\"\n                media.write_video(file, frames, fps=50)\n                print(f\"Saved video for {task}: {file}\")\n\n\nif __name__ == \"__main__\":\n    import tyro\n\n    tyro.cli(main)\n", "experiments/train.py": "\"\"\"A small, validated CLI around the repository's actual training recipe.\n\nRun from the repository root: python -m experiments.train --help\n\"\"\"\nfrom __future__ import annotations\n\nimport argparse\nimport copy\nimport fcntl\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport subprocess\nimport sys\nfrom datetime import datetime, timezone\n\nROOT = Path(__file__).resolve().parents[1]\nSECRET_FIELD = re.compile(r\"(?:api[_-]?key|password|passwd|secret|credential|access[_-]?token|auth[_-]?token|private[_-]?key)\", re.I)\n\n\ndef reject_secrets(value):\n    if isinstance(value, dict):\n        for key, child in value.items():\n            if SECRET_FIELD.search(key):\n                raise ValueError(\"Credentials belong in the process environment or an external credential store, never experiment config.\")\n            reject_secrets(child)\n    elif isinstance(value, list):\n        for child in value:\n            reject_secrets(child)\n\n\ndef merge(base, patch):\n    \"\"\"Merge dictionaries; replace lists and scalars. Schema validation follows.\"\"\"\n    result = copy.deepcopy(base)\n    for key, value in patch.items():\n        result[key] = merge(result[key], value) if isinstance(value, dict) and isinstance(result.get(key), dict) else copy.deepcopy(value)\n    return result\n\n\ndef set_field(config, expression):\n    key, sep, raw = expression.partition(\"=\")\n    if not sep:\n        raise ValueError(\"--set requires dotted.path=JSON_VALUE (strings may be unquoted).\")\n    parts = key.split(\".\")\n    target = config\n    for part in parts[:-1]:\n        if not isinstance(target, dict) or part not in target:\n            raise ValueError(f\"Unknown configuration path: {key}\")\n        target = target[part]\n    if not isinstance(target, dict) or parts[-1] not in target:\n        raise ValueError(f\"Unknown configuration path: {key}\")\n    try:\n        value = json.loads(raw)\n    except json.JSONDecodeError:\n        value = raw\n    reject_secrets({key: value})\n    target[parts[-1]] = value\n\n\ndef parser():\n    p = argparse.ArgumentParser(description=__doc__)\n    p.add_argument(\"--preset\", choices=[\"smoke\", \"pilot\", \"reference\"], default=\"smoke\")\n    p.add_argument(\"--config\", type=Path, action=\"append\", default=[], help=\"JSON override file; repeatable, applied in order\")\n    p.add_argument(\"--set\", dest=\"overrides\", action=\"append\", default=[], metavar=\"PATH=VALUE\")\n    p.add_argument(\"--hydra\", action=\"append\", default=[], help=\"Replace/append an environment Hydra override by key\")\n    p.add_argument(\"--seed\", type=int, default=None, help=\"Default 4728; resume preserves the saved seed\")\n    p.add_argument(\"--work-dir\", type=Path, required=True, help=\"Unique run directory; reuse only with --resume\")\n    p.add_argument(\"--data-path\", type=Path, default=None)\n    p.add_argument(\"--wandb-mode\", choices=[\"online\", \"offline\", \"disabled\"], default=os.environ.get(\"WANDB_MODE\", \"offline\"))\n    p.add_argument(\"--entity\", default=os.environ.get(\"WANDB_ENTITY\") or \"glen-berseth\")\n    p.add_argument(\"--project\", default=os.environ.get(\"WANDB_PROJECT\", \"bfm-zero\"))\n    p.add_argument(\"--group\", default=None)\n    p.add_argument(\"--resume\", action=\"store_true\", help=\"Load saved config and continue the same checkpoint\")\n    p.add_argument(\"--print-config\", action=\"store_true\", help=\"Validate and print config without creating a simulator or run\")\n    return p\n\n\ndef resolve_config(args):\n    # Importing TrainConfig does not boot Isaac; only .build() does.\n    from humanoidverse.train import TrainConfig, default_train_config\n\n    work_dir = args.work_dir.expanduser().resolve()\n    if args.resume:\n        config = json.loads((work_dir / \"config.json\").read_text())\n    else:\n        config = default_train_config().model_dump(mode=\"json\")\n        config = merge(config, json.loads((ROOT / \"experiments\" / \"presets\" / f\"{args.preset}.json\").read_text()))\n    for path in args.config:\n        patch = json.loads(path.read_text())\n        if not isinstance(patch, dict):\n            raise ValueError(\"Override config must be a JSON object.\")\n        config = merge(config, patch)\n    if args.data_path:\n        config[\"env\"][\"lafan_tail_path\"] = str(args.data_path.expanduser().resolve())\n    for expression in args.overrides:\n        set_field(config, expression)\n    if args.seed is not None:\n        config[\"seed\"] = args.seed\n    # CLI operational flags are authoritative, including during resume.\n    config.update(work_dir=str(work_dir), use_wandb=args.wandb_mode != \"disabled\",\n                  wandb_ename=args.entity, wandb_pname=args.project,\n                  wandb_gname=args.group or (config[\"wandb_gname\"] if args.resume else args.preset))\n    hydra = config[\"env\"][\"hydra_overrides\"]\n    for expression in args.hydra:\n        if \"=\" not in expression:\n            raise ValueError(\"--hydra requires key=value\")\n        key = expression.split(\"=\", 1)[0]\n        reject_secrets({key: None})\n        hydra[:] = [old for old in hydra if old.split(\"=\", 1)[0] != key]\n        hydra.append(expression)\n    reject_secrets(config)\n    cfg = TrainConfig.model_validate(config)\n    validate_schedule(cfg)\n    return cfg\n\n\ndef validate_schedule(cfg):\n    n = cfg.online_parallel_envs\n    if n \u003c= 0 or cfg.num_agent_updates \u003c= 0:\n        raise ValueError(\"Environment and update counts must be positive.\")\n    for key in (\"num_env_steps\", \"update_agent_every\", \"log_every_updates\", \"checkpoint_every_steps\", \"eval_every_steps\", \"buffer_size\"):\n        if getattr(cfg, key) \u003c= 0 or getattr(cfg, key) % n:\n            raise ValueError(f\"{key} must be a positive multiple of online_parallel_envs={n}.\")\n    if cfg.num_seed_steps \u003c 0 or cfg.num_seed_steps % n or cfg.num_seed_steps >= cfg.num_env_steps:\n        raise ValueError(\"num_seed_steps must be a nonnegative environment-count multiple below num_env_steps.\")\n    if cfg.agent.train.batch_size \u003c 2 or cfg.agent.train.batch_size % cfg.agent.model.seq_length:\n        raise ValueError(\"batch_size must be >=2 and divisible by model.seq_length.\")\n    if cfg.buffer_size // n \u003c cfg.agent.model.seq_length + 1:\n        raise ValueError(\"Replay must contain more time steps per environment than seq_length.\")\n    if not 0 \u003c= cfg.agent.train.train_goal_ratio + cfg.agent.train.expert_asm_ratio \u003c= 1:\n        raise ValueError(\"Goal and expert latent mixture probabilities must sum to \u003c=1.\")\n    if not cfg.use_trajectory_buffer or not cfg.checkpoint_buffer:\n        raise ValueError(\"This launcher keeps trajectory replay checkpointing for resume and reward inference.\")\n\n\ndef check_data(path):\n    path = Path(path)\n    if not path.is_file():\n        raise ValueError(f\"Motion data missing: {path}. Run git lfs pull or pass --data-path.\")\n    with path.open(\"rb\") as stream:\n        if stream.read(128).startswith(b\"version https://git-lfs.github.com/spec/\"):\n            raise ValueError(f\"Motion data is an LFS pointer: {path}. Run git lfs pull.\")\n\n\ndef git_output(*args):\n    return subprocess.check_output([\"git\", \"-C\", str(ROOT), *args], text=True).strip()\n\n\ndef file_hash(path):\n    digest = hashlib.sha256()\n    with Path(path).open(\"rb\") as stream:\n        for block in iter(lambda: stream.read(1024 * 1024), b\"\"):\n            digest.update(block)\n    return digest.hexdigest()\n\n\ndef run(args, cfg):\n    import torch\n    from humanoidverse.train import checkpoint_path, validate_resume_config\n\n    check_data(cfg.env.lafan_tail_path)\n    if not torch.cuda.is_available():\n        raise RuntimeError(\"Isaac training requires a working NVIDIA GPU/driver. Use --print-config for CPU-only validation.\")\n    # Replay indexing also uses torch.compile, independently of agent.compile.\n    # Fail before expensive environment setup/evaluation if compilation is broken.\n    from experiments.preflight import check_compile_toolchain\n    check_compile_toolchain()\n    work = Path(cfg.work_dir)\n    work.mkdir(parents=True, exist_ok=True)\n    # A file lock also prevents two Slurm jobs sharing a resume directory.\n    with (work / \".launch.lock\").open(\"w\") as lock:\n        fcntl.flock(lock, fcntl.LOCK_EX | fcntl.LOCK_NB)\n        cp = checkpoint_path(work)\n        if args.resume:\n            if not (cp / \"buffers\" / \"train\").is_dir():\n                raise ValueError(\"Resume requires the saved replay buffer and checkpoint in this work directory.\")\n            validate_resume_config(work, cfg)\n        elif (work / \"config.json\").exists() or (work / \"launch.json\").exists() or cp.exists():\n            raise ValueError(\"Run directory already contains a run. Choose a new directory or use --resume.\")\n\n        os.environ[\"WANDB_MODE\"] = args.wandb_mode\n        os.environ[\"WANDB_DISABLE_CODE\"] = \"true\"\n        os.environ[\"WANDB_DISABLE_GIT\"] = \"true\"\n        run_id = work / \"wandb-run-id.txt\"\n        if not run_id.exists():\n            import uuid\n            run_id.write_text(uuid.uuid4().hex[:8] + \"\\n\")\n        os.environ[\"WANDB_RUN_ID\"] = run_id.read_text().strip()\n        if args.wandb_mode == \"online\":\n            os.environ[\"WANDB_RESUME\"] = \"allow\"\n        else:\n            # Offline segments are separate files. W\u0026B does not support offline resume.\n            os.environ.pop(\"WANDB_RESUME\", None)\n\n        stamp = datetime.now(timezone.utc).strftime(\"%Y%m%dT%H%M%S%fZ\")\n        manifest = {\n            \"created_utc\": stamp, \"git_commit\": git_output(\"rev-parse\", \"HEAD\"),\n            \"git_dirty\": bool(git_output(\"status\", \"--porcelain\")),\n            \"config\": cfg.model_dump(mode=\"json\"), \"torch\": torch.__version__,\n            \"python\": sys.version.split()[0], \"cuda\": torch.version.cuda,\n            \"gpu\": torch.cuda.get_device_name(0), \"wandb_mode\": args.wandb_mode,\n            \"lock_sha256\": file_hash(ROOT / \"uv.lock\"),\n            \"image_sha256\": os.environ.get(\"BFM_IMAGE_SHA256\"),\n            \"data_sha256\": file_hash(cfg.env.lafan_tail_path),\n        }\n        (work / \"launches\").mkdir(exist_ok=True)\n        serialized = json.dumps(manifest, indent=2)\n        (work / \"launches\" / f\"{stamp}.json\").write_text(serialized)\n        if not args.resume:\n            (work / \"launch.json\").write_text(serialized)\n        print(f\"Run: {work}\\nW\u0026B mode: {args.wandb_mode}\", flush=True)\n        exit_code = 0\n        try:\n            cfg.build().train()\n        except BaseException:\n            exit_code = 1\n            raise\n        finally:\n            if cfg.use_wandb:\n                import wandb\n                wandb.finish(exit_code=exit_code)\n\n\ndef main(argv=None):\n    args = parser().parse_args(argv)\n    if Path.cwd().resolve() != ROOT:\n        raise SystemExit(\"Run from the BFM-Zero repository root (python -m experiments.train ...).\")\n    cfg = resolve_config(args)\n    if args.print_config:\n        print(cfg.model_dump_json(indent=2))\n    else:\n        run(args, cfg)\n\n\ndef cli():\n    try:\n        main()\n    except Exception:\n        # Isaac shutdown hooks can replace an unhandled Python failure with\n        # exit code 0. Report the exception and preserve failure for Slurm.\n        import traceback\n        traceback.print_exc()\n        sys.stdout.flush()\n        sys.stderr.flush()\n        os._exit(1)\n\n\nif __name__ == \"__main__\":\n    cli()\n", "experiments/evaluate.py": "\"\"\"Run the native tracking evaluator on a saved model and write numeric results.\n\nThe released native evaluator and tracking video script use one-frame prompts;\nthe model's generic tracking_inference method uses seq_length instead.\n\"\"\"\nfrom __future__ import annotations\n\nimport argparse\nimport json\nfrom pathlib import Path\nfrom datetime import datetime, timezone\n\n\ndef main(argv=None):\n    p = argparse.ArgumentParser(description=__doc__)\n    p.add_argument(\"--model-folder\", type=Path, required=True)\n    p.add_argument(\"--data-path\", type=Path, required=True)\n    p.add_argument(\"--num-envs\", type=int, default=32)\n    p.add_argument(\"--episodes-per-motion\", type=int, default=1)\n    p.add_argument(\"--seed\", type=int, default=0)\n    p.add_argument(\"--simulator\", choices=[\"isaacsim\", \"mujoco\"], default=\"isaacsim\")\n    p.add_argument(\"--disable-dr\", action=\"store_true\")\n    p.add_argument(\"--disable-obs-noise\", action=\"store_true\")\n    p.add_argument(\"--device\", default=\"cuda\")\n    args = p.parse_args(argv)\n    if args.num_envs \u003c 1 or args.episodes_per_motion \u003c 1:\n        p.error(\"Environment and episode counts must be positive.\")\n\n    from experiments.train import check_data, file_hash\n    from humanoidverse.agents.load_utils import load_model_from_checkpoint_dir\n    from humanoidverse.agents.envs.humanoidverse_isaac import HumanoidVerseIsaacConfig\n    from humanoidverse.agents.evaluations.humanoidverse_isaac import HumanoidVerseIsaacTrackingEvaluationConfig\n    from humanoidverse.agents.utils import set_seed_everywhere\n\n    check_data(args.data_path)\n    set_seed_everywhere(args.seed)\n    model_folder = args.model_folder.resolve()\n    config = json.loads((model_folder / \"config.json\").read_text())\n    env_config = config[\"env\"]\n    overrides = [v for v in env_config[\"hydra_overrides\"] if v.split(\"=\")[0] not in (\"simulator\", \"env.config.headless\")]\n    overrides += [f\"simulator={args.simulator}\", \"env.config.headless=True\"]\n    env_config.update(lafan_tail_path=str(args.data_path.resolve()), enable_cameras=False,\n                      disable_domain_randomization=args.disable_dr, disable_obs_noise=args.disable_obs_noise,\n                      hydra_overrides=overrides)\n    env_config[\"device\"] = \"cuda:0\" if args.device == \"cuda\" else args.device\n    model = load_model_from_checkpoint_dir(model_folder / \"checkpoint\", device=args.device)\n    model.eval()\n    env, _ = HumanoidVerseIsaacConfig.model_validate(env_config).build(args.num_envs)\n    try:\n        evaluation = HumanoidVerseIsaacTrackingEvaluationConfig(n_episodes_per_motion=args.episodes_per_motion).build()\n        # extract_model accepts the actual BaseModel directly.\n        metrics, aggregate = evaluation.run(timestep=0, agent_or_model=model, replay_buffer=None, logger=None, env=env)\n        report = {\"protocol\": \"native_tracking\", \"seed\": args.seed, \"simulator\": args.simulator,\n                  \"num_envs\": args.num_envs, \"episodes_per_motion\": args.episodes_per_motion,\n                  \"disable_dr\": args.disable_dr, \"disable_obs_noise\": args.disable_obs_noise,\n                  \"lookahead_frames\": 1,\n                  \"data_sha256\": file_hash(args.data_path), \"metrics\": metrics, \"aggregate\": aggregate}\n        output = model_folder / \"evaluations\"\n        output.mkdir(exist_ok=True)\n        stamp = datetime.now(timezone.utc).strftime(\"%Y%m%dT%H%M%S%fZ\")\n        result = output / f\"tracking-{args.simulator}-seed{args.seed}-{stamp}.json\"\n        # Native metrics contain numpy scalar values.\n        result.write_text(json.dumps(report, indent=2, default=lambda value: value.item()))\n        print(f\"Saved: {result}\\n{json.dumps(aggregate, indent=2, default=lambda value: value.item())}\")\n    finally:\n        env.close()\n\n\nif __name__ == \"__main__\":\n    main()\n", "experiments/preflight.py": "\"\"\"Inspect runtime readiness without reading or printing credentials.\"\"\"\nfrom __future__ import annotations\n\nimport argparse\nimport importlib.metadata\nimport importlib.util\nimport json\nfrom pathlib import Path\nimport platform\nimport shutil\nimport sys\nimport sysconfig\n\n\ndef check_compile_toolchain():\n    \"\"\"Exercise the C++ and, when available, CUDA forward/backward compilers.\"\"\"\n    header = Path(sysconfig.get_path(\"include\")) / \"Python.h\"\n    if not header.is_file():\n        raise RuntimeError(f\"Missing {header}. Rebuild the container with python3.10-dev.\")\n    if not (shutil.which(\"c++\") or shutil.which(\"g++\")):\n        raise RuntimeError(\"Missing C++ compiler. Rebuild the container with build-essential.\")\n    import torch\n\n    compiled = torch.compile(lambda x: x.sin() + x * 2, fullgraph=True)\n    devices = [\"cpu\"] + ([\"cuda\"] if torch.cuda.is_available() else [])\n    for device in devices:\n        x = torch.linspace(-1, 1, 16, device=device, requires_grad=True)\n        y = compiled(x)\n        torch.testing.assert_close(y, x.sin() + x * 2)\n        (grad,) = torch.autograd.grad(y.sum(), x)\n        torch.testing.assert_close(grad, x.cos() + 2)\n        print(f\"torch.compile forward/backward passed: {device}\", flush=True)\n\n\ndef main(argv=None):\n    p = argparse.ArgumentParser(description=__doc__)\n    p.add_argument(\"--require-gpu\", action=\"store_true\")\n    p.add_argument(\"--boot-isaac\", action=\"store_true\", help=\"Boot a headless SimulationApp; requires NVIDIA GPU\")\n    p.add_argument(\"--check-compile\", action=\"store_true\", help=\"Compile and run small CPU/CUDA forward/backward kernels\")\n    p.add_argument(\"--data-dir\", type=Path, default=None)\n    args = p.parse_args(argv)\n    report = {\"python\": platform.python_version(), \"packages\": {}, \"commands\": {}}\n    report[\"python_header\"] = str(Path(sysconfig.get_path(\"include\")) / \"Python.h\")\n    report[\"python_header_exists\"] = Path(report[\"python_header\"]).is_file()\n    for package in (\"torch\", \"isaacsim\", \"isaaclab\", \"wandb\", \"mujoco\", \"pydantic\", \"humenv\"):\n        try:\n            report[\"packages\"][package] = importlib.metadata.version(package)\n        except importlib.metadata.PackageNotFoundError:\n            report[\"packages\"][package] = None\n    for command in (\"uv\", \"cluv\", \"apptainer\", \"nvidia-smi\", \"ffmpeg\", \"git-lfs\"):\n        report[\"commands\"][command] = bool(shutil.which(command))\n    root = Path(__file__).resolve().parents[1]\n    data_dir = args.data_dir or root / \"humanoidverse\" / \"data\"\n    report[\"data\"] = {}\n    for name in (\"lafan_29dof.pkl\", \"lafan_29dof_10s-clipped.pkl\"):\n        path = data_dir / name\n        pointer = False\n        if path.is_file():\n            with path.open(\"rb\") as stream:\n                pointer = stream.read(128).startswith(b\"version https://git-lfs.github.com/spec/\")\n        report[\"data\"][name] = {\"exists\": path.is_file(), \"bytes\": path.stat().st_size if path.is_file() else 0, \"lfs_pointer\": pointer}\n    gpu = False\n    if importlib.util.find_spec(\"torch\"):\n        import torch\n        gpu = torch.cuda.is_available()\n        report[\"cuda_available\"] = gpu\n        report[\"cuda_build\"] = torch.version.cuda\n        if gpu:\n            report[\"gpu\"] = torch.cuda.get_device_name(0)\n            report[\"gpu_memory_gib\"] = round(torch.cuda.get_device_properties(0).total_memory / 2**30, 2)\n    print(json.dumps(report, indent=2), flush=True)\n    if (args.require_gpu or args.boot_isaac) and not gpu:\n        raise SystemExit(\"GPU unavailable. Configuration inspection and CPU tests can still run.\")\n    if args.check_compile:\n        check_compile_toolchain()\n    if args.boot_isaac:\n        from humanoidverse.agents.envs.humanoidverse_isaac import instantiate_isaac_sim\n        instantiate_isaac_sim(num_envs=1, headless=True)\n        print(\"Headless Isaac startup passed. Next run the actual smoke preset.\", flush=True)\n\n\nif __name__ == \"__main__\":\n    main()\n", "experiments/log_videos.py": "\"\"\"Upload locally generated videos to a separate W\u0026B evaluation run (explicit opt-in).\"\"\"\nfrom __future__ import annotations\n\nimport argparse\nimport os\nfrom pathlib import Path\n\n\ndef main(argv=None):\n    p = argparse.ArgumentParser(description=__doc__)\n    p.add_argument(\"--model-folder\", type=Path, required=True)\n    p.add_argument(\"--entity\", default=os.environ.get(\"WANDB_ENTITY\", \"glen-berseth\"))\n    p.add_argument(\"--project\", default=os.environ.get(\"WANDB_PROJECT\", \"bfm-zero\"))\n    p.add_argument(\"--group\", default=\"evaluation-videos\")\n    p.add_argument(\"--wandb-mode\", choices=[\"online\", \"offline\"], default=\"offline\")\n    args = p.parse_args(argv)\n    model = args.model_folder.resolve()\n    videos = sorted(p for folder in (\"tracking_inference\", \"goal_inference\", \"reward_inference\") for p in (model / folder).rglob(\"*.mp4\"))\n    if not videos:\n        p.error(\"No inference MP4 files found. Generate videos with the native scripts first.\")\n    import wandb\n    os.environ[\"WANDB_DISABLE_CODE\"] = \"true\"\n    os.environ[\"WANDB_DISABLE_GIT\"] = \"true\"\n    directory = model / \"_wandb_videos\"\n    directory.mkdir(exist_ok=True)\n    with wandb.init(entity=args.entity, project=args.project, group=args.group, name=f\"videos-{model.name}\",\n                    job_type=\"evaluation\", mode=args.wandb_mode, dir=str(directory)):\n        for video in videos:\n            wandb.log({str(video.relative_to(model)): wandb.Video(str(video), format=\"mp4\", fps=50)})\n    print(f\"Logged {len(videos)} videos ({args.wandb_mode}).\")\n\n\nif __name__ == \"__main__\":\n    main()\n", "cluster/pyproject.toml": "# Run cluv from this directory. It syncs the whole Git repository, but runs\n# uv sync only for this tiny Python 3.11 control project, not the Isaac stack.\n[project]\nname = \"bfm-zero-cluster\"\nversion = \"0.1.0\"\nrequires-python = \">=3.11\"\ndependencies = []\n\n[tool.uv]\npackage = false\n\n[tool.cluv]\nproject_dir = \"$HOME/Documents/bfm/BFM-Zero/cluster\"\nresults_path = \"$SCRATCH/bfm-zero/output\"\nresults_symlink = \"output\"\njob_script_path = \"job.sh\"\n\n[tool.cluv.env]\nBFM_CODE_DIR = \"$HOME/Documents/bfm/BFM-Zero\"\nBFM_SIF = \"$SCRATCH/bfm-zero/containers/bfm-zero-wandb-dev.sif\"\nBFM_DATA_DIR = \"$SCRATCH/bfm-zero/data\"\nBFM_OUTPUT_DIR = \"$SCRATCH/bfm-zero/output\"\nWANDB_PROJECT = \"bfm-zero\"\nWANDB_ENTITY = \"glen-berseth\"\nWANDB_MODE = \"online\"\nWANDB_BASE_URL = \"https://api.forge.coreweave.com\"\n\n[tool.cluv.sbatch_args]\ntime = \"2-00:00:00\"\nmem = \"128G\"\ncpus-per-task = 8\nntasks = 1\ngres = \"gpu:l40s:1\"\n\n# Allocation names copied from SceneGMT; verify your allocation is still valid.\n# These are templates, not a claim of GPU/driver compatibility on every cluster.\n[tool.cluv.clusters.mila.sbatch_args]\ngres = \"gpu:l40s:1\"\npartition = \"long\"\n\n[tool.cluv.clusters.narval.sbatch_args]\naccount = \"rrg-gberseth\"\n[tool.cluv.clusters.rorqual.sbatch_args]\naccount = \"rrg-gberseth\"\n[tool.cluv.clusters.fir.sbatch_args]\naccount = \"def-gberseth\"\n[tool.cluv.clusters.nibi.sbatch_args]\naccount = \"def-gberseth\"\n[tool.cluv.clusters.trillium.sbatch_args]\naccount = \"def-gberseth\"\n[tool.cluv.clusters.tamia.sbatch_args]\naccount = \"aip-gberseth\"\n[tool.cluv.clusters.killarney.sbatch_args]\naccount = \"aip-gberseth\"\n[tool.cluv.clusters.vulcan.sbatch_args]\naccount = \"aip-gberseth\"\n", "cluster/job.sh": "#!/usr/bin/env bash\n# cluv submit \u003ccluster> -- train --preset smoke\n# cluv submit \u003ccluster> -- eval --model-folder /scratch/.../run\n# Arguments after the mode are passed unchanged to the selected Python module.\nset -euo pipefail\numask 077\n\n# Bind the normal checkout directly; do not infer it from the job script path.\nREPO_ROOT=${BFM_CODE_DIR:-$HOME/Documents/bfm/BFM-Zero}\n[[ -f $REPO_ROOT/experiments/train.py ]] || {\n    echo \"Missing code checkout: $REPO_ROOT (set BFM_CODE_DIR).\" >\u00262; exit 1;\n}\nif [[ -z ${SLURM_JOB_ID:-} \u0026\u0026 ${BFM_ALLOW_LOCAL:-0} != 1 ]]; then\n    echo \"Run inside a Slurm allocation, or set BFM_ALLOW_LOCAL=1 for a workstation.\" >\u00262\n    exit 1\nfi\n: \"${SCRATCH:?SCRATCH must point to persistent storage}\"\nMODE=${1:-train}\nif (($#)); then shift; fi\ncase \"$MODE\" in\n    train) MODULE=experiments.train ;;\n    eval) MODULE=experiments.evaluate ;;\n    tracking) MODULE=humanoidverse.tracking_inference ;;\n    goal) MODULE=humanoidverse.goal_inference ;;\n    reward) MODULE=humanoidverse.reward_inference ;;\n    check) MODULE=experiments.preflight ;;\n    log-videos) MODULE=experiments.log_videos ;;\n    *) echo \"Mode must be train, eval, tracking, goal, reward, check, or log-videos.\" >\u00262; exit 2 ;;\nesac\n\nBFM_SIF=${BFM_SIF:-$SCRATCH/bfm-zero/containers/bfm-zero.sif}\nBFM_DATA_DIR=${BFM_DATA_DIR:-$SCRATCH/bfm-zero/data}\nBFM_OUTPUT_DIR=${BFM_OUTPUT_DIR:-$SCRATCH/bfm-zero/output}\n[[ -f $BFM_SIF ]] || { echo \"Missing image: $BFM_SIF (see apptainer/README.md)\" >\u00262; exit 1; }\n[[ -d $BFM_DATA_DIR ]] || { echo \"Missing data: $BFM_DATA_DIR\" >\u00262; exit 1; }\nif [[ -f $BFM_SIF.sha256 ]]; then\n    read -r image_sha image_name \u003c \"$BFM_SIF.sha256\"\n    [[ $image_sha =~ ^[a-f0-9]{64}$ ]] || { echo \"Invalid image checksum sidecar.\" >\u00262; exit 1; }\n    export APPTAINERENV_BFM_IMAGE_SHA256=\"$image_sha\" SINGULARITYENV_BFM_IMAGE_SHA256=\"$image_sha\"\nfi\n\nif ! command -v apptainer >/dev/null \u0026\u0026 ! command -v singularity >/dev/null; then\n    if type module >/dev/null 2>\u00261; then module load apptainer || module load singularity; fi\nfi\nif command -v apptainer >/dev/null; then ENGINE=apptainer; else ENGINE=singularity; fi\n\nJOB_KEY=${SLURM_ARRAY_JOB_ID:-${SLURM_JOB_ID:-local}}_${SLURM_ARRAY_TASK_ID:-0}\nJOB_BASE=$(mktemp -d \"${SLURM_TMPDIR:-${TMPDIR:-/tmp}}/bfm-${JOB_KEY}.XXXXXX\")\nmkdir -p \"$JOB_BASE/home\" \"$JOB_BASE/cache\" \"$JOB_BASE/mpl\" \"$BFM_OUTPUT_DIR\"\nBINDS=(--bind \"$REPO_ROOT:/workspace/bfm-zero:ro\"\n       --bind \"$SCRATCH:$SCRATCH\"\n       --bind \"$BFM_DATA_DIR:$BFM_DATA_DIR:ro\"\n       --bind \"$BFM_OUTPUT_DIR:$BFM_OUTPUT_DIR\"\n       --bind \"$JOB_BASE/cache:/home/bfm/.cache\"\n       --bind \"$JOB_BASE/mpl:/tmp/matplotlib\")\n# Read-only credential mount, outside the checkout, image and synced results.\nif [[ -f $HOME/.netrc ]]; then\n    touch \"$JOB_BASE/home/.netrc\"\n    BINDS+=(--bind \"$HOME/.netrc:/home/bfm/.netrc:ro\")\nfi\n# Pass values through environment, including an optional scheduler-injected key.\n# No credential value is placed in argv, config, launch metadata or output.\nfor key in WANDB_API_KEY WANDB_ENTITY WANDB_PROJECT WANDB_MODE WANDB_NAME WANDB_BASE_URL; do\n    if [[ -v $key ]]; then\n        export \"APPTAINERENV_${key}=${!key}\" \"SINGULARITYENV_${key}=${!key}\"\n    fi\ndone\nexport APPTAINERENV_MUJOCO_GL=egl SINGULARITYENV_MUJOCO_GL=egl\nexport APPTAINERENV_OMP_NUM_THREADS=1 SINGULARITYENV_OMP_NUM_THREADS=1\n\nARGS=(\"$@\")\nif [[ $MODE == train ]]; then\n    # Explicit flags override these defaults; arrays default to independent seeds.\n    ARGS=(--preset smoke --seed \"${SLURM_ARRAY_TASK_ID:-4728}\"\n          --work-dir \"$BFM_OUTPUT_DIR/runs/$JOB_KEY\"\n          --data-path \"$BFM_DATA_DIR/lafan_29dof_10s-clipped.pkl\" \"${ARGS[@]}\")\nelif [[ $MODE == eval || $MODE == tracking || $MODE == goal || $MODE == reward ]]; then\n    ARGS=(--data-path \"$BFM_DATA_DIR/lafan_29dof.pkl\" \"${ARGS[@]}\")\nelif [[ $MODE == check ]]; then\n    ARGS=(--data-dir \"$BFM_DATA_DIR\" \"${ARGS[@]}\")\nfi\necho \"Mode=$MODE code=$REPO_ROOT commit=$(git -C \"$REPO_ROOT\" rev-parse HEAD) job=$JOB_KEY\"\necho \"Temporary workspace=$JOB_BASE\"\n# Don't exec: after normal exit print the scratch path. Slurm removes SLURM_TMPDIR.\nset +e\n\"$ENGINE\" exec --nv --cleanenv --contain --home \"$JOB_BASE/home:/home/bfm\" \\\n    --pwd /workspace/bfm-zero \"${BINDS[@]}\" \"$BFM_SIF\" python -m \"$MODULE\" \"${ARGS[@]}\"\nSTATUS=$?\nset -e\necho \"Exit=$STATUS persistent results=$BFM_OUTPUT_DIR\"\nexit \"$STATUS\"\n", "cluster/cluv.sh": "#!/usr/bin/env bash\n# Use the current checkout of cluv with the already installed CLI's interpreter.\n# This avoids installing cluv (Python >=3.11) into BFM-Zero's Python 3.10 venv.\nset -euo pipefail\ncd \"$(dirname \"${BASH_SOURCE[0]}\")\"\nCLUV_SOURCE=${BFM_CLUV_SOURCE:-$HOME/Documents/cluv}\n[[ -f $CLUV_SOURCE/cluv/__main__.py ]] || { echo \"Set BFM_CLUV_SOURCE to your current cluv checkout.\" >\u00262; exit 1; }\nexport PYTHONPATH=\"$CLUV_SOURCE${PYTHONPATH:+:$PYTHONPATH}\"\nexec cluv \"$@\"\n", "cluster/submit.sh": "#!/usr/bin/env bash\n# Submit held, create cluv's Slurm log directory, then release the allocation.\n# Slurm must be able to open stdout before it can execute cluster/job.sh.\nset -euo pipefail\nHERE=$(cd \"$(dirname \"${BASH_SOURCE[0]}\")\" \u0026\u0026 pwd)\nCLUSTER=${1:?Usage: bash cluster/submit.sh \u003ccluster> [cluv submit arguments]}\nshift\n[[ $CLUSTER =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ \u0026\u0026 $CLUSTER != first ]] || {\n    echo \"Use one configured SSH cluster alias.\" >\u00262; exit 2;\n}\nJOB_SCRIPT=()\n# cluv expects the optional script before Slurm flags; otherwise its parser can\n# mistake the script path for a value belonging to --hold.\nif (($#)) \u0026\u0026 [[ $1 != -* \u0026\u0026 $1 == *.sh ]]; then\n    JOB_SCRIPT=(\"$1\")\n    shift\nfi\nKEEP_HELD=0\nfor arg in \"$@\"; do [[ $arg != --hold ]] || KEEP_HELD=1; done\nJOB_ID=$(bash \"$HERE/cluv.sh\" submit \"$CLUSTER\" \"${JOB_SCRIPT[@]}\" --parsable --hold \"$@\")\n[[ $JOB_ID =~ ^[0-9]+$ ]] || {\n    echo \"cluv did not return a job ID; no job was released.\" >\u00262; exit 1;\n}\necho \"Submitted held job $JOB_ID on $CLUSTER\"\nif ! ssh \"$CLUSTER\" \"bash -lc 'mkdir -p \\\"\\$SCRATCH/bfm-zero/output/${CLUSTER}_${JOB_ID}\\\"'\"; then\n    echo \"Could not create the log directory. Job $JOB_ID remains held.\" >\u00262\n    exit 1\nfi\nif ((KEEP_HELD)); then\n    echo \"Job $JOB_ID remains held as requested.\"\nelse\n    ssh \"$CLUSTER\" \"scontrol release $JOB_ID\"\n    echo \"Released job $JOB_ID\"\nfi\n", "apptainer/bfm-zero.def": "Bootstrap: docker\nFrom: nvidia/cuda:12.4.1-runtime-ubuntu22.04\n\n# Only manifests enter the image. Source, data and outputs are mounted at runtime.\n%files\n    pyproject.toml /opt/bfm/pyproject.toml\n    uv.lock /opt/bfm/uv.lock\n\n%post\n    set -eu\n    export DEBIAN_FRONTEND=noninteractive\n    apt-get update\n    apt-get install -y --no-install-recommends python3.10 python3.10-venv python3.10-dev python3-pip \\\n        git ca-certificates build-essential ffmpeg libgl1 libegl1 libglib2.0-0 \\\n        libsm6 libxext6 libxrender1 libgomp1 libvulkan1 libxkbcommon0 libxi6 \\\n        libxrandr2 libxcursor1 libxinerama1 libxt6 libglu1-mesa libnss3 libasound2\n    python3.10 -m pip install --no-cache-dir uv==0.13.6\n    cd /opt/bfm\n    # Frozen uses the supplied lock exactly; does not modify the checkout's lock.\n    UV_CACHE_DIR=/tmp/bfm-uv uv sync --frozen --no-dev --no-install-project --python /usr/bin/python3.10\n    mkdir -p /workspace/bfm-zero /home/bfm\n    uv pip freeze --python /opt/bfm/.venv/bin/python > /opt/bfm/installed-packages.txt\n\n%environment\n    export PATH=/opt/bfm/.venv/bin:$PATH\n    export PYTHONPATH=/workspace/bfm-zero\n    export MPLCONFIGDIR=/tmp/matplotlib\n    export MUJOCO_GL=egl\n    export OMNI_KIT_ACCEPT_EULA=YES\n    export ACCEPT_EULA=Y\n    export OMP_NUM_THREADS=1\n    export PYTHONUNBUFFERED=1\n\n%test\n    /opt/bfm/.venv/bin/python - \u003c\u003c'PY'\nimport importlib.util\nimport importlib.metadata\nimport torch, numpy, wandb, pydantic, mujoco\nfor package in ('isaacsim', 'isaaclab'):\n    assert importlib.util.find_spec(package), package\nfor package in ('torch', 'isaacsim', 'isaaclab', 'wandb'):\n    print(package, importlib.metadata.version(package))\nprint('Dependency imports passed. A GPU environment launch is a separate test.')\nPY\n\n%labels\n    org.bfm-zero.isaacsim 4.5.0\n    org.bfm-zero.isaaclab 2.0.2\n    org.bfm-zero.python 3.10\n", "apptainer/wandb-modern.def": "Bootstrap: localimage\nFrom: bfm-zero.sif\n\n# Logging-only derivative of the tested Isaac/CUDA image. New-format W\u0026B keys\n# cannot be used by the upstream lock's wandb 0.12.21. Keep ML dependencies fixed.\n%post\n    set -eu\n    export DEBIAN_FRONTEND=noninteractive\n    apt-get update\n    apt-get install -y --no-install-recommends python3.10-dev\n    rm -rf /var/lib/apt/lists/*\n    uv pip install --python /opt/bfm/.venv/bin/python --no-deps \\\n        wandb==0.27.1 protobuf==4.25.8\n    /opt/bfm/.venv/bin/python -c 'import wandb, platformdirs; assert wandb.__version__ == \"0.27.1\"'\n    uv pip freeze --python /opt/bfm/.venv/bin/python > /opt/bfm/installed-packages.txt\n\n%test\n    /opt/bfm/.venv/bin/python - \u003c\u003c'PY'\nimport torch, wandb, pydantic, mujoco, google.protobuf\nfrom pathlib import Path\nimport sysconfig\nassert wandb.__version__ == '0.27.1'\nassert google.protobuf.__version__ == '4.25.8'\nassert (Path(sysconfig.get_path('include')) / 'Python.h').is_file()\nprint('Logging derivative imports passed:', wandb.__version__)\nPY\n    TORCHINDUCTOR_COMPILE_THREADS=1 /opt/bfm/.venv/bin/python - \u003c\u003c'PY'\nimport torch\ntorch.set_num_threads(1)\ncompiled = torch.compile(lambda x: x.sin() + x * 2)\nx = torch.linspace(-1, 1, 16)\ntorch.testing.assert_close(compiled(x), x.sin() + x * 2)\nprint('torch.compile CPU kernel passed')\nPY\n\n%labels\n    org.bfm-zero.wandb 0.27.1\n    org.bfm-zero.protobuf 4.25.8\n"};
